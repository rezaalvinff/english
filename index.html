{t:"The Startup That Failed",lv:3,x:"Arga and his two best friends from university spent three years building an app that connected farmers directly with restaurants. They believed in it completely. They quit their jobs, borrowed money from their families, and worked eighty-hour weeks in a tiny rented office above a laundry shop.\n\nFor a while, it looked like it might work. They signed up two hundred farmers and forty restaurants. A newspaper wrote an article about them. An investor took them out to an expensive dinner and talked about a big future.\n\nThen the investor changed his mind. A larger competitor launched a similar app with ten times their budget. Their money ran out faster than they had planned. In the final months, they stopped paying themselves. Arga lived on instant noodles and his savings disappeared.\n\nThe hardest day was the one when they called every farmer to tell them the app was shutting down. Some were angry. Many were kind, which somehow felt worse.\n\nAfterward, Arga felt like a complete failure. He avoided friends who asked what he was doing now. He moved back in with his parents at twenty-nine.\n\nIt took him almost a year to see things differently. In those three years, he'd learned more than in any job: how to sell, how to manage people, how to recover from disaster. When he finally applied for jobs, interviewers were fascinated by his story.\n\nToday he leads the product team at an agriculture company. He keeps a framed copy of that old newspaper article in his office. “It's not there to remind me that I failed,” he says. “It's there to remind me that I tried.”",v:[["believed in it","yakin dengan itu"],["signed up","mendaftarkan"],["competitor","pesaing"],["ran out","habis"],["shutting down","ditutup"],["avoided","menghindari"],["fascinated by","terpesona oleh"]],q:[["Why did the startup fail?","The investor changed his mind and a bigger competitor launched."],["Why does he keep the article?","To remind him that he tried."]]},
{t:"The Choir",lv:3,x:"Pak Harun was seventy-three when his wife died. They had been married for forty-eight years, and he had no idea how to live alone. He didn't know how to cook rice properly or where she had kept the important documents. The silence in the house was enormous.\n\nHis daughter, worried, suggested he join something. He refused everything she suggested: a walking group, a gardening class, a mosque study circle. Eventually, mostly to stop her from asking, he agreed to visit a community choir for elderly people that met on Tuesday mornings.\n\nHe had never sung in his life, except quietly in the shower. On the first day, he stood at the back and moved his lips without making a sound.\n\nThe choir director, a cheerful woman named Bu Endang, didn't pressure him. But in the third week, she asked him to hold a low note for the bass section. He was terrible. Everyone laughed, including him, and for the first time in months, he felt something loosen in his chest.\n\nThe choir became the center of his week. He learned old songs from his youth and some he'd never heard. He made friends with a retired policeman who sang badly but loudly and a former teacher who corrected everyone's pronunciation.\n\nA year later, the choir performed at a city festival. Pak Harun stood in the front row. His daughter cried in the audience.\n\nAfterward, he told her: “Your mother always said I should sing more. I told her I couldn't. I think she just knew me better than I did.”",v:[["enormous","sangat besar"],["study circle","majelis taklim / kelompok kajian"],["choir","paduan suara"],["elderly","lansia"],["didn't pressure him","tidak memaksanya"],["bass section","bagian suara bas"],["loosen","mengendur / melega"]],q:[["Why did he agree to visit the choir?","Mostly to stop his daughter from asking."],["What did his wife always say?","That he should sing more."]]},
{t:"The Price of Perfection",lv:3,x:"Mira had been the top student in her class since elementary school. Her report cards were perfect, her teachers loved her, and her parents displayed her trophies in the living room for every guest to see.\n\nWhat nobody saw was the cost. She slept four hours a night during exam periods. A grade of ninety felt like failure. When she got a B in a university statistics course, she didn't eat for two days and told no one.\n\nIn her third year, she submitted a paper she had worked on for weeks, and her professor asked her to see him. She was certain it was about a mistake. Instead, he told her it was the best student paper he'd read in years. Then he said something she didn't expect.\n\n“But you look exhausted. Every time you hand something in, you look terrified. Are you okay?”\n\nShe opened her mouth to say she was fine, and instead started crying in his office.\n\nThe professor didn't try to fix anything. He just listened and then gave her the number of the university counseling service. It took her another month to call.\n\nCounseling was uncomfortable. She had to look at where her fear came from and admit that she didn't know who she was without the grades. Slowly, she learned to tolerate imperfection. She started handing in work that was good instead of flawless.\n\nHer grades dropped slightly. Her life improved enormously. She started sleeping, made friends, and discovered she liked painting, something she was not very good at, and enjoyed anyway.",v:[["report cards","rapor"],["displayed","memajang"],["exam periods","masa ujian"],["submitted","mengumpulkan"],["exhausted","sangat lelah"],["counseling service","layanan konseling"],["tolerate imperfection","menerima ketidaksempurnaan"],["flawless","tanpa cela"]],q:[["What did the professor notice?","That she looked exhausted and terrified."],["What did she start enjoying?","Painting, even though she wasn't very good at it."]]},
{t:"The Night Train to Surabaya",lv:3,x:"There was a time when I took the night train from Jakarta to Surabaya every month for work. Most people slept through the twelve-hour journey. I never could.\n\nInstead, I watched. The train had its own small society. There was always someone who brought far too much food and insisted on sharing it. There were young couples heading home to introduce partners to their families, sitting stiffly, rehearsing what they'd say. There were soldiers on leave, students returning from university, and old women who knew everyone's business within an hour.\n\nOn one trip, I sat across from a man in his sixties who held a small wooden box on his lap the entire time. He never let it go, not even when he dozed off. Around two in the morning, while the rest of the carriage slept, he noticed I was awake and started talking.\n\nThe box held his brother's ashes. They had argued thirty years ago over an inheritance and had not spoken since. His brother had died in Jakarta, alone, and the hospital had found his phone number in a wallet. He was taking him home to be buried next to their parents.\n\n“Thirty years,” he said. “And I can't remember what the money was for.”\n\nWe didn't say much after that. At dawn, as the train approached Surabaya, he thanked me for listening. I watched him walk down the platform, holding the box carefully with both hands.\n\nI called my own sister that afternoon. We hadn't spoken in two months. Nothing was wrong. I just wanted to hear her voice.",v:[["journey","perjalanan"],["stiffly","kaku"],["on leave","sedang cuti"],["dozed off","tertidur sebentar"],["carriage","gerbong"],["ashes","abu jenazah"],["inheritance","warisan"],["buried","dimakamkan"]],q:[["What was in the box?","His brother's ashes."],["What did the writer do that afternoon?","Called his/her sister."]]},
{t:"The Climate Strike",lv:3,x:"When Salsa was sixteen, she read a report about rising sea levels and realized that her grandmother's village on the north coast of Java might be underwater within her lifetime. She couldn't stop thinking about it.\n\nShe started small. She stood outside her school every Friday with a handmade sign. Most students walked past. Some laughed. A teacher told her she was wasting her time and should focus on exams.\n\nFor six weeks, she stood alone. Then two friends joined her. Then ten. A local journalist wrote a short article. By the end of the semester, more than a hundred students from four schools were joining her on Fridays.\n\nNot everyone was supportive. Her parents worried about her grades and her safety. Online, strangers called her naive, attention-seeking, a puppet of foreign organizations. Some comments were cruel enough that she stopped reading them.\n\nWhat surprised her most was that the hardest part wasn't the criticism. It was the feeling, on difficult days, that nothing she did would make any difference.\n\nThe group eventually shifted its focus from protests to practical action. They planted mangroves along the coast near her grandmother's village. They met with local officials about waste management. They taught younger students about climate change.\n\nSalsa is now studying environmental engineering. When people ask if the strikes achieved anything, she answers honestly: “I don't know if we changed policy. But we changed what a hundred teenagers thought they were capable of. That has to count for something.”",v:[["sea levels","permukaan laut"],["underwater","terendam"],["supportive","mendukung"],["naive","naif"],["attention-seeking","cari perhatian"],["mangroves","bakau"],["waste management","pengelolaan sampah"],["capable of","mampu"]],q:[["How long did Salsa stand alone?","Six weeks."],["What was the hardest part for her?","Feeling that nothing would make a difference."]]},
{t:"The Coffee Farmer",lv:3,x:"For most of his life, Pak Wayan sold his coffee beans to middlemen who arrived each harvest season in pickup trucks. They set the price, and he had no choice but to accept it. Some years, the price was so low that it barely covered the cost of fertilizer.\n\nHis daughter, Ayu, studied agriculture in Denpasar and came home with an idea. Instead of selling raw beans, they could process and roast the coffee themselves, give it a brand, and sell it directly to cafés.\n\nPak Wayan was skeptical. He had grown coffee for thirty years and had never tasted the finished drink from a café. “City people won't pay extra for coffee from a mountain they've never heard of,” he said.\n\nAyu persisted. She learned about processing methods from online videos and visiting farms. They lost an entire batch the first year when the beans fermented too long. They borrowed money to buy a small roaster.\n\nThe turning point came when a barista from a specialty café in Jakarta visited the farm. He tasted their coffee and was silent for a long moment. Then he ordered fifty kilograms on the spot.\n\nToday, their coffee is sold in cafés in three cities. Pak Wayan earns about four times what he used to. Other farmers in the village have joined them as a cooperative.\n\nThe first time Pak Wayan visited a Jakarta café and saw his name on the menu, he ordered a cup and drank it slowly. When the barista asked how it was, he said: “Too expensive.” Then he smiled and asked for a second one.",v:[["middlemen","tengkulak"],["harvest season","musim panen"],["fertilizer","pupuk"],["skeptical","ragu"],["persisted","tetap bertahan"],["fermented","terfermentasi"],["on the spot","saat itu juga"],["cooperative","koperasi"]],q:[["What was Ayu's idea?","Process, roast, and brand their coffee and sell it directly."],["What did Pak Wayan say about the café coffee?","Too expensive — then ordered a second cup."]]},
{t:"Ghosting",lv:3,x:"Tara and Bimo had been talking every day for three months. They'd met through a dating app, gone on six dates, and she'd started to think this might be something serious. He'd met her best friend. She knew the name of his childhood cat.\n\nThen, one Tuesday, he stopped replying. Her messages showed as read, but there was no response. She waited a day, then two. She told herself he was busy. After a week, she sent a short message: “Hey, is everything okay?” Read. No reply.\n\nShe went through every possibility. Had she said something wrong? Was he hurt? Was there someone else? The not knowing was worse than any rejection would have been. She found herself rereading their old conversations at two in the morning, searching for clues.\n\nHer friends said he was a coward and she should move on. She knew they were right, but knowing something and feeling it are different things.\n\nFive months later, she received a long message from him. He'd been going through a serious depression, he wrote, and had withdrawn from everyone, not just her. He wasn't asking to get back together. He just wanted to apologize for disappearing.\n\nTara read it several times. She felt sympathy, and also anger that he'd left her guessing for so long. Both feelings were true at the same time.\n\nShe replied with a short message wishing him well. Then she did something she'd been unable to do for months: she deleted the old conversation. Not out of anger, but because she finally had an ending, even if it wasn't the one she'd wanted.",v:[["ghosting","menghilang tanpa kabar"],["rejection","penolakan"],["clues","petunjuk"],["coward","pengecut"],["move on","melupakan dan melanjutkan hidup"],["withdrawn","menarik diri"],["sympathy","simpati"],["wishing him well","mendoakan yang terbaik"]],q:[["What was worse than rejection for Tara?","Not knowing."],["Why did Bimo disappear?","He was going through serious depression and withdrew from everyone."]]},
{t:"The Typo",lv:3,x:"Dimas had been working as a junior copywriter at an advertising agency for exactly two weeks when he was trusted with his first real task: proofreading the final version of a full-page newspaper ad for a major bank. The ad would run in every major newspaper the following morning.\n\nHe read it three times. It looked perfect. He sent it to print at eleven at night and went home feeling proud.\n\nAt six the next morning, his phone exploded with messages. The headline was supposed to say “Your Trusted Partner in Growth.” In huge letters across the top of the page, it said “Your Trusted Partner in Grwoth.”\n\nIt was already in hundreds of thousands of newspapers. Screenshots were circulating online. Someone had already made a joke video about it.\n\nDimas went to the office expecting to be fired. He had prepared a speech. His hands were shaking when the creative director called him into her office.\n\nShe let him finish his apology. Then she said, “Everyone in this building has made a mistake like this. Mine was worse. I once misspelled a client's name.” She explained that the agency had already contacted the bank, and to everyone's surprise, the bank was handling it with humor. They had posted on social media: “We're still growing. Our spelling, too.”\n\nThe post went viral, and the bank gained thousands of followers. The campaign ended up being more talked about than any ad they'd run that year.\n\nDimas wasn't fired. But for the next five years, every intern at the agency was told the story of “Grwoth.” He still proofreads everything backwards, one word at a time.",v:[["copywriter","penulis naskah iklan"],["trusted with","dipercaya untuk"],["proofreading","mengoreksi tulisan"],["circulating","beredar"],["fired","dipecat"],["misspelled","salah eja"],["went viral","viral"],["backwards","dari belakang"]],q:[["What was the typo?","'Grwoth' instead of 'Growth'."],["How did the bank respond?","With humor on social media, and gained followers."]]},
{t:"The Midwife's Hands",lv:3,x:"Mbok Sumi delivered her first baby when she was nineteen, under an oil lamp in a village with no road, no electricity, and no doctor within a day's walk. Over the next fifty years, she helped bring more than three thousand children into the world.\n\nShe had no formal training. She learned from her own grandmother, watching, carrying water, holding lamps, and later, guiding small heads into the world with her own hands. She knew by touch when a baby was turned the wrong way. She knew which herbs eased pain and which ones were only superstition.\n\nWhen the government built a health clinic in the village in the 1990s, a young midwife with a nursing diploma arrived. Many expected tension between the two women. At first, there was some. The young midwife saw old practices she considered dangerous. Mbok Sumi saw a young woman who had read many books but had never delivered a baby at three in the morning during a flood.\n\nThey surprised everyone by becoming partners. Mbok Sumi had the trust of the families, who often refused to go to the clinic. The young midwife had the medicine and the training to handle emergencies. Together, they convinced mothers to come in for checkups and brought the clinic to homes when they couldn't.\n\nIn the ten years they worked together, maternal deaths in the village dropped to almost zero.\n\nAt Mbok Sumi's funeral, the line of people stretched down the village road. Someone counted later and realized that most of the mourners had been delivered by her hands.",v:[["delivered a baby","membantu persalinan"],["formal training","pelatihan resmi"],["by touch","dengan sentuhan"],["superstition","takhayul"],["tension","ketegangan"],["checkups","pemeriksaan rutin"],["maternal deaths","kematian ibu"],["mourners","pelayat"]],q:[["What did each woman bring to the partnership?","Mbok Sumi had families' trust; the young midwife had medicine and training."],["What happened to maternal deaths?","They dropped to almost zero."]]},
{t:"The Long Distance Call",lv:3,x:"Every Sunday at nine in the evening, Hasan called his mother from Saudi Arabia, where he worked as a driver. It was the only fixed point in his week. For eight years, he never missed a call.\n\nThe conversations were rarely about anything important. She told him about the neighbor's goat, the price of chili, his younger sister's exams. He told her about the heat, the families he drove for, and the food he missed. Sometimes they talked for an hour. Sometimes, when the connection was bad, they just listened to each other breathe through the static, saying “Hello? Hello?” and laughing.\n\nHe sent most of his salary home. With it, his family rebuilt their house, paid for his sister's university, and bought a small rice field. Each improvement felt like a reward for the loneliness of being away.\n\nWhat he couldn't send home was himself. He missed his father's illness, his sister's graduation, and his best friend's wedding. He watched them all through blurry video calls.\n\nIn his ninth year, his mother asked him on a Sunday call: “When are you coming home for good?” She had asked many times before. This time, he didn't give his usual answer about one more contract.\n\nHe went home three months later. The first Sunday back, at nine o'clock, his phone didn't ring. He was sitting next to his mother on the porch, and for a long time, neither of them said anything at all. They didn't need to.",v:[["fixed point","titik tetap / patokan"],["static","suara gemeresik"],["rebuilt","membangun ulang"],["loneliness","kesepian"],["blurry","buram"],["for good","untuk selamanya"],["contract","kontrak"],["porch","teras"]],q:[["What couldn't Hasan send home?","Himself."],["What happened the first Sunday back?","The phone didn't ring; he was sitting with his mother."]]},
{t:"The Election",lv:3,x:"In a small town in Central Java, two candidates were running for village head. One was Pak Darmo, a wealthy landowner who had held the position for ten years. The other was Wulan, a thirty-two-year-old schoolteacher with no money and no political experience.\n\nNobody expected Wulan to win. Pak Darmo's family controlled most of the farmland, and many villagers owed him money or favors. In previous elections, people said, envelopes with cash had appeared mysteriously before voting day.\n\nWulan couldn't compete with money, so she competed with time. For six months, she visited every single house in the village, some of them three or four times. She didn't make big promises. She asked questions and wrote down the answers in a notebook: problems with the water supply, a road that flooded every year, a clinic that was always closed.\n\nShe published everything she'd heard on a board in the village square, organized by problem, with a simple plan for each one. People started gathering at the board to read it.\n\nThe week before the election, the envelopes appeared again. Many people took the money. But in the voting booth, alone, they made a different choice.\n\nWulan won by a hundred and twelve votes.\n\nHer first act was to fix the road that flooded. It took a year and a lot of arguing with the district government. When it was finished, Pak Darmo, to everyone's surprise, was one of the first to walk on it. He shook her hand in front of the whole village. It was, people said later, the most dignified thing he'd done in years.",v:[["running for","mencalonkan diri"],["village head","kepala desa"],["landowner","tuan tanah"],["owed him favors","berutang budi padanya"],["envelopes","amplop"],["voting booth","bilik suara"],["dignified","bermartabat"]],q:[["How did Wulan compete without money?","She visited every house and listened, then published a plan."],["What did she fix first?","The road that flooded."]]},
{t:"The Accent",lv:3,x:"Throughout his career as a software engineer in Singapore, Ferdi was embarrassed by his accent. He had learned English late, mostly from textbooks and video games, and his pronunciation carried the rhythm of his hometown in Medan. Colleagues sometimes asked him to repeat himself. Once, in a meeting, a manager imitated the way he pronounced a word, and everyone laughed.\n\nFerdi spent hundreds of hours trying to fix it. He watched accent reduction videos, recorded himself reading news articles, and practiced vowel sounds in front of the mirror. He improved, but never enough to feel comfortable. He avoided speaking in meetings unless he absolutely had to. His ideas often went unsaid, and sometimes other people suggested the same ideas and got the credit.\n\nThe change came from an unexpected place. His company hired a new director from Scotland whose accent was so strong that Ferdi understood perhaps sixty percent of what she said. Nobody asked her to repeat herself. Nobody imitated her. She spoke with complete confidence, and people simply adjusted.\n\nFerdi realized that the problem had never been his accent. It was the belief that his accent made him less intelligent, less professional, less worth listening to.\n\nIt didn't happen overnight. But he started speaking up in meetings, slowly at first. When someone asked him to repeat himself, he did so calmly, without apologizing. Two years later, he was leading a team of twelve engineers from nine countries.\n\nHis first rule as a team lead: “Nobody's accent is wrong. If you didn't understand, ask. That's your job, not theirs.”",v:[["embarrassed by","malu karena"],["pronunciation","pelafalan"],["imitated","menirukan"],["accent reduction","pengurangan aksen"],["got the credit","mendapat pujian / pengakuan"],["adjusted","menyesuaikan diri"],["overnight","dalam semalam"],["speaking up","angkat bicara"]],q:[["What changed Ferdi's thinking?","A Scottish director with a strong accent who spoke confidently."],["What is his first rule as team lead?","Nobody's accent is wrong; if you didn't understand, ask."]]},
{t:"The Last Bookstore in Town",lv:3,x:"When the last bookstore in our town announced it was closing, nobody was surprised. For years, the shop had been mostly empty. People bought books online or not at all. The owner, Pak Hadi, was sixty-eight and tired.\n\nWhat surprised everyone was what happened next. A group of high school students, who had spent afternoons there reading comics they couldn't afford, started a campaign. They made a short video in which they interviewed people about their memories of the shop. A retired teacher talked about finding her first poetry book there. A young mechanic said he'd learned to fix engines from secondhand manuals on the back shelf. A woman said she had met her husband while they both reached for the same novel.\n\nThe video spread across social media. People who hadn't been to the shop in years came back. Some bought books. Others simply came to say thank you.\n\nIt wasn't enough to make the shop profitable. Pak Hadi was honest about that. But the students had another idea: turn the shop into a community space. They organized reading nights, homework clubs, and a monthly book swap. Local cafés donated coffee. A university lent volunteers.\n\nThe bookstore survived, though not quite as a bookstore. It's now part shop, part library, part meeting place. Pak Hadi still sits behind the counter, but he rarely sells anything. Mostly, he recommends books to teenagers and pretends to be annoyed when they stay until closing time.\n\n“I thought I was selling books for forty years,” he told a reporter. “Apparently, I was building something. I just didn't know it.”",v:[["announced","mengumumkan"],["campaign","kampanye"],["secondhand manuals","buku panduan bekas"],["reached for","meraih"],["profitable","menguntungkan"],["book swap","tukar buku"],["counter","meja kasir"],["pretends","berpura-pura"]],q:[["Who started the campaign?","A group of high school students."],["What is the bookstore now?","Part shop, part library, part meeting place."]]},
{t:"Neighbors in the Flood",lv:3,x:"In the twelve years I lived on Jalan Melati, I knew my neighbors only by sight. We nodded to each other in the mornings, complained about parking, and attended each other's weddings out of obligation. Everyone kept their gates closed.\n\nThat changed during the floods of early 2020. It rained for two days without stopping. On the second night, water entered our street. By midnight, it was waist-deep. The power went out. Phones were dying. The elderly couple at the end of the street, Pak and Bu Wiryo, couldn't get out of their house.\n\nWithout anyone organizing it, people began to move. The young men from three houses down carried Bu Wiryo on a door they'd taken off its hinges, wading through the dark water. A family with a two-story house opened their upper floor to anyone who needed it. Twenty-three of us slept there that night, on mats and blankets, with someone's guitar and someone else's bag of crackers.\n\nWe stayed there for three days. Mothers cooked together on a gas stove. Teenagers charged phones with a small generator and kept a list of who needed medicine. Old feuds were forgotten. The man I'd argued with for years about a parking space lent me dry clothes.\n\nWhen the water finally went down, our houses were full of mud and our furniture was ruined. But something else had changed. Now, the gates on Jalan Melati are usually open. We have a group chat. Every year, on the anniversary of the flood, we hold a meal together on the street.\n\nI wouldn't wish that flood on anyone. But I'm grateful for what it left behind.",v:[["by sight","sebatas kenal wajah"],["out of obligation","karena kewajiban"],["waist-deep","setinggi pinggang"],["hinges","engsel"],["wading","mengarungi air"],["generator","genset"],["feuds","permusuhan"],["anniversary","peringatan tahunan"]],q:[["How was Bu Wiryo rescued?","Young men carried her on a door through the water."],["What does the street do every year now?","Hold a meal together on the street."]]},
{t:"What the River Remembers",lv:3,x:"My grandfather used to say that the Ciliwung River had a memory. When he was a boy in the 1950s, he said, the water was clear enough to see fish. Children swam in it. Women washed clothes on the rocks and sang. On the banks, there were bamboo groves so thick that the afternoon light came through green.\n\nI grew up in the same neighborhood, but by then the river was brown, crowded with plastic, and smelled sharply on hot days. Nobody swam. My mother warned me never to touch the water. I thought my grandfather's stories were exaggerated, the way old people always make the past more beautiful.\n\nWhen he died, I found a box of his old photographs. One of them showed a group of boys sitting on a rock in the middle of the river. The water around them was so clear you could see the bottom. One of the boys, grinning, was him.\n\nI kept looking at that photo for weeks. It was proof that the river had been different, and that meant it could be different again.\n\nI joined a community group that had been cleaning a section of the river every weekend. The work was disgusting and often felt hopeless: we'd clear a stretch of trash, and the next rain would bring more. But slowly, the group grew. Schools joined. Local businesses stopped dumping waste. The government built a small treatment plant.\n\nThe river isn't clear yet. It may never be what it was. But last month, a boy in our group shouted, pointing at the water. There, close to the surface, was a small silver fish.\n\nI took a picture. It's next to my grandfather's photo now.",v:[["bamboo groves","rumpun bambu"],["exaggerated","dilebih-lebihkan"],["grinning","menyeringai lebar"],["proof","bukti"],["disgusting","menjijikkan"],["hopeless","sia-sia"],["dumping waste","membuang limbah"],["treatment plant","instalasi pengolahan"]],q:[["What did the old photo prove?","That the river had been clear, so it could change again."],["What did the boy see last month?","A small silver fish."]]}
);

n:[["Can I get...?","cara paling umum native memesan, lebih natural dari 'I want'"],["For here or to go?","makan di tempat atau bungkus"],["That'd be great","= that would be great, sopan dan hangat"],["seven fifty","cara menyebut 7.50 (dolar)"]]},
{t:"Running Late",lv:1,s:"Menelepon teman karena telat",p:["Ryan","Sophie"],l:[
[0,"Hey, I'm so sorry. I'm running a little late.","Hei, maaf banget. Aku agak telat."],
[1,"No worries. How late are we talking?","Santai. Telatnya kira-kira berapa lama?"],
[0,"Like fifteen minutes? Traffic's crazy right now.","Sekitar lima belas menit? Lalu lintasnya parah banget sekarang."],
[1,"Ugh, it's always bad on Fridays.","Duh, Jumat memang selalu parah."],
[0,"Tell me about it. Do you wanna go in and grab a table?","Banget. Kamu mau masuk duluan dan ambil meja?"],
[1,"Sure, I'll get us a spot by the window.","Boleh, aku cariin tempat dekat jendela."],
[0,"Perfect. Order me a drink if they come by.","Sip. Pesankan aku minum kalau pelayannya datang."],
[1,"The usual?","Yang biasa?"],
[0,"You know me too well.","Kamu kenal aku banget."],
[1,"Ha! Drive safe. See you soon.","Haha! Hati-hati nyetirnya. Sampai ketemu."]],
n:[["running late","sedang telat (masih di jalan)"],["How late are we talking?","gaya santai untuk tanya 'telatnya berapa lama?'"],["Tell me about it","bukan minta cerita! artinya 'setuju banget'"],["wanna","= want to (diucapkan cepat)"],["The usual?","pesanan yang biasa"]]},
{t:"At the Doctor's",lv:1,s:"Pasien bicara dengan dokter",p:["Doctor","Patient"],l:[
[0,"So, what brings you in today?","Jadi, ada keluhan apa hari ini?"],
[1,"I've had a sore throat for about three days.","Tenggorokan saya sakit sudah sekitar tiga hari."],
[0,"Any fever or cough?","Ada demam atau batuk?"],
[1,"A little fever last night. And I feel really tired.","Sedikit demam tadi malam. Dan saya merasa capek banget."],
[0,"Okay. Let me take a look. Open wide and say 'ah'.","Oke. Saya periksa ya. Buka mulut lebar dan bilang 'aa'."],
[1,"Ahhh.","Aaa."],
[0,"Yeah, it's pretty red. Looks like a viral infection.","Iya, cukup merah. Sepertinya infeksi virus."],
[1,"Do I need antibiotics?","Saya perlu antibiotik?"],
[0,"No, antibiotics won't help with a virus. Rest, drink lots of water, and take something for the pain.","Tidak, antibiotik tidak membantu untuk virus. Istirahat, banyak minum air, dan minum obat pereda nyeri."],
[1,"Got it. How long will it last?","Oke. Berapa lama biasanya?"],
[0,"Usually about a week. Come back if it gets worse.","Biasanya sekitar seminggu. Kembali lagi kalau makin parah."]],
n:[["What brings you in today?","pertanyaan khas dokter = 'ada keluhan apa?'"],["sore throat","sakit tenggorokan"],["Got it","saya paham"],["if it gets worse","kalau tambah parah"]]},
{t:"Weekend Plans",lv:1,s:"Rekan kerja ngobrol hari Jumat",p:["Mike","Lisa"],l:[
[0,"Any plans for the weekend?","Ada rencana buat akhir pekan?"],
[1,"Not really. Probably just gonna chill at home. You?","Nggak juga. Paling cuma santai di rumah. Kamu?"],
[0,"My cousin's getting married on Saturday.","Sepupuku nikah hari Sabtu."],
[1,"Oh nice! Big wedding?","Wah asyik! Nikahannya besar?"],
[0,"Huge. Like, four hundred people.","Besar banget. Sekitar empat ratus orang."],
[1,"Wow. Are you giving a speech or anything?","Wow. Kamu kasih sambutan atau apa gitu?"],
[0,"Thank God, no. I'm just there for the food.","Syukurlah, nggak. Aku cuma datang buat makanannya."],
[1,"Ha! Honestly, same.","Haha! Jujur, sama."],
[0,"What about Sunday?","Kalau Minggu?"],
[1,"I might go for a run if I can drag myself out of bed.","Mungkin lari pagi kalau aku bisa memaksa diri bangun dari kasur."],
[0,"Good luck with that.","Semoga berhasil."]],
n:[["chill","santai-santai"],["gonna","= going to"],["Thank God, no","syukurlah, tidak"],["Honestly, same","jujur, aku juga — sangat umum dalam obrolan santai"],["drag myself out of bed","memaksakan diri bangun (malas)"]]},
{t:"Asking for Directions",lv:1,s:"Turis bertanya arah di jalan",p:["Tourist","Local"],l:[
[0,"Excuse me, sorry to bother you. Do you know where the train station is?","Permisi, maaf mengganggu. Tahu di mana stasiun kereta?"],
[1,"Sure. It's not too far. Go straight down this street.","Tentu. Tidak terlalu jauh. Lurus saja di jalan ini."],
[0,"Okay, straight.","Oke, lurus."],
[1,"Then take a left at the second traffic light.","Lalu belok kiri di lampu merah kedua."],
[0,"Second light, left. Got it.","Lampu kedua, kiri. Oke."],
[1,"You'll see a big bank on the corner. The station's right across from it.","Kamu akan lihat bank besar di pojok. Stasiunnya tepat di seberangnya."],
[0,"How long does it take to walk?","Jalan kaki berapa lama?"],
[1,"About ten minutes. You can't miss it.","Sekitar sepuluh menit. Pasti kelihatan kok."],
[0,"Thanks so much!","Makasih banyak!"],
[1,"No problem. Have a good one!","Sama-sama. Semoga harimu menyenangkan!"]],
n:[["sorry to bother you","maaf mengganggu — pembuka sopan"],["take a left","belok kiri"],["right across from","tepat di seberang"],["You can't miss it","pasti kelihatan / gampang ditemukan"],["Have a good one!","ucapan perpisahan santai = have a good day"]]},
{t:"New Coworker",lv:1,s:"Hari pertama karyawan baru di kantor",p:["Sarah","Tom"],l:[
[0,"Hi, you must be the new guy. I'm Sarah.","Hai, kamu pasti orang baru ya. Aku Sarah."],
[1,"Hi Sarah, I'm Tom. Nice to meet you.","Hai Sarah, aku Tom. Senang kenalan."],
[0,"Nice to meet you too. How's your first day going?","Senang kenalan juga. Hari pertamanya gimana?"],
[1,"So far so good. A little overwhelming, though.","Sejauh ini baik. Agak kewalahan sih."],
[0,"Totally normal. Everyone feels that way at first.","Wajar banget. Semua orang merasa begitu awalnya."],
[1,"Good to know. Where's the kitchen, by the way?","Lega dengarnya. Omong-omong, dapurnya di mana?"],
[0,"Down the hall, on your right. The coffee machine is a bit tricky.","Di ujung lorong, sebelah kanan. Mesin kopinya agak ribet."],
[1,"Tricky how?","Ribetnya gimana?"],
[0,"You have to hit it twice. Don't ask why.","Kamu harus pukul dua kali. Jangan tanya kenapa."],
[1,"Ha, okay. Thanks for the tip.","Haha, oke. Makasih tipsnya."],
[0,"Anytime. Let me know if you need anything.","Kapan saja. Kabari kalau butuh apa-apa."]],
n:[["you must be...","kamu pasti... (menebak dengan sopan)"],["So far so good","sejauh ini baik-baik saja"],["overwhelming","bikin kewalahan"],["tricky","ribet / susah-susah gampang"],["Anytime","sama-sama, kapan saja"]]},
{t:"At the Restaurant",lv:1,s:"Pelayan dan dua tamu di restoran",p:["Waiter","Guest"],l:[
[0,"Good evening! Do you have a reservation?","Selamat malam! Sudah reservasi?"],
[1,"Uh, no, we don't. Do you have a table for two?","Eh, belum. Ada meja untuk dua orang?"],
[0,"Let me check. Yeah, right this way.","Saya cek dulu. Ada, silakan lewat sini."],
[1,"Thanks.","Terima kasih."],
[0,"Here are your menus. Can I start you off with something to drink?","Ini menunya. Mau pesan minum dulu?"],
[1,"Just water for now, please.","Air putih dulu saja."],
[0,"Sparkling or still?","Yang bersoda atau biasa?"],
[1,"Still is fine.","Yang biasa saja."],
[0,"Great. I'll give you a few minutes with the menu.","Baik. Silakan lihat-lihat menunya dulu."],
[1,"Actually, what do you recommend?","Sebenarnya, apa yang kamu rekomendasikan?"],
[0,"The grilled salmon is really popular. And the pasta's homemade.","Salmon panggangnya favorit banget. Pastanya juga buatan sendiri."],
[1,"Sounds good. We'll need a minute.","Kedengarannya enak. Kami pikir-pikir dulu sebentar."]],
n:[["right this way","silakan lewat sini"],["Can I start you off with...","pembuka khas pelayan untuk tawar minuman"],["Sparkling or still?","air soda atau air biasa"],["homemade","buatan sendiri"],["We'll need a minute","kami butuh waktu sebentar"]]},
{t:"Shopping for Clothes",lv:1,s:"Belanja baju di toko",p:["Staff","Shopper"],l:[
[0,"Hi, are you finding everything okay?","Hai, sudah ketemu yang dicari?"],
[1,"Yeah, I'm just looking, thanks.","Iya, saya lihat-lihat saja, makasih."],
[0,"No problem. Just let me know if you need a different size.","Oke. Kabari saja kalau butuh ukuran lain."],
[1,"Actually, do you have this in a medium?","Sebenarnya, yang ini ada ukuran M?"],
[0,"Let me check in the back. One sec.","Saya cek di belakang ya. Sebentar."],
[0,"Here you go. The fitting rooms are over there.","Ini dia. Kamar pasnya di sebelah sana."],
[1,"Thanks. ... Hmm, it's a little tight around the shoulders.","Makasih. ... Hmm, agak sempit di bagian bahu."],
[0,"Want to try a large?","Mau coba ukuran L?"],
[1,"Sure, let's see.","Boleh, coba deh."],
[1,"Oh, this one fits perfectly. I'll take it.","Oh, yang ini pas banget. Saya ambil."],
[0,"Great choice. It's actually twenty percent off today.","Pilihan bagus. Hari ini diskon dua puluh persen loh."],
[1,"Even better!","Makin mantap!"]],
n:[["I'm just looking","saya cuma lihat-lihat"],["One sec","= one second, sebentar"],["fitting rooms","kamar pas"],["It fits perfectly","pas sekali (ukuran)"],["I'll take it","saya beli yang ini"],["twenty percent off","diskon 20%"]]},
{t:"Talking About the Weather",lv:1,s:"Basa-basi tetangga soal cuaca",p:["Neighbor 1","Neighbor 2"],l:[
[0,"Morning! Crazy weather, huh?","Pagi! Cuacanya aneh ya?"],
[1,"I know, right? It was so hot yesterday, and now it's pouring.","Iya kan? Kemarin panas banget, sekarang hujan deras."],
[0,"I got completely soaked on the way to the bus.","Aku basah kuyup waktu jalan ke halte."],
[1,"Oh no. Didn't you bring an umbrella?","Waduh. Nggak bawa payung?"],
[0,"I forgot it at the office. Classic me.","Ketinggalan di kantor. Khas aku banget."],
[1,"Ha! They say it's gonna rain all week.","Haha! Katanya bakal hujan seminggu penuh."],
[0,"Seriously? Ugh. I was hoping to dry my laundry outside.","Serius? Duh. Aku berharap bisa jemur baju di luar."],
[1,"Yeah, good luck with that.","Iya, semoga beruntung deh."],
[0,"Well, stay dry!","Ya sudah, jangan sampai kebasahan ya!"],
[1,"You too!","Kamu juga!"]],
n:[["I know, right?","setuju banget! (sangat umum)"],["pouring","hujan deras"],["soaked","basah kuyup"],["Classic me","khas aku banget (menertawakan diri sendiri)"],["Stay dry!","ucapan perpisahan saat hujan"]]},
{t:"Calling in Sick",lv:1,s:"Karyawan menelepon atasan karena sakit",p:["Employee","Manager"],l:[
[0,"Hi, it's Andi. Sorry to call so early.","Halo, ini Andi. Maaf telepon pagi-pagi."],
[1,"Hey Andi, no problem. What's up?","Hai Andi, tidak apa. Ada apa?"],
[0,"I'm not feeling well. I think I've got the flu.","Saya kurang enak badan. Sepertinya saya kena flu."],
[1,"Oh no, that's no good. Do you have a fever?","Aduh, kasihan. Demam?"],
[0,"Yeah, and a pretty bad headache.","Iya, dan sakit kepala lumayan parah."],
[1,"Okay, take the day off. Just focus on getting better.","Oke, libur saja hari ini. Fokus untuk sembuh."],
[0,"Thanks. I'll check my email if anything urgent comes up.","Makasih. Saya akan cek email kalau ada yang mendesak."],
[1,"Don't worry about it. Someone can cover for you.","Jangan dipikirkan. Ada yang bisa gantikan kamu."],
[0,"I really appreciate it.","Saya sangat menghargainya."],
[1,"Feel better soon!","Cepat sembuh ya!"]],
n:[["I'm not feeling well","saya kurang enak badan"],["take the day off","ambil libur hari ini"],["comes up","muncul / terjadi"],["cover for you","menggantikanmu"],["Feel better soon!","cepat sembuh!"]]},
{t:"At the Hotel",lv:1,s:"Check-in di hotel",p:["Receptionist","Guest"],l:[
[0,"Welcome! Checking in?","Selamat datang! Mau check-in?"],
[1,"Yes, I have a reservation under the name Putri.","Iya, saya ada reservasi atas nama Putri."],
[0,"Let me pull that up. Okay, three nights, a double room. Is that right?","Saya cari dulu. Oke, tiga malam, kamar double. Benar?"],
[1,"That's right.","Betul."],
[0,"Can I see your ID and a credit card for incidentals?","Boleh lihat ID dan kartu kredit untuk biaya tambahan?"],
[1,"Sure, here you go.","Tentu, ini."],
[0,"Thank you. You're in room 512. Breakfast is from six-thirty to ten.","Terima kasih. Kamarnya 512. Sarapan jam setengah tujuh sampai sepuluh."],
[1,"Great. What's the Wi-Fi password?","Oke. Password Wi-Fi-nya apa?"],
[0,"It's on the card with your key. Anything else I can help with?","Ada di kartu bersama kuncinya. Ada lagi yang bisa saya bantu?"],
[1,"What time is checkout?","Check-out jam berapa?"],
[0,"Eleven a.m. Enjoy your stay!","Jam sebelas pagi. Selamat menginap!"]],
n:[["under the name","atas nama"],["pull that up","membuka data (di komputer)"],["incidentals","biaya tambahan (minibar, dll)"],["Here you go","ini (saat menyerahkan sesuatu)"],["Enjoy your stay!","selamat menginap!"]]},
{t:"Making Plans for Dinner",lv:1,s:"Pasangan memutuskan makan malam",p:["Dan","Mia"],l:[
[0,"What do you feel like for dinner?","Kamu lagi pengin makan apa malam ini?"],
[1,"I don't know. What do you feel like?","Nggak tahu. Kamu pengin apa?"],
[0,"I asked you first.","Aku tanya duluan."],
[1,"Okay, okay. Maybe Thai?","Oke, oke. Mungkin makanan Thailand?"],
[0,"We had Thai on Tuesday.","Kita udah makan Thai hari Selasa."],
[1,"Right. Pizza?","Iya ya. Pizza?"],
[0,"Eh, I'm not really in the mood for pizza.","Eh, aku lagi nggak mood pizza."],
[1,"Then you pick!","Ya udah kamu yang pilih!"],
[0,"How about we just cook something?","Gimana kalau kita masak aja?"],
[1,"With what? The fridge is basically empty.","Pakai apa? Kulkasnya hampir kosong."],
[0,"Fine. Pizza it is.","Ya sudah. Pizza deh."],
[1,"Told you.","Kan sudah aku bilang."]],
n:[["What do you feel like?","lagi pengin apa? (makanan/kegiatan)"],["I'm not in the mood for...","lagi nggak mood ..."],["basically","pada dasarnya / bisa dibilang"],["Pizza it is","oke, pizza saja (keputusan final)"],["Told you","kan sudah aku bilang"]]},
{t:"Lost Phone",lv:1,s:"Mencari HP yang hilang di rumah",p:["Ben","Anna"],l:[
[0,"Have you seen my phone anywhere?","Kamu lihat HP-ku nggak?"],
[1,"Not since this morning. Did you check the couch?","Nggak sejak tadi pagi. Udah cek di sofa?"],
[0,"Yeah, I looked everywhere.","Udah, aku cari ke mana-mana."],
[1,"Want me to call it?","Mau aku teleponin?"],
[0,"Please. It's on silent, though.","Tolong. Tapi lagi mode senyap."],
[1,"Of course it is.","Ya pasti lah."],
[0,"Wait... what's that buzzing?","Tunggu... itu suara getar apa?"],
[1,"It's coming from... your pocket.","Asalnya dari... kantongmu."],
[0,"Oh my God. It was in my pocket the whole time.","Ya ampun. Ternyata dari tadi di kantongku."],
[1,"You're unbelievable.","Kamu ini ada-ada aja."]],
n:[["on silent","dalam mode senyap"],["Of course it is","ya iyalah (nada menyindir)"],["buzzing","getaran / dengung"],["the whole time","dari tadi / sepanjang waktu"],["You're unbelievable","kamu ini ada-ada saja (bercanda)"]]},
{t:"At the Pharmacy",lv:1,s:"Membeli obat di apotek",p:["Pharmacist","Customer"],l:[
[0,"Hi, how can I help?","Hai, ada yang bisa dibantu?"],
[1,"Hi, I need something for a headache.","Hai, saya butuh obat untuk sakit kepala."],
[0,"Sure. Are you allergic to any medication?","Baik. Ada alergi obat?"],
[1,"Not that I know of.","Sepengetahuan saya tidak ada."],
[0,"Okay, these are ibuprofen. Take one every six hours with food.","Oke, ini ibuprofen. Minum satu setiap enam jam, setelah makan."],
[1,"With food, got it. Can I take it with coffee?","Setelah makan, oke. Boleh diminum sama kopi?"],
[0,"It's fine, but water is better.","Boleh, tapi lebih baik air putih."],
[1,"Okay. How much is it?","Oke. Berapa harganya?"],
[0,"Four dollars. If it doesn't get better in a few days, see a doctor.","Empat dolar. Kalau beberapa hari tidak membaik, periksa ke dokter."],
[1,"Will do. Thanks a lot.","Siap. Makasih banyak."]],
n:[["Not that I know of","sepengetahuan saya tidak"],["every six hours","setiap enam jam"],["with food","bersama/setelah makan"],["see a doctor","periksa ke dokter"]]},
{t:"Catching Up on the Phone",lv:1,s:"Anak menelepon ibunya",p:["Mom","Kevin"],l:[
[0,"Hi, sweetie! I haven't heard from you in ages.","Halo, sayang! Lama banget nggak ada kabar."],
[1,"I know, sorry, Mom. Work's been crazy.","Iya, maaf Ma. Kerjaan lagi gila-gilaan."],
[0,"Are you eating properly?","Kamu makannya teratur?"],
[1,"Yes, Mom. I promise.","Iya Ma. Janji."],
[0,"Real food? Not just noodles?","Makanan beneran? Bukan cuma mi?"],
[1,"Mostly real food.","Sebagian besar makanan beneran."],
[0,"Mostly. Hmm. When are you coming home?","Sebagian besar. Hmm. Kapan pulang?"],
[1,"Maybe next month. I'll let you know.","Mungkin bulan depan. Nanti aku kabari."],
[0,"Okay. Your dad says hi.","Oke. Papa titip salam."],
[1,"Tell him I said hi back. Love you, Mom.","Bilang salam balik dariku. Sayang Mama."],
[0,"Love you too. Call more often!","Sayang kamu juga. Sering-sering telepon!"]],
n:[["I haven't heard from you in ages","lama sekali tidak ada kabar"],["Work's been crazy","kerjaan lagi sibuk banget"],["properly","dengan benar / teratur"],["says hi","titip salam"],["Tell him I said hi back","sampaikan salam balik"]]},
{t:"Booking a Table",lv:1,s:"Reservasi restoran lewat telepon",p:["Host","Caller"],l:[
[0,"Good afternoon, Bella Cucina. How can I help you?","Selamat siang, Bella Cucina. Ada yang bisa dibantu?"],
[1,"Hi, I'd like to book a table for Saturday night.","Hai, saya mau pesan meja untuk Sabtu malam."],
[0,"Sure. For how many people?","Baik. Untuk berapa orang?"],
[1,"Four, please.","Empat orang."],
[0,"And what time were you thinking?","Dan jam berapa rencananya?"],
[1,"Around seven-thirty?","Sekitar setengah delapan?"],
[0,"Let me see... We're fully booked at seven-thirty. How about eight?","Saya cek... Jam setengah delapan sudah penuh. Bagaimana kalau jam delapan?"],
[1,"Eight works.","Jam delapan oke."],
[0,"Great. Can I get a name and phone number?","Baik. Boleh minta nama dan nomor telepon?"],
[1,"It's Rina, and my number is 0812 3456 789.","Rina, nomornya 0812 3456 789."],
[0,"Perfect. See you Saturday!","Sip. Sampai jumpa Sabtu!"]],
n:[["I'd like to book","saya ingin memesan"],["What time were you thinking?","rencananya jam berapa? (sopan)"],["fully booked","penuh"],["Eight works","jam delapan bisa (works = cocok)"]]},
{t:"Complaining About Work",lv:1,s:"Dua teman ngobrol soal kerjaan",p:["Chris","Nina"],l:[
[0,"You look exhausted.","Kamu kelihatan capek banget."],
[1,"I am. I've been working late every night this week.","Iya. Seminggu ini aku lembur terus tiap malam."],
[0,"That's rough. What's going on?","Berat ya. Ada apa?"],
[1,"We've got a huge deadline on Friday, and half the team is out sick.","Ada tenggat besar hari Jumat, dan setengah tim lagi sakit."],
[0,"Ugh, that's the worst.","Duh, itu yang paling nggak enak."],
[1,"Yeah. My boss keeps adding stuff to my plate too.","Iya. Bosku juga terus nambahin kerjaan ke aku."],
[0,"Have you talked to him about it?","Udah ngomong sama dia?"],
[1,"Not yet. I don't wanna look like I can't handle it.","Belum. Aku nggak mau kelihatan nggak sanggup."],
[0,"Honestly, you should. You can't keep this up forever.","Jujur, kamu harus ngomong. Kamu nggak bisa begini terus."],
[1,"Yeah, you're right. Maybe after Friday.","Iya, kamu benar. Mungkin setelah Jumat."]],
n:[["That's rough","itu berat ya (empati)"],["out sick","tidak masuk karena sakit"],["adding stuff to my plate","menambah beban kerja"],["handle it","menanganinya / sanggup"],["You can't keep this up","kamu tidak bisa terus begini"]]},
{t:"Getting a Haircut",lv:1,s:"Di barbershop",p:["Barber","Customer"],l:[
[0,"Hey man, what are we doing today?","Halo bro, mau dipotong gimana hari ini?"],
[1,"Just a trim, please. It's getting a bit long.","Dirapikan saja. Sudah agak panjang."],
[0,"Sure. How short on the sides?","Oke. Sampingnya mau seberapa pendek?"],
[1,"Not too short. Maybe a number three?","Jangan terlalu pendek. Mungkin nomor tiga?"],
[0,"And the top?","Bagian atasnya?"],
[1,"Just take a little off. Like an inch.","Potong sedikit saja. Sekitar dua senti."],
[0,"Got it. Want me to clean up the beard too?","Oke. Jenggotnya mau dirapikan juga?"],
[1,"Yeah, why not.","Boleh, kenapa nggak."],
[0,"All done. What do you think?","Selesai. Gimana menurutmu?"],
[1,"Looks great, man. Thanks.","Mantap bro. Makasih."]],
n:[["What are we doing today?","mau potong model apa? (khas barber)"],["Just a trim","dirapikan saja"],["number three","ukuran mesin cukur nomor 3"],["take a little off","potong sedikit"],["Why not","kenapa tidak / boleh"]]},
{t:"Meeting the Neighbors",lv:1,s:"Kenalan dengan tetangga baru",p:["Paul","Rachel"],l:[
[0,"Hi there! You just moved in next door, right?","Halo! Kamu baru pindah ke sebelah ya?"],
[1,"Yeah, last weekend. I'm Rachel.","Iya, minggu lalu. Aku Rachel."],
[0,"I'm Paul. Welcome to the building!","Aku Paul. Selamat datang di gedung ini!"],
[1,"Thanks! It seems really quiet here.","Makasih! Kelihatannya tenang banget di sini."],
[0,"It is, mostly. Except for the dog upstairs.","Iya, umumnya. Kecuali anjing di lantai atas."],
[1,"Oh, I heard him last night!","Oh, aku dengar dia tadi malam!"],
[0,"His name's Max. He's sweet, just loud.","Namanya Max. Dia baik, cuma berisik."],
[1,"Good to know. Is there a good place to eat around here?","Oke. Ada tempat makan enak di sekitar sini?"],
[0,"There's an amazing noodle place around the corner.","Ada tempat mi enak banget di tikungan sana."],
[1,"Perfect. I'll check it out.","Sip. Nanti aku coba."],
[0,"If you need anything, just knock.","Kalau butuh apa-apa, ketuk saja."]],
n:[["moved in","baru pindah ke"],["mostly","umumnya"],["around the corner","di tikungan / dekat sini"],["check it out","mencoba / melihat"],["just knock","ketuk saja (pintu)"]]},
{t:"Paying the Bill",lv:1,s:"Teman membayar di kafe",p:["Leo","Kate"],l:[
[0,"Can we get the check, please?","Boleh minta tagihannya?"],
[1,"I've got this one.","Yang ini aku yang bayar."],
[0,"No way, you paid last time.","Nggak boleh, kamu sudah bayar kemarin."],
[1,"Did I? I don't remember.","Masa? Aku nggak ingat."],
[0,"Yes, you did. Let's just split it.","Iya. Kita patungan aja."],
[1,"Fine. Fifty-fifty?","Oke. Bagi dua?"],
[0,"Sounds fair.","Adil."],
[1,"Should we leave a tip?","Kita kasih tip nggak?"],
[0,"Yeah, the service was great.","Iya, pelayanannya bagus."],
[1,"Okay, I'll add it to my card.","Oke, aku tambahin di kartuku."]],
n:[["the check","tagihan (Amerika); Inggris: the bill"],["I've got this one","yang ini aku traktir"],["split it","patungan / bagi rata"],["fifty-fifty","bagi dua sama rata"],["Sounds fair","adil"]]},
{t:"Video Call Problems",lv:1,s:"Rapat online yang bermasalah",p:["Amy","Josh"],l:[
[0,"Josh, can you hear me?","Josh, bisa dengar aku?"],
[1,"Sorry, you're breaking up a little.","Maaf, suaramu putus-putus."],
[0,"Is this better?","Sekarang lebih baik?"],
[1,"Yeah, much better. But I can't see you.","Iya, jauh lebih baik. Tapi aku nggak bisa lihat kamu."],
[0,"Oh, my camera's off. One sec.","Oh, kameraku mati. Sebentar."],
[1,"There you are!","Nah, kelihatan!"],
[0,"Sorry about that. My internet's been acting up all day.","Maaf ya. Internetku ngadat seharian."],
[1,"No worries. Mine froze twice this morning.","Santai. Punyaku dua kali nge-freeze tadi pagi."],
[0,"Okay, let's get started before it dies again.","Oke, ayo mulai sebelum mati lagi."],
[1,"Ha, good idea.","Haha, ide bagus."],
[0,"Wait, you're on mute.","Tunggu, kamu lagi di-mute."]],
n:[["You're breaking up","suaramu putus-putus"],["acting up","bermasalah / ngadat"],["froze","nge-freeze / macet"],["You're on mute","mikrofonmu mati (di-mute)"],["There you are!","nah, itu dia! (muncul)"]]},
{t:"At the Gym",lv:1,s:"Ngobrol di gym",p:["Gym-goer","Newbie"],l:[
[0,"Hey, are you using this bench?","Hei, bangku ini lagi dipakai?"],
[1,"No, go ahead. Actually, can I ask you something?","Nggak, silakan. Sebenarnya, boleh tanya sesuatu?"],
[0,"Sure, what's up?","Boleh, kenapa?"],
[1,"How do you use that machine? I'm kind of new here.","Gimana cara pakai mesin itu? Aku agak baru di sini."],
[0,"Oh, the cable machine? Pretty simple. You adjust the weight with this pin.","Oh, mesin kabel? Gampang kok. Atur bebannya pakai pin ini."],
[1,"Okay, and then?","Oke, terus?"],
[0,"Pull the handle down slowly, keep your back straight.","Tarik pegangannya ke bawah pelan-pelan, punggung tetap lurus."],
[1,"Like this?","Begini?"],
[0,"Yeah, perfect. Just don't go too heavy at first.","Iya, pas. Jangan terlalu berat dulu."],
[1,"Thanks, man. I appreciate it.","Makasih bro. Aku hargai."],
[0,"No problem. Everyone starts somewhere.","Sama-sama. Semua orang mulai dari nol."]],
n:[["Go ahead","silakan"],["kind of new","agak baru"],["adjust","mengatur"],["don't go too heavy","jangan terlalu berat"],["Everyone starts somewhere","semua orang pernah jadi pemula"]]},
{t:"Taking a Taxi",lv:1,s:"Naik taksi ke bandara",p:["Driver","Passenger"],l:[
[0,"Where to?","Ke mana?"],
[1,"The airport, please. Terminal three.","Ke bandara, terminal tiga."],
[0,"Sure thing. What time's your flight?","Siap. Pesawatnya jam berapa?"],
[1,"Six-thirty. Do you think we'll make it?","Setengah tujuh. Menurutmu keburu nggak?"],
[0,"Should be fine if traffic's okay. About forty minutes.","Harusnya aman kalau lalu lintas lancar. Sekitar empat puluh menit."],
[1,"Okay, good.","Oke, bagus."],
[0,"Going anywhere nice?","Mau ke tempat yang asyik?"],
[1,"Just visiting family in Bali.","Cuma mengunjungi keluarga di Bali."],
[0,"Nice. Here we are. Terminal three.","Asyik. Sudah sampai. Terminal tiga."],
[1,"How much do I owe you?","Berapa ongkosnya?"],
[0,"Twenty-five dollars.","Dua puluh lima dolar."],
[1,"Here's thirty. Keep the change.","Ini tiga puluh. Kembaliannya ambil saja."]],
n:[["Where to?","ke mana? (khas sopir)"],["Sure thing","siap / tentu"],["make it","sempat / keburu"],["How much do I owe you?","berapa yang harus saya bayar?"],["Keep the change","kembaliannya untuk Anda"]]}
);

TALKS.push(
{t:"Movie Night",lv:1,s:"Memilih film untuk ditonton",p:["Sam","Jess"],l:[
[0,"Wanna watch a movie tonight?","Mau nonton film malam ini?"],
[1,"Sure! What are you in the mood for?","Boleh! Lagi pengin yang gimana?"],
[0,"Something funny. I've had a long week.","Yang lucu. Mingguku panjang banget."],
[1,"Have you seen that new comedy with the talking dog?","Udah nonton komedi baru yang ada anjing bisa ngomong?"],
[0,"No, is it any good?","Belum, bagus nggak?"],
[1,"My sister said it's hilarious.","Kata kakakku lucu banget."],
[0,"Okay, let's do it. I'll make popcorn.","Oke, ayo. Aku bikin popcorn."],
[1,"Extra butter, please.","Mentegnya yang banyak ya."],
[0,"Obviously.","Ya jelas."],
[1,"And no spoilers if you've read anything about it!","Dan jangan spoiler kalau kamu udah baca apa-apa soal filmnya!"],
[0,"My lips are sealed.","Mulutku terkunci."]],
n:[["Wanna","= want to"],["Is it any good?","bagus nggak sih?"],["hilarious","lucu sekali"],["Let's do it","ayo / setuju"],["My lips are sealed","aku janji tutup mulut"]]},
{t:"Returning an Item",lv:1,s:"Mengembalikan barang ke toko",p:["Customer","Clerk"],l:[
[0,"Hi, I'd like to return this, please.","Hai, saya mau mengembalikan barang ini."],
[1,"Sure. Was there a problem with it?","Baik. Ada masalah dengan barangnya?"],
[0,"Yeah, it stopped working after two days.","Iya, rusak setelah dua hari."],
[1,"I'm sorry about that. Do you have the receipt?","Mohon maaf. Ada struknya?"],
[0,"Yes, here it is.","Ada, ini."],
[1,"Thanks. Would you like a refund or an exchange?","Terima kasih. Mau uang kembali atau tukar barang?"],
[0,"Hmm, can I exchange it for the same one?","Hmm, bisa tukar dengan yang sama?"],
[1,"Let me check if we have it in stock. ... Yes, we do.","Saya cek stoknya. ... Ada."],
[0,"Great. Can you test it before I go?","Bagus. Bisa dites dulu sebelum saya pergi?"],
[1,"Of course. ... There you go, it works perfectly.","Tentu. ... Ini, berfungsi dengan baik."],
[0,"Perfect. Thanks for your help.","Sip. Terima kasih bantuannya."]],
n:[["return","mengembalikan (barang)"],["receipt","struk"],["refund or an exchange","uang kembali atau tukar barang"],["in stock","tersedia di stok"],["There you go","nah, ini dia"]]},
{t:"Talking About Hobbies",lv:1,s:"Kenalan dan ngobrol hobi",p:["Alex","Maya"],l:[
[0,"So what do you do for fun?","Jadi, kamu ngapain buat seru-seruan?"],
[1,"I'm really into photography lately.","Akhir-akhir ini aku lagi suka banget fotografi."],
[0,"Oh cool. Like, nature stuff?","Wah keren. Kayak foto alam gitu?"],
[1,"Mostly street photography. People, markets, that kind of thing.","Kebanyakan street photography. Orang, pasar, yang kayak gitu."],
[0,"That's awesome. Do you post them anywhere?","Mantap. Kamu posting di mana?"],
[1,"Just on Instagram. Nothing serious.","Cuma di Instagram. Nggak serius."],
[0,"I'd love to see them sometime.","Aku pengin lihat kapan-kapan."],
[1,"Sure! What about you? What are you into?","Boleh! Kalau kamu? Sukanya apa?"],
[0,"I'm kind of a nerd. I play board games a lot.","Aku agak kutu buku sih. Sering main board game."],
[1,"No way, me too! Have you played Catan?","Masa, aku juga! Pernah main Catan?"],
[0,"Are you kidding? It's my favorite.","Bercanda ya? Itu favoritku."]],
n:[["What do you do for fun?","hobimu apa? (cara natural tanya hobi)"],["I'm really into...","aku lagi suka banget..."],["that kind of thing","yang semacam itu"],["What are you into?","kamu sukanya apa?"],["Are you kidding?","bercanda ya? (= jelas iya)"]]},
{t:"At the Airport Check-in",lv:1,s:"Check-in penerbangan",p:["Agent","Traveler"],l:[
[0,"Good morning. Where are you flying today?","Selamat pagi. Terbang ke mana hari ini?"],
[1,"To Singapore.","Ke Singapura."],
[0,"Can I have your passport, please?","Boleh minta paspornya?"],
[1,"Here you go.","Ini."],
[0,"Are you checking any bags?","Ada bagasi yang mau dimasukkan?"],
[1,"Just this one.","Cuma yang ini."],
[0,"Please put it on the scale. ... Okay, that's fine. Window or aisle?","Silakan taruh di timbangan. ... Oke, aman. Mau dekat jendela atau lorong?"],
[1,"Aisle, please.","Lorong saja."],
[0,"Here's your boarding pass. You're boarding at gate twelve at nine-fifteen.","Ini boarding pass-nya. Naik pesawat di gate dua belas jam sembilan lima belas."],
[1,"Is the flight on time?","Pesawatnya tepat waktu?"],
[0,"Yes, everything's on schedule. Have a nice flight!","Iya, sesuai jadwal. Selamat terbang!"]],
n:[["checking any bags","memasukkan bagasi"],["scale","timbangan"],["Window or aisle?","kursi jendela atau lorong?"],["boarding","naik ke pesawat"],["on schedule","sesuai jadwal"]]},
{t:"Borrowing Something",lv:1,s:"Pinjam charger ke teman sekantor",p:["Nick","Hannah"],l:[
[0,"Hey, do you have a phone charger I could borrow?","Hei, punya charger HP yang bisa aku pinjam?"],
[1,"What kind of phone do you have?","HP-mu jenis apa?"],
[0,"An Android. USB-C.","Android. USB-C."],
[1,"Yeah, here. Just bring it back when you're done.","Ada, nih. Kembalikan ya kalau sudah."],
[0,"Of course. You're a lifesaver.","Pasti. Kamu penyelamatku."],
[1,"Battery dying again?","Baterai mau habis lagi?"],
[0,"Five percent. I forgot to charge it last night.","Lima persen. Lupa ngecas tadi malam."],
[1,"You say that every week.","Kamu bilang begitu tiap minggu."],
[0,"I know, I know. I should just buy a second charger.","Iya, iya. Harusnya aku beli charger kedua."],
[1,"Please do.","Tolong lakukan."]],
n:[["Could I borrow...?","boleh aku pinjam...?"],["when you're done","kalau sudah selesai"],["You're a lifesaver","kamu penyelamatku"],["dying","hampir habis (baterai)"],["I know, I know","iya, iya (mengaku salah)"]]},
{t:"Noisy Neighbor",lv:2,s:"Menegur tetangga yang berisik dengan sopan",p:["Laura","Neighbor"],l:[
[0,"Hey, sorry to bother you. I live downstairs.","Hai, maaf mengganggu. Saya tinggal di bawah."],
[1,"Oh, hi! Is everything okay?","Oh, hai! Ada apa?"],
[0,"Yeah, it's just... the music was pretty loud last night.","Iya, cuma... musiknya cukup keras tadi malam."],
[1,"Oh no, really? I'm so sorry. I had a few friends over.","Aduh, masa? Maaf banget. Ada beberapa teman main ke sini."],
[0,"No worries, it happens. It's just that I start work at six.","Santai, wajar kok. Cuma aku mulai kerja jam enam."],
[1,"Totally understand. I didn't realize the floors were that thin.","Paham banget. Aku nggak sadar lantainya setipis itu."],
[0,"Yeah, you can hear pretty much everything.","Iya, hampir semua kedengaran."],
[1,"Yikes. I'll keep it down from now on, I promise.","Waduh. Mulai sekarang aku pelankan, janji."],
[0,"Thanks, I really appreciate it.","Makasih, aku sangat menghargainya."],
[1,"And if it ever happens again, just text me.","Kalau terjadi lagi, kabari aku saja."],
[0,"Will do. Have a good one.","Siap. Selamat beraktivitas."]],
n:[["had a few friends over","mengundang teman ke rumah"],["It happens","wajar, bisa terjadi"],["It's just that...","cuma masalahnya..."],["Yikes","waduh / aduh"],["keep it down","memelankan suara"]]},
{t:"Job Interview Small Talk",lv:2,s:"Basa-basi sebelum wawancara kerja",p:["Interviewer","Candidate"],l:[
[0,"Hi, you must be Rizky. Thanks for coming in.","Hai, kamu pasti Rizky. Terima kasih sudah datang."],
[1,"Thanks for having me. It's great to be here.","Terima kasih atas kesempatannya. Senang bisa di sini."],
[0,"Did you find the office okay?","Kantornya gampang ditemukan?"],
[1,"Yeah, no problem. I got here a bit early, actually.","Iya, tidak masalah. Malah saya datang agak awal."],
[0,"Always a good sign. Can I get you some water or coffee?","Pertanda bagus. Mau air putih atau kopi?"],
[1,"Water would be great, thanks.","Air putih saja, terima kasih."],
[0,"So, tell me a little bit about yourself.","Jadi, ceritakan sedikit tentang dirimu."],
[1,"Sure. I've been working in digital marketing for about four years, mostly in performance ads.","Baik. Saya sudah bekerja di digital marketing sekitar empat tahun, kebanyakan di iklan performa."],
[0,"And what made you apply for this role?","Dan apa yang membuatmu melamar posisi ini?"],
[1,"Honestly, I've followed your campaigns for a while, and I love how data-driven they are.","Jujur, saya sudah lama mengikuti kampanye kalian, dan saya suka karena sangat berbasis data."],
[0,"That's great to hear. Let's dig into that a bit.","Senang mendengarnya. Mari kita bahas lebih dalam."]],
n:[["Thanks for having me","terima kasih sudah mengundang saya"],["Tell me a little bit about yourself","ceritakan tentang dirimu — pertanyaan wajib interview"],["what made you apply","apa yang membuatmu melamar"],["data-driven","berbasis data"],["dig into","membahas lebih dalam"]]},
{t:"Giving Advice to a Friend",lv:2,s:"Teman curhat soal pindah kerja",p:["Jordan","Priya"],l:[
[0,"Can I get your opinion on something?","Boleh minta pendapatmu soal sesuatu?"],
[1,"Of course. What's on your mind?","Tentu. Lagi mikirin apa?"],
[0,"I got a job offer from another company. Better pay, but it's way further from home.","Aku dapat tawaran kerja dari perusahaan lain. Gaji lebih baik, tapi jauh banget dari rumah."],
[1,"How much further are we talking?","Sejauh apa?"],
[0,"Like an hour and a half each way.","Sekitar satu setengah jam sekali jalan."],
[1,"Oof. That's three hours a day. That adds up.","Aduh. Itu tiga jam sehari. Lama-lama terasa."],
[0,"I know. But the money's really good.","Aku tahu. Tapi gajinya bagus banget."],
[1,"Could you negotiate working from home a couple of days a week?","Bisa nego kerja dari rumah beberapa hari seminggu?"],
[0,"Huh. I didn't even think of that.","Hah. Aku malah nggak kepikiran."],
[1,"It doesn't hurt to ask. Worst case, they say no.","Nggak ada salahnya tanya. Paling buruk, mereka bilang nggak."],
[0,"True. I'll bring it up tomorrow. Thanks, that really helps.","Benar. Besok aku bahas. Makasih, itu sangat membantu."]],
n:[["What's on your mind?","lagi mikirin apa?"],["each way","sekali jalan"],["That adds up","lama-lama jadi banyak"],["It doesn't hurt to ask","tidak ada salahnya bertanya"],["Worst case","skenario terburuknya"],["bring it up","mengangkat topik / membahas"]]},
{t:"Apartment Hunting",lv:2,s:"Melihat apartemen untuk disewa",p:["Agent","Renter"],l:[
[0,"So this is the living room. Lots of natural light, as you can see.","Jadi ini ruang tamunya. Banyak cahaya alami, seperti yang terlihat."],
[1,"It's nice. A bit smaller than in the photos, though.","Bagus. Tapi agak lebih kecil dari di foto."],
[0,"Photos can be a little generous. The bedroom's through here.","Foto memang kadang agak berlebihan. Kamar tidurnya di sini."],
[1,"Oh, this is a good size. Is the rent negotiable at all?","Oh, ini ukurannya pas. Harga sewanya bisa dinego?"],
[0,"There's a little wiggle room if you sign a one-year lease.","Ada sedikit ruang nego kalau kamu tanda tangan kontrak setahun."],
[1,"Are utilities included?","Sudah termasuk listrik dan air?"],
[0,"Water is, but electricity and internet are separate.","Air termasuk, tapi listrik dan internet terpisah."],
[1,"Got it. What are the neighbors like?","Oke. Tetangganya seperti apa?"],
[0,"Mostly young professionals. It's pretty quiet.","Kebanyakan pekerja muda. Cukup tenang."],
[1,"Can I think about it and get back to you by Friday?","Boleh aku pikirkan dulu dan kabari paling lambat Jumat?"],
[0,"Sure, but I've got two other viewings this week, so don't wait too long.","Boleh, tapi ada dua orang lain yang lihat minggu ini, jadi jangan terlalu lama."]],
n:[["negotiable","bisa ditawar"],["wiggle room","ruang untuk nego"],["lease","kontrak sewa"],["utilities","biaya listrik/air/gas"],["get back to you","mengabari kembali"],["viewings","kunjungan lihat properti"]]},
{t:"Splitting Chores",lv:2,s:"Teman sekamar membagi tugas rumah",p:["Tyler","Grace"],l:[
[0,"Hey, can we talk about the dishes situation?","Hei, boleh kita bahas soal cucian piring?"],
[1,"Uh oh. That doesn't sound good.","Waduh. Kedengarannya nggak enak."],
[0,"It's not a big deal. It's just that I feel like I'm doing them most of the time.","Bukan masalah besar. Cuma aku merasa aku yang paling sering nyuci."],
[1,"Yeah... that's fair. I've been slacking.","Iya... itu benar. Aku lagi malas-malasan."],
[0,"What if we made a schedule?","Gimana kalau kita bikin jadwal?"],
[1,"Like, alternating days?","Kayak gantian hari?"],
[0,"Or one person does dishes, the other takes out the trash and cleans the bathroom.","Atau satu orang cuci piring, yang lain buang sampah dan bersihin kamar mandi."],
[1,"Ooh, I'll take dishes. I hate cleaning the bathroom.","Ooh, aku ambil cuci piring. Aku benci bersihin kamar mandi."],
[0,"Ha, deal. We can switch every month if you want.","Haha, sepakat. Bisa tukar tiap bulan kalau mau."],
[1,"Sounds good. Sorry I've been a bit lazy.","Oke. Maaf aku agak malas belakangan ini."],
[0,"Don't worry about it. Thanks for being cool about it.","Nggak apa-apa. Makasih sudah santai menanggapinya."]],
n:[["It's not a big deal","bukan masalah besar"],["That's fair","itu masuk akal / adil"],["slacking","malas-malasan"],["take out the trash","buang sampah"],["Deal","sepakat"],["being cool about it","santai menanggapinya"]]},
{t:"Canceling Plans",lv:2,s:"Membatalkan janji dengan sopan",p:["Olivia","Mark"],l:[
[0,"Hey, I hate to do this, but can we reschedule tonight?","Hei, aku nggak enak ngomong ini, tapi bisa kita jadwal ulang malam ini?"],
[1,"Oh, sure. Everything okay?","Oh, boleh. Semuanya baik-baik saja?"],
[0,"Yeah, I'm just completely wiped out. Work was brutal today.","Iya, aku cuma capek banget. Kerjaan brutal hari ini."],
[1,"Totally get it. We can do it another time.","Paham banget. Bisa lain kali."],
[0,"Are you sure? I feel terrible. I know you booked the restaurant.","Yakin? Aku merasa nggak enak. Aku tahu kamu sudah pesan restorannya."],
[1,"Honestly, it's fine. I'll just move the reservation.","Jujur, nggak apa-apa. Aku pindahkan saja reservasinya."],
[0,"How about Thursday? My treat.","Gimana kalau Kamis? Aku traktir."],
[1,"Thursday works. And I'm holding you to that treat.","Kamis bisa. Dan aku tagih traktirannya ya."],
[0,"Ha, deal. Thanks for understanding.","Haha, sepakat. Makasih sudah pengertian."],
[1,"Of course. Get some rest!","Tentu. Istirahat ya!"]],
n:[["I hate to do this, but...","aku nggak enak, tapi... (sebelum minta maaf/batal)"],["reschedule","menjadwal ulang"],["wiped out","capek sekali"],["My treat","aku traktir"],["I'm holding you to that","aku tagih janjimu"]]},
{t:"Discussing a Movie",lv:2,s:"Teman membahas film yang baru ditonton",p:["Ethan","Zoe"],l:[
[0,"So? What did you think?","Gimana? Menurutmu?"],
[1,"Honestly? I'm not sure. The first half was amazing.","Jujur? Aku nggak yakin. Paruh pertamanya keren banget."],
[0,"And the second half?","Paruh keduanya?"],
[1,"It kind of lost me. The twist didn't really make sense.","Agak bikin aku bingung. Plot twist-nya nggak masuk akal."],
[0,"Really? I thought it was brilliant.","Masa? Menurutku brilian."],
[1,"Wait, how did the brother know about the money, though?","Tapi tunggu, gimana si kakak bisa tahu soal uangnya?"],
[0,"Remember the phone call at the beginning? That was the clue.","Ingat telepon di awal? Itu petunjuknya."],
[1,"Ohhh. Okay, I totally missed that.","Ohhh. Oke, aku benar-benar nggak ngeh."],
[0,"See? Now you have to watch it again.","Tuh kan? Sekarang kamu harus nonton lagi."],
[1,"Maybe. The acting was great, I'll give it that.","Mungkin. Aktingnya bagus, itu aku akui."]],
n:[["What did you think?","menurutmu gimana?"],["It lost me","aku jadi bingung / tidak bisa mengikuti"],["the twist","kejutan cerita"],["I totally missed that","aku sama sekali tidak menangkapnya"],["I'll give it that","itu aku akui"]]},
{t:"Bad Customer Service",lv:2,s:"Komplain ke customer service lewat telepon",p:["Agent","Customer"],l:[
[0,"Thank you for calling. My name is Dave. How can I help?","Terima kasih sudah menelepon. Saya Dave. Ada yang bisa dibantu?"],
[1,"Hi Dave. I was charged twice for the same order.","Hai Dave. Saya ditagih dua kali untuk pesanan yang sama."],
[0,"I'm sorry to hear that. Can I get your order number?","Mohon maaf. Boleh minta nomor pesanannya?"],
[1,"It's 4-8-2-7-1.","4-8-2-7-1."],
[0,"Thank you. ... Yes, I can see two charges here.","Terima kasih. ... Ya, saya lihat ada dua tagihan."],
[1,"Great. So can you refund one of them?","Oke. Jadi bisa dikembalikan salah satunya?"],
[0,"I'll need to put in a request with our billing team. It usually takes five to seven business days.","Saya perlu ajukan permintaan ke tim tagihan. Biasanya lima sampai tujuh hari kerja."],
[1,"Seven days? It was your mistake, though.","Tujuh hari? Padahal itu kesalahan kalian."],
[0,"I completely understand, and I apologize. I'll mark it as urgent.","Saya sangat paham, dan saya minta maaf. Saya tandai sebagai mendesak."],
[1,"Okay. Can I get a reference number?","Oke. Boleh minta nomor referensinya?"],
[0,"Of course. It's REF-3391. You'll also get an email confirmation.","Tentu. REF-3391. Anda juga akan dapat konfirmasi lewat email."],
[1,"Thanks, Dave. I appreciate your help.","Makasih Dave. Saya hargai bantuannya."]],
n:[["I was charged twice","saya ditagih dua kali"],["put in a request","mengajukan permintaan"],["business days","hari kerja"],["mark it as urgent","tandai sebagai mendesak"],["reference number","nomor referensi — selalu minta ini saat komplain"]]},
{t:"First Date",lv:2,s:"Kencan pertama di kafe",p:["Daniel","Chloe"],l:[
[0,"So, I have to ask. Is your profile picture really from Iceland?","Jadi, aku harus tanya. Foto profilmu beneran di Islandia?"],
[1,"Ha! Yeah, it is. I went last year with my sister.","Haha! Iya. Aku ke sana tahun lalu sama kakakku."],
[0,"That's so cool. Was it freezing?","Keren banget. Dingin banget nggak?"],
[1,"Absolutely freezing. But so worth it. Have you traveled much?","Dingin parah. Tapi sepadan banget. Kamu sering traveling?"],
[0,"Not as much as I'd like. Mostly around Southeast Asia.","Nggak sesering yang aku mau. Kebanyakan di Asia Tenggara."],
[1,"That's still awesome. What's your favorite place so far?","Itu tetap keren. Tempat favoritmu sejauh ini?"],
[0,"Probably Hoi An in Vietnam. The food was unreal.","Mungkin Hoi An di Vietnam. Makanannya luar biasa."],
[1,"I've heard great things! I'm such a foodie.","Aku dengar banyak hal bagus! Aku suka banget kuliner."],
[0,"Same. Okay, important question. Pineapple on pizza: yes or no?","Sama. Oke, pertanyaan penting. Nanas di pizza: ya atau tidak?"],
[1,"Yes. And I'm not apologizing for it.","Ya. Dan aku nggak mau minta maaf soal itu."],
[0,"Okay, I think this might actually work.","Oke, kayaknya ini bakal berhasil."]],
n:[["I have to ask","aku harus tanya (karena penasaran)"],["so worth it","sangat sepadan"],["Not as much as I'd like","tidak sesering yang aku mau"],["unreal","luar biasa (slang)"],["foodie","pecinta kuliner"]]},
{t:"Helping a Lost Tourist",lv:2,s:"Membantu turis yang bingung di stasiun",p:["Local","Tourist"],l:[
[0,"You look a little lost. Can I help you with something?","Kamu kelihatan agak bingung. Ada yang bisa aku bantu?"],
[1,"Oh, thank you! I'm trying to get to the old town, but these maps are confusing.","Oh, makasih! Aku mau ke kota tua, tapi petanya membingungkan."],
[0,"Yeah, they're not great. You need the red line.","Iya, memang kurang jelas. Kamu perlu jalur merah."],
[1,"The red line... which platform is that?","Jalur merah... peron yang mana?"],
[0,"Platform four, just down those stairs. But make sure you go toward the north.","Peron empat, turun tangga itu. Tapi pastikan arahnya ke utara."],
[1,"How many stops is it?","Berapa pemberhentian?"],
[0,"Five, I think. Get off at Central Market.","Lima, kayaknya. Turun di Central Market."],
[1,"Central Market. Got it. Is it walkable from there?","Central Market. Oke. Dari sana bisa jalan kaki?"],
[0,"Totally. It's like five minutes. Just follow the crowds.","Bisa banget. Sekitar lima menit. Ikuti saja keramaian orang."],
[1,"You're a lifesaver, thank you!","Kamu penyelamatku, makasih!"],
[0,"No problem. Enjoy your trip!","Sama-sama. Selamat jalan-jalan!"]],
n:[["You look a little lost","kamu tampak bingung"],["platform","peron"],["Get off at...","turun di..."],["walkable","bisa dijangkau jalan kaki"],["Follow the crowds","ikuti keramaian"]]},
{t:"Gossip at Work",lv:2,s:"Dua rekan kerja membicarakan kabar di kantor",p:["Megan","Ravi"],l:[
[0,"Did you hear the news?","Kamu sudah dengar beritanya?"],
[1,"No, what's going on?","Belum, ada apa?"],
[0,"Apparently, Steve's leaving.","Katanya, Steve mau keluar."],
[1,"Wait, seriously? Since when?","Tunggu, serius? Sejak kapan?"],
[0,"I just heard it this morning. He got an offer from a competitor.","Baru dengar tadi pagi. Dia dapat tawaran dari pesaing."],
[1,"Huh. I mean, good for him, I guess.","Hah. Maksudku, bagus buat dia, mungkin."],
[0,"But who's gonna take over his projects?","Tapi siapa yang bakal ambil alih proyeknya?"],
[1,"Please don't say me. I'm already swamped.","Tolong jangan bilang aku. Aku sudah kewalahan."],
[0,"Ha, I wouldn't bet on it. You're the only one who knows the system.","Haha, jangan terlalu berharap. Kamu satu-satunya yang paham sistemnya."],
[1,"Great. Just great.","Bagus. Bagus sekali. (sinis)"],
[0,"Anyway, keep it to yourself for now. It's not official yet.","Pokoknya, simpan dulu ya. Belum resmi."]],
n:[["Apparently","katanya / rupanya"],["Good for him","bagus untuknya"],["swamped","kewalahan"],["I wouldn't bet on it","jangan terlalu berharap"],["Keep it to yourself","rahasiakan"]]},
{t:"Ordering Food Delivery",lv:2,s:"Menelepon restoran untuk antar makanan",p:["Restaurant","Caller"],l:[
[0,"Golden Dragon, is this for pickup or delivery?","Golden Dragon, mau ambil sendiri atau diantar?"],
[1,"Delivery, please.","Diantar."],
[0,"What's the address?","Alamatnya?"],
[1,"It's 22 Maple Street, apartment 4B.","Jalan Maple nomor 22, apartemen 4B."],
[0,"And what would you like?","Mau pesan apa?"],
[1,"Can I get the kung pao chicken and two orders of fried rice?","Boleh pesan ayam kung pao dan dua porsi nasi goreng?"],
[0,"Do you want that spicy?","Mau pedas?"],
[1,"Medium spicy. Oh, and can you hold the peanuts? My friend's allergic.","Pedas sedang. Oh, dan bisa tanpa kacang? Temanku alergi."],
[0,"No problem, no peanuts. Anything to drink?","Bisa, tanpa kacang. Minumnya?"],
[1,"No, that's it. How long will it take?","Tidak, itu saja. Berapa lama?"],
[0,"About forty-five minutes. Your total is thirty-two dollars.","Sekitar empat puluh lima menit. Totalnya tiga puluh dua dolar."],
[1,"Perfect, thanks.","Sip, makasih."]],
n:[["pickup or delivery","ambil sendiri atau diantar"],["hold the peanuts","tanpa kacang (hold = jangan pakai)"],["allergic","alergi"],["That's it","itu saja"]]},
{t:"Car Trouble",lv:2,s:"Mobil mogok, minta tolong teman",p:["Kyle","Ana"],l:[
[0,"Hey, are you busy right now?","Hei, kamu lagi sibuk?"],
[1,"Not really, why? You sound stressed.","Nggak juga, kenapa? Kamu kedengaran stres."],
[0,"My car just died on the highway. I'm on the shoulder.","Mobilku barusan mogok di jalan tol. Aku di bahu jalan."],
[1,"Oh no! Are you okay?","Aduh! Kamu baik-baik saja?"],
[0,"Yeah, I'm fine. It just made a weird noise and then shut off.","Iya, aman. Tadi bunyi aneh terus mati."],
[1,"Did you call a tow truck?","Udah panggil derek?"],
[0,"Yeah, but they said it'll be like two hours.","Udah, tapi katanya sekitar dua jam."],
[1,"Two hours? That's ridiculous. Send me your location, I'll come pick you up.","Dua jam? Keterlaluan. Kirim lokasimu, aku jemput."],
[0,"Are you sure? I don't wanna ruin your evening.","Yakin? Aku nggak mau ganggu malammu."],
[1,"Don't be silly. That's what friends are for.","Jangan konyol. Gunanya teman ya untuk itu."],
[0,"You're the best. I owe you big time.","Kamu yang terbaik. Aku utang budi banget."]],
n:[["My car died","mobilku mogok"],["shoulder","bahu jalan"],["shut off","mati"],["tow truck","mobil derek"],["That's what friends are for","gunanya teman ya untuk itu"],["I owe you big time","aku berutang besar padamu"]]},
{t:"Talking About Family",lv:2,s:"Kenalan dan cerita soal keluarga",p:["Ivan","Lucy"],l:[
[0,"Do you have any brothers or sisters?","Kamu punya saudara?"],
[1,"Yeah, I've got two older brothers. I'm the baby of the family.","Iya, aku punya dua kakak laki-laki. Aku anak bungsu."],
[0,"Ha, so you were spoiled?","Haha, jadi kamu dimanja?"],
[1,"Kind of. But they teased me nonstop growing up.","Lumayan. Tapi waktu kecil mereka ngeledek aku terus."],
[0,"Sounds like my sister and me. Are you close now?","Kayak aku sama adikku. Sekarang kalian dekat?"],
[1,"Super close. We have a group chat that never stops.","Dekat banget. Kami punya grup chat yang nggak pernah sepi."],
[0,"That's nice. Do they live nearby?","Asyik. Mereka tinggal dekat?"],
[1,"One does. The other moved to Canada a few years ago.","Satu iya. Yang satu pindah ke Kanada beberapa tahun lalu."],
