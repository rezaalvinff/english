<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2441C4">
<title>English Setahun</title>
<style>
/* Layout: one-column phone app, sticky top bar + fixed bottom tab bar; reading text set like a paperback page. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#141B33; --muted:#5A6380; --line:#DCE1EC;
  --accent:#2441C4; --accent-soft:#E6EBFF; --mark:#FFE76A; --mark-ink:#141B33;
  --ok:#17845A; --ok-soft:#E1F4EA; --lv1:#17845A; --lv2:#B86E00; --lv3:#C2334F;
  --spk-a:#2441C4; --spk-b:#B4471F;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:Georgia,"Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#161D31; --ink:#E7EBF6; --muted:#98A2BD; --line:#283252;
  --accent:#8EA4FF; --accent-soft:#1E2A52; --mark:#5E5214; --mark-ink:#FFF6C2;
  --ok:#4CC98E; --ok-soft:#173528; --lv1:#4CC98E; --lv2:#F0A63A; --lv3:#F27A92;
  --spk-a:#8EA4FF; --spk-b:#F29B72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D31; --ink:#E7EBF6; --muted:#98A2BD; --line:#283252;
  --accent:#8EA4FF; --accent-soft:#1E2A52; --mark:#5E5214; --mark-ink:#FFF6C2;
  --ok:#4CC98E; --ok-soft:#173528; --lv1:#4CC98E; --lv2:#F0A63A; --lv3:#F27A92;
  --spk-a:#8EA4FF; --spk-b:#F29B72; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.brand{font-weight:800;letter-spacing:-.02em}
.brand b{background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:3px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
main{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-size:22px;line-height:1.25;margin:0;text-wrap:balance;letter-spacing:-.015em}
h3{font-size:15px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lv{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.lv1{color:var(--lv1)}.lv2{color:var(--lv2)}.lv3{color:var(--lv3)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-pri{background:var(--accent);color:var(--surface)}
.btn-sec{background:var(--accent-soft);color:var(--accent)}
.btn-ghost{background:none;border:1px solid var(--line)}
.btn-ok{background:var(--ok-soft);color:var(--ok)}
.btn svg{width:18px;height:18px}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--muted);width:28px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px}
.item .t small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check svg{width:13px;height:13px}
/* week plan */
.week-items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.week-items{grid-template-columns:1fr}}
.wk{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-width:0}
.wk .k{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk b{font-size:15px;line-height:1.3}
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.day:last-child{border-bottom:0}
.day span:first-child{font-weight:700;color:var(--accent);font-size:13px}
/* reading */
.page{font-family:var(--read);font-size:19px;line-height:1.75;max-width:62ch}
.page p{margin:0 0 1em}
.w{border-radius:3px;cursor:pointer}
.w.hit{background:var(--accent-soft)}
.sen.reading{background:var(--mark);color:var(--mark-ink);border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.player{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:4;background:var(--bg);padding-block:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.speed{display:flex;gap:4px;margin-left:auto}
.speed .chip{padding:5px 9px;font-size:12px}
.vocab{display:flex;flex-direction:column}
.vocab button{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0}
.vocab button:last-child{border-bottom:0}
.vocab .en{font-weight:700;color:var(--accent)}
details.q{border-bottom:1px solid var(--line);padding:10px 0}
details.q:last-child{border-bottom:0}
details.q summary{font-weight:600;cursor:pointer;list-style-position:outside}
details.q p{margin:6px 0 0;color:var(--ok);font-weight:600}
/* dialogue */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--surface)}
.av.a{background:var(--spk-a)}.av.b{background:var(--spk-b)}
.line .who{font-size:12px;font-weight:700;color:var(--muted)}
.line .en{font-size:17px;line-height:1.45;font-weight:500}
.line .id{font-size:13.5px;color:var(--muted);margin-top:3px}
.line.b{background:var(--bg)}
.line.playing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.hidetext .line .en{filter:blur(7px);user-select:none}
.hidetext .line.playing .en{filter:none}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.notes button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0}
.notes button:last-child{border-bottom:0}
.notes b{color:var(--accent)}
.notice{border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.notice.warn{background:var(--mark);color:var(--mark-ink)}
.footer-actions{display:flex;gap:10px;flex-wrap:wrap}
.footer-actions .btn{flex:1;min-width:140px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card b{display:block;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.tip{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<style>body{margin:0}</style>
</head>
<body>


<div class="top"><div class="top-in" id="top"></div></div>
<main id="main"></main>
<nav class="nav" aria-label="Menu utama"><div class="nav-in" id="nav"></div></nav>

<script>
window.STORIES = window.STORIES || [];
STORIES.push(
{t:"The Lost Umbrella",lv:1,x:"It was raining on Monday morning. Lina took the bus to work. She put her red umbrella next to her seat.\n\nWhen the bus stopped, Lina was looking at her phone. She jumped up and ran out the door. The bus drove away. Then she felt the rain on her head.\n\n“Oh no, my umbrella!” she said.\n\nAll day, Lina felt sad. It was a gift from her grandmother.\n\nIn the evening, she took the same bus home. The driver smiled at her and held up something red.\n\n“Is this yours?” he asked.\n\n“Yes! Thank you so much!” Lina said.\n\n“No problem. I see you every day. I knew it was yours.”\n\nLina smiled all the way home.",v:[["jumped up","berdiri dengan cepat"],["drove away","melaju pergi"],["a gift","hadiah"],["held up","mengangkat (untuk diperlihatkan)"],["No problem","sama-sama / bukan masalah"]],q:[["Why was the umbrella special to Lina?","It was a gift from her grandmother."],["Who found the umbrella?","The bus driver."]]},
{t:"My First Day at the Gym",lv:1,x:"Last week, I went to a gym for the first time. I was nervous. Everyone looked strong and fit.\n\nA trainer named Marco came to say hello. “First time here?” he asked. I said yes. He showed me the machines and told me how to use them.\n\nI started on the treadmill. I walked slowly for ten minutes. Then I tried to lift some weights. They were heavy! Marco laughed and gave me lighter ones.\n\nAfter one hour, I was tired and sweaty. But I felt good.\n\nThe next morning, my whole body hurt. I could not lift my arms. My roommate said, “That means it's working!”\n\nI'm going back on Friday.",v:[["nervous","gugup"],["fit","bugar"],["treadmill","mesin lari"],["lift weights","angkat beban"],["sweaty","berkeringat"],["my whole body hurt","seluruh badanku sakit"]],q:[["What did Marco do?","He showed the writer the machines and how to use them."],["Why did the writer's body hurt the next day?","Because of the exercise at the gym."]]},
{t:"The Wrong Order",lv:1,x:"Sam was very hungry. He ordered a cheeseburger and fries from a small restaurant near his office.\n\nTwenty minutes later, the waiter brought him a big bowl of soup.\n\n“Excuse me,” Sam said. “I think this is the wrong order. I asked for a cheeseburger.”\n\nThe waiter looked at his notes. “Oh, I'm so sorry! I'll fix it right away.”\n\nSam waited another fifteen minutes. He was very, very hungry now. Finally, the waiter came back with a cheeseburger, fries, and the soup.\n\n“The soup is free,” the waiter said. “Sorry for the wait.”\n\nSam tried the soup. It was delicious. Now he orders that soup every week.",v:[["ordered","memesan"],["wrong order","pesanan salah"],["right away","segera"],["Sorry for the wait","maaf sudah menunggu"],["delicious","enak sekali"]],q:[["What did Sam order?","A cheeseburger and fries."],["What does Sam order every week now?","The soup."]]},
{t:"A New Neighbor",lv:1,x:"A new family moved into the house next to mine. They had a lot of boxes and a big brown dog.\n\nOn Saturday, I baked some cookies and knocked on their door. A woman opened it. She looked tired.\n\n“Hi, I'm Dani. I live next door,” I said. “Welcome to the neighborhood!”\n\n“Oh, how nice! I'm Grace. Come in, but sorry about the mess,” she said.\n\nWe sat on two boxes and ate cookies. Her dog, Bear, put his head on my knee. Grace told me they moved from another city because of her new job.\n\nNow Grace and I walk our dogs together every evening. It's nice to have a friend next door.",v:[["moved into","pindah ke"],["next door","sebelah rumah"],["knocked on","mengetuk"],["sorry about the mess","maaf berantakan"],["neighborhood","lingkungan tempat tinggal"]],q:[["What did Dani bring?","Cookies."],["Why did Grace's family move?","Because of her new job."]]},
{t:"The Broken Alarm",lv:1,x:"Tom's alarm clock did not ring on Tuesday. He woke up and looked at his phone. It was 8:40! His meeting was at 9:00.\n\nHe jumped out of bed. He didn't take a shower. He put on a shirt and the same pants from yesterday. He didn't eat breakfast.\n\nHe ran to the train station and got on the train just in time. He arrived at the office at 8:58.\n\nHe was out of breath when he walked into the meeting room. But the room was empty.\n\nHis coworker walked by. “Tom? The meeting is tomorrow,” she said.\n\nTom sat down and laughed. Then he went to get some coffee and breakfast.",v:[["did not ring","tidak berbunyi"],["just in time","tepat waktu, nyaris telat"],["out of breath","terengah-engah"],["coworker","rekan kerja"],["walked by","lewat"]],q:[["What time was the meeting supposed to be?","At 9:00."],["Why was the room empty?","The meeting was the next day."]]},
{t:"Grandpa's Garden",lv:1,x:"Every summer, I stay with my grandpa in a small village. He has a big garden behind his house.\n\nHe grows tomatoes, chili peppers, corn, and beans. Every morning, we wake up at six and water the plants together. The air is cool and fresh.\n\nGrandpa knows the name of every bird in the trees. He tells me stories about when he was young.\n\nIn the afternoon, we pick vegetables. Grandma cooks them for dinner. Food from the garden always tastes better.\n\nLast year, Grandpa gave me some seeds. Now I have a small garden on my balcony in the city. When I water my plants, I think of him.",v:[["village","desa"],["grows","menanam"],["water the plants","menyiram tanaman"],["pick vegetables","memetik sayur"],["seeds","biji / benih"]],q:[["What time do they wake up?","At six."],["What did Grandpa give the writer?","Some seeds."]]},
{t:"Lost in the Mall",lv:1,x:"When I was five years old, I got lost in a big shopping mall.\n\nMy mom was buying shoes. I saw a toy store across the hall and walked there alone. I played with a toy car for a long time. When I looked up, my mom wasn't there.\n\nI started to cry. A security guard came to me. He was very kind. He asked my name and gave me a candy.\n\nThen I heard my name on the speaker. “We have a little boy named Rizky at the information desk.”\n\nA minute later, my mom ran to me and hugged me very tight. She was crying too.\n\nAfter that day, I always held her hand at the mall.",v:[["got lost","tersesat"],["across the hall","di seberang lorong"],["security guard","satpam"],["hugged","memeluk"],["held her hand","menggandeng tangannya"]],q:[["Where did Rizky go alone?","To a toy store."],["Who helped him?","A security guard."]]},
{t:"The Coffee Shop Job",lv:1,x:"Maya got her first job at a coffee shop when she was nineteen.\n\nOn her first day, she was very slow. She didn't know the names of the drinks. A customer asked for a “flat white,” and Maya said, “A what?”\n\nHer manager, Ben, was patient. He taught her how to make every drink. He said, “Don't worry. Everybody is slow at first.”\n\nAfter two weeks, Maya was much faster. She learned the names of the regular customers and their favorite drinks. An old man named Mr. Lee always ordered a hot tea with honey.\n\nOne day, Mr. Lee said, “You make the best tea in town.”\n\nMaya felt proud.",v:[["patient","sabar"],["at first","awalnya"],["regular customers","pelanggan tetap"],["proud","bangga"],["in town","di kota ini"]],q:[["What didn't Maya know on her first day?","The names of the drinks."],["What did Mr. Lee always order?","Hot tea with honey."]]},
{t:"A Rainy Day Inside",lv:1,x:"It rained all day on Sunday. We wanted to go to the beach, but we stayed home.\n\nAt first, my little sister was angry. “This is the worst day ever!” she said.\n\nSo my dad had an idea. We moved the sofa and made a fort with blankets and pillows. We put a lamp inside. It was like a little house.\n\nWe ate popcorn in the fort and watched old movies. Then we played cards. My dad lost every game. I think he lost on purpose.\n\nAt night, my sister fell asleep in the fort.\n\nThe next morning, she said, “Can it rain again next Sunday?”",v:[["stayed home","di rumah saja"],["the worst day ever","hari paling buruk"],["fort","benteng (mainan)"],["on purpose","sengaja"],["fell asleep","tertidur"]],q:[["What did the family make?","A fort with blankets and pillows."],["What did the sister want next Sunday?","She wanted it to rain again."]]},
{t:"Learning to Ride a Bike",lv:1,x:"I learned to ride a bike when I was twenty-three. I know, it's a little late.\n\nAs a kid, I was always scared of falling. My friends rode bikes everywhere, and I walked.\n\nLast year, I decided to try. My friend Andi lent me his old bike. We went to a quiet park early in the morning.\n\nI fell down five times on the first day. My knees were red. But Andi said, “Look up, not down. Keep pedaling.”\n\nOn the third day, I rode all the way around the park without falling. I screamed with happiness. People looked at me, but I didn't care.\n\nNow I ride my own bike to work.",v:[["scared of falling","takut jatuh"],["lent me","meminjamkan saya"],["Keep pedaling","terus kayuh"],["all the way around","keliling penuh"],["I didn't care","saya tidak peduli"]],q:[["How old was the writer when they learned?","Twenty-three."],["What advice did Andi give?","Look up, not down, and keep pedaling."]]},
{t:"The Birthday Surprise",lv:1,x:"It was my best friend Nia's birthday. She thought everybody forgot.\n\nAll day, nobody said “Happy birthday” to her. Not her family, not her friends. She sent me a message: “I guess I'm not important.”\n\nI felt bad, but I had to keep the secret.\n\nIn the evening, I asked her to come to a restaurant with me. When she walked in, the lights turned on and twenty people shouted, “Surprise!”\n\nNia covered her face with her hands. Then she started laughing and crying at the same time.\n\nLater she said to me, “I was so sad today. Now I'm the happiest person in the world.”",v:[["forgot","lupa"],["keep the secret","menjaga rahasia"],["shouted","berteriak"],["covered her face","menutup wajahnya"],["at the same time","pada waktu yang sama"]],q:[["What did Nia think in the morning?","She thought everybody forgot her birthday."],["How many people were at the restaurant?","Twenty people."]]},
{t:"The Cat Who Came Back",lv:1,x:"Our cat, Mochi, ran away on a Friday night. Someone left the door open.\n\nWe looked everywhere. We walked around the neighborhood and called her name. We put pictures of her on every street lamp. Nobody saw her.\n\nAfter one week, my mom said, “Maybe she found a new home.” I was very sad.\n\nThen, on the eighth night, I heard a sound at the window. Meow.\n\nIt was Mochi! She was dirty and thin, but she was okay. She walked inside like nothing happened and went straight to her food bowl.\n\nWe will never know where she went. Mochi still won't tell us.",v:[["ran away","kabur"],["looked everywhere","mencari ke mana-mana"],["street lamp","lampu jalan"],["like nothing happened","seolah tidak terjadi apa-apa"],["went straight to","langsung menuju"]],q:[["How did Mochi get out?","Someone left the door open."],["When did Mochi come back?","On the eighth night."]]},
{t:"A Day Without My Phone",lv:1,x:"Last Saturday, I forgot my phone at home. I only noticed when I was already on the train.\n\nAt first, I felt strange. My hand kept reaching into my pocket. I wanted to check the time, my messages, everything.\n\nOn the train, I looked out the window instead. I saw rice fields, small houses, and kids playing football.\n\nAt the market, I talked to a fruit seller for twenty minutes. He told me about his farm.\n\nFor lunch, I ate alone and just watched people walk by. It was peaceful.\n\nWhen I got home, I had forty-two messages. None of them were important.\n\nNow I try to leave my phone at home every Saturday.",v:[["noticed","menyadari"],["kept reaching into","terus merogoh"],["instead","sebagai gantinya"],["peaceful","tenang / damai"],["None of them","tidak satu pun"]],q:[["Where did the writer notice the phone was missing?","On the train."],["How many messages were there?","Forty-two."]]},
{t:"Cooking for the First Time",lv:1,x:"When I moved into my own apartment, I couldn't cook anything. I only ate instant noodles and fast food.\n\nOne day, I called my mom. “How do you make fried rice?” I asked.\n\nShe told me step by step. Cook the garlic and onion. Add the egg. Add the rice. Add soy sauce and salt.\n\nI tried it that night. The kitchen filled with smoke because the heat was too high. The rice was a little burnt, and I used too much salt.\n\nBut I ate all of it, and I was proud.\n\nNow I can make fried rice, soup, and pasta. My mom says, “Next, you can cook for me.”",v:[["instant noodles","mi instan"],["step by step","langkah demi langkah"],["filled with smoke","penuh asap"],["burnt","gosong"],["too much salt","terlalu banyak garam"]],q:[["Who taught the writer to make fried rice?","His/her mom, over the phone."],["What went wrong?","There was smoke, the rice was a little burnt, and it was too salty."]]},
{t:"The Kind Stranger",lv:1,x:"I was at a train station in a city I didn't know. My card didn't work at the ticket machine. I didn't have any cash.\n\nThe last train was in ten minutes. I didn't know what to do.\n\nAn old woman saw me. “Are you okay, dear?” she asked.\n\nI explained the problem. She opened her purse and paid for my ticket.\n\n“I can pay you back! Can I have your number?” I said.\n\nShe shook her head. “Just help someone else one day,” she said, and she walked away.\n\nI made my train. I never saw her again.\n\nBut last month, I paid for a student's lunch when his card didn't work. I thought of her.",v:[["cash","uang tunai"],["purse","dompet / tas kecil"],["pay you back","membayar kembali"],["shook her head","menggelengkan kepala"],["made my train","berhasil naik kereta"]],q:[["What was the problem?","The card didn't work and the writer had no cash."],["What did the woman ask in return?","To help someone else one day."]]},
{t:"Moving Day",lv:1,x:"Today we moved to a new house. It was a long day.\n\nWe woke up at five. My dad and my uncle carried the big things: the bed, the sofa, and the fridge. My mom packed the kitchen. My job was to carry the small boxes.\n\nThe truck was full. We drove for two hours. At the new house, we carried everything in again.\n\nAt eight in the evening, we were all very tired. Nothing was in the right place. We couldn't find the plates, so we ate pizza from the box, sitting on the floor.\n\nMy little brother said, “I like this house. Can we eat on the floor every night?”\n\nEverybody laughed.",v:[["carried","mengangkat / membawa"],["packed","mengemas"],["truck","truk"],["in the right place","di tempat yang benar"],["plates","piring"]],q:[["What was the writer's job?","To carry the small boxes."],["Why did they eat from the box?","They couldn't find the plates."]]},
{t:"The Library Card",lv:1,x:"When I was eight, my teacher took our class to the city library. I got my first library card that day. It had my name on it, and I felt very important.\n\nI borrowed three books about dinosaurs. I read them in two days.\n\nAfter that, I went to the library every Saturday with my father. The librarian, Mrs. Ratna, always kept new books for me. “I think you'll like this one,” she said.\n\nBecause of her, I read about space, animals, and other countries.\n\nI'm a teacher now. Last month, I took my students to the same library. Mrs. Ratna was still there. She remembered me.",v:[["borrowed","meminjam"],["librarian","pustakawan"],["kept ... for me","menyimpankan untuk saya"],["because of her","berkat dia"],["remembered me","ingat saya"]],q:[["What were the first books about?","Dinosaurs."],["What is the writer's job now?","A teacher."]]},
{t:"The Night Bus",lv:1,x:"I missed the last train, so I took the night bus home. It was almost midnight.\n\nThe bus was quiet. A man was sleeping in the back. Two nurses were talking about their long day at the hospital. A young woman was eating noodles from a cup.\n\nThe driver played soft music on the radio. Outside, the city lights went by. The streets were empty.\n\nI was tired, but I liked it. Everybody on the bus was going home after a long day, just like me.\n\nWhen I got off, I said, “Good night,” to the driver.\n\n“Get home safe,” he said.",v:[["missed","ketinggalan"],["almost midnight","hampir tengah malam"],["went by","berlalu"],["got off","turun (dari kendaraan)"],["Get home safe","hati-hati di jalan"]],q:[["Why did the writer take the night bus?","He/she missed the last train."],["What did the driver say?","Get home safe."]]},
{t:"Saving Money",lv:1,x:"Ari wanted to buy a new guitar. It cost three million rupiah. He had only two hundred thousand.\n\nHe made a plan. He stopped buying coffee at cafés and made coffee at home. He brought lunch from home instead of eating out. He sold his old video games online.\n\nEvery week, he put money in a jar on his desk. He wrote the total on a piece of paper.\n\nSome weeks were hard. His friends went to the movies, and he stayed home.\n\nAfter five months, he counted the money. Three million and fifty thousand rupiah!\n\nHe bought the guitar. With the extra fifty thousand, he bought guitar strings.",v:[["cost","seharga"],["eating out","makan di luar"],["sold","menjual"],["jar","toples"],["counted","menghitung"]],q:[["How did Ari save money?","He made coffee at home, brought lunch, and sold old games."],["How long did it take?","Five months."]]},
{t:"The Job Interview",lv:1,x:"Rina had a job interview at ten o'clock. She practiced her answers all night.\n\nIn the morning, she put on her best clothes. On the way, a car drove through a puddle and splashed water on her skirt.\n\nShe arrived at the office with a wet skirt. She wanted to go home. But she went in.\n\nThe interviewer looked at her skirt. Rina said, “Sorry, a car splashed me on the way here. But I'm still here, and I'm ready.”\n\nThe interviewer smiled. “I like that attitude,” she said.\n\nThe interview went well. Two days later, Rina got a phone call. She got the job.",v:[["practiced","berlatih"],["puddle","genangan air"],["splashed","mencipratkan"],["attitude","sikap"],["went well","berjalan lancar"]],q:[["What happened on the way?","A car splashed water on her skirt."],["Did she get the job?","Yes."]]},
{t:"Snow for the First Time",lv:1,x:"I grew up in a hot country. I never saw snow in real life, only in movies.\n\nLast December, I visited my cousin in Japan. One morning, she opened the curtains and said, “Look!”\n\nEverything was white. The cars, the trees, the roofs. Snow was falling slowly from the sky.\n\nI ran outside in my pajamas. The snow was cold and soft. I tried to catch it on my tongue. My cousin laughed at me from the window.\n\nThen I fell on the ice. Ouch!\n\nWe made a small snowman with a carrot nose. I took one hundred photos.\n\nMy fingers were frozen, but it was one of the best days of my life.",v:[["grew up","tumbuh besar"],["in real life","di dunia nyata"],["curtains","tirai / gorden"],["catch it on my tongue","menangkapnya dengan lidah"],["frozen","membeku"]],q:[["Where did the writer see snow?","In Japan."],["What did they make?","A small snowman with a carrot nose."]]},
{t:"The Talking Parrot",lv:1,x:"My aunt has a gray parrot named Charlie. Charlie can say about thirty words.\n\nHe says “Hello!” when people come in. He says “Bye-bye!” when they leave. And when the phone rings, he says, “Hello? Hello?” in my aunt's voice.\n\nOne day, a delivery man knocked on the door. Charlie shouted, “Come in!” The man opened the door and walked in. But my aunt was in the shower!\n\nShe heard someone in the house and screamed. The delivery man screamed too and ran outside.\n\nNow my aunt keeps the door locked. And Charlie learned a new word: “Help!”",v:[["parrot","burung beo"],["delivery man","kurir"],["in the shower","sedang mandi"],["screamed","menjerit"],["locked","terkunci"]],q:[["What does Charlie say when the phone rings?","Hello? Hello?"],["Why did the delivery man come in?","Charlie shouted 'Come in!'"]]},
{t:"Breakfast in Bed",lv:1,x:"It was Mother's Day. My brother and I wanted to surprise our mom with breakfast in bed.\n\nWe woke up very early and went quietly to the kitchen. My brother made toast. I made eggs and orange juice.\n\nBut the toast got burnt, and the smoke alarm started beeping. Beep! Beep! Beep!\n\nWe opened all the windows. I dropped an egg on the floor. My brother spilled the juice.\n\nThen our mom came into the kitchen in her pajamas. She looked at the mess. We were sure she was angry.\n\nBut she hugged us and said, “This is the best Mother's Day ever.”\n\nThen she helped us clean up and made pancakes for everyone.",v:[["toast","roti panggang"],["smoke alarm","alarm asap"],["dropped","menjatuhkan"],["spilled","menumpahkan"],["clean up","membereskan"]],q:[["What went wrong with the toast?","It got burnt."],["What did Mom make in the end?","Pancakes."]]},
{t:"The Old Photo",lv:1,x:"I was cleaning my grandmother's closet when I found a box of old photos.\n\nOne photo was black and white. It showed a young woman on a bicycle. She was laughing, and her hair was flying in the wind.\n\n“Who is this?” I asked my grandmother.\n\nShe took the photo and smiled. “That's me. I was eighteen,” she said.\n\nI couldn't believe it. I never thought about my grandmother being young.\n\nShe told me about that day. She rode her bike to the beach with her friends. She met my grandfather there for the first time.\n\nNow the photo is on her wall. Every time I see it, I remember that she had a whole life before me.",v:[["closet","lemari"],["black and white","hitam putih"],["flying in the wind","berkibar ditiup angin"],["I couldn't believe it","saya tidak percaya"],["a whole life","seluruh kehidupan"]],q:[["How old was the grandmother in the photo?","Eighteen."],["Who did she meet at the beach?","The writer's grandfather."]]},
{t:"Too Much Spicy Food",lv:1,x:"My friend Jack came to Indonesia for the first time. He said, “I love spicy food. Give me the hottest thing you have.”\n\nSo I took him to a small warung. I ordered ayam geprek with level ten chili.\n\nJack took one big bite. For two seconds, he smiled. Then his face turned red. His eyes were full of tears. He drank all of his iced tea in one go. Then he drank mine.\n\n“Water! More water!” he said.\n\nThe owner of the warung laughed and gave him a glass of milk. “Milk is better,” she said.\n\nAfter ten minutes, Jack could talk again. He said, “Okay. Maybe level two next time.”",v:[["the hottest thing","yang paling pedas"],["took a bite","menggigit"],["full of tears","penuh air mata"],["in one go","sekali teguk / sekaligus"],["owner","pemilik"]],q:[["What level of chili did they order?","Level ten."],["What did the owner give Jack?","A glass of milk."]]},
{t:"The Phone Call",lv:1,x:"My phone rang at three in the morning. I didn't know the number.\n\n“Hello?” I said, half asleep.\n\n“Hi, is this Pizza Palace? I want to order two large pizzas,” a man said.\n\n“No, sorry. Wrong number,” I said.\n\nTen minutes later, the phone rang again. It was the same man. “Hi, Pizza Palace?”\n\n“Still no,” I said.\n\nThe third time, I was awake, so I just said, “Pizza Palace, how can I help you?”\n\nHe ordered two pizzas with extra cheese. I wrote down nothing and said, “Thirty minutes.”\n\nI felt a little bad. But I really hope he found the real number.",v:[["half asleep","setengah tidur"],["wrong number","salah sambung"],["Still no","masih bukan"],["wrote down","mencatat"],["felt a little bad","merasa agak bersalah"]],q:[["What time did the phone ring?","At three in the morning."],["What did the writer do the third time?","Pretended to be Pizza Palace."]]},
{t:"The New Glasses",lv:1,x:"For a long time, I thought everything far away was a little blurry for everyone.\n\nI couldn't read the board at school. I sat in the front row. I couldn't see bus numbers until the bus was very close.\n\nWhen I was fifteen, my teacher told my parents, “I think your son needs an eye test.”\n\nAt the eye doctor, I read letters on the wall. I could only read the big ones. The doctor said, “You need glasses.”\n\nA week later, I put on my new glasses and walked outside. I looked up at a tree. I could see every leaf!\n\nI stood there for five minutes, looking at leaves. It was like a new world.",v:[["blurry","buram"],["the front row","barisan depan"],["eye test","tes mata"],["put on","memakai"],["every leaf","setiap daun"]],q:[["Who noticed the problem?","His teacher."],["What did he look at after getting glasses?","A tree and its leaves."]]},
{t:"Rainy Season Football",lv:1,x:"Every afternoon in the rainy season, the kids in my neighborhood played football in the field behind the mosque.\n\nThe field was full of mud. When it rained, nobody stopped playing. We slid in the mud and laughed. Our clothes were brown, and our faces were brown too.\n\nOur goals were two pairs of flip-flops. There was no referee, so we argued about every goal.\n\nWhen the call to prayer started at sunset, everybody ran home. Our mothers waited at the door and shouted, “Shower first! Don't touch anything!”\n\nNow I live in a city with nice football fields. But I miss that muddy field more than anything.",v:[["mud","lumpur"],["slid","meluncur / tergelincir"],["flip-flops","sandal jepit"],["argued","berdebat"],["I miss","saya rindu"]],q:[["What were the goals made of?","Flip-flops."],["When did the kids go home?","At sunset, at the call to prayer."]]}
);

STORIES.push(
{t:"The Haircut",lv:1,x:"I wanted a new look. I showed the barber a photo of a famous actor and said, “Like this, please.”\n\nThe barber nodded and started cutting. He talked about football the whole time. I didn't look in the mirror because I was busy with my phone.\n\nWhen he finished, I looked up. My hair was very, very short. I looked like a boiled egg.\n\n“Do you like it?” he asked.\n\n“It's... great,” I said. I didn't want to be rude.\n\nAt home, my sister laughed for five minutes. At work, everyone asked, “What happened?”\n\nBut after three weeks, my hair grew back a little. And honestly, it looked good. I went back to the same barber.",v:[["a new look","penampilan baru"],["barber","tukang cukur"],["nodded","mengangguk"],["rude","tidak sopan"],["grew back","tumbuh lagi"]],q:[["Why didn't he see the haircut early?","He was busy with his phone."],["Did he go back to the same barber?","Yes."]]},
{t:"The Best Teacher",lv:1,x:"In junior high school, I hated math. I always got bad grades. I thought I was just bad at it.\n\nThen we got a new teacher, Pak Budi. On the first day, he said, “There are no stupid questions in my class.”\n\nI didn't believe him. But one day, I asked a very simple question. Some students laughed. Pak Budi looked at them and said, “That's a great question. I'm sure many of you have the same one.”\n\nNobody laughed after that.\n\nHe stayed after class to help me. He used food and money to explain fractions. Slowly, math started to make sense.\n\nAt the end of the year, I got an A. I still remember his words.",v:[["hated","benci"],["bad grades","nilai jelek"],["stupid questions","pertanyaan bodoh"],["fractions","pecahan"],["make sense","masuk akal"]],q:[["What did Pak Budi say on the first day?","There are no stupid questions in my class."],["What grade did the writer get?","An A."]]},
{t:"The Traffic Jam",lv:1,x:"On Friday evening, I was driving home. Usually it takes forty minutes. That day, there was a huge traffic jam.\n\nThe cars didn't move for thirty minutes. I was hungry and tired. People were honking their horns.\n\nA man was selling snacks between the cars. I bought peanuts and a bottle of water through the window.\n\nThe woman in the car next to me opened her window. “Do you know what happened?” she asked.\n\n“No idea,” I said. We started chatting. She was a nurse. She had a long day too.\n\nThree hours later, I got home. I was exhausted. But I made a new friend. We still text each other sometimes.",v:[["traffic jam","macet"],["honking their horns","membunyikan klakson"],["No idea","tidak tahu sama sekali"],["chatting","mengobrol"],["exhausted","sangat lelah"]],q:[["How long does the drive usually take?","Forty minutes."],["What was the woman's job?","A nurse."]]},
{t:"The First Salary",lv:1,x:"When I got my first salary, I didn't know what to do with it.\n\nMy friends said, “Buy a new phone!” Another friend said, “Go on a trip!”\n\nBut I thought about my parents. They worked hard for many years so I could go to school.\n\nSo I took them to a nice restaurant. My father ordered a steak. He had never eaten steak before. He cut it very carefully, like a scientist.\n\n“It's good,” he said quietly. My mom kept looking at me and smiling.\n\nThe bill was big. Almost a quarter of my salary. But when I saw my father's face, I knew it was the best money I ever spent.",v:[["salary","gaji"],["go on a trip","jalan-jalan / bepergian"],["carefully","dengan hati-hati"],["the bill","tagihan"],["a quarter","seperempat"]],q:[["Where did the writer take the parents?","To a nice restaurant."],["What did the father order?","A steak."]]},
{t:"The Sleepover",lv:1,x:"When I was ten, I slept at my friend Dimas's house for the first time.\n\nWe played video games until midnight. His mom told us to sleep, but we kept talking under the blanket with a flashlight.\n\nAt one in the morning, we heard a strange noise from the kitchen. Scratch, scratch, scratch.\n\n“A ghost,” Dimas whispered.\n\nWe were too scared to move. We hid under the blanket and didn't sleep at all.\n\nIn the morning, his mom found the reason. A small mouse was in the kitchen. It was eating a piece of bread.\n\nWe told everybody at school about our night with the ghost. We didn't mention the mouse.",v:[["slept at","menginap di"],["flashlight","senter"],["strange noise","suara aneh"],["whispered","berbisik"],["didn't mention","tidak menyebut"]],q:[["What made the noise?","A small mouse."],["What did they tell people at school?","That they had a night with a ghost."]]},
{t:"Waiting at the Airport",lv:1,x:"My sister was coming home from Australia after two years. I went to the airport early. Very early. Two hours early.\n\nI waited at the arrival gate with a sign. It said, “WELCOME HOME, SIS!” in big letters.\n\nMany people came out. Families hugged. A little girl ran to her father. An old man cried when he saw his son.\n\nI watched all of them, and I started to feel emotional too.\n\nThen I saw my sister. Her hair was longer. She was pushing a big suitcase. She saw my sign and started laughing.\n\nShe dropped her suitcase and ran to me. We hugged for a long time. Two years felt like nothing.",v:[["arrival gate","pintu kedatangan"],["a sign","papan tulisan"],["emotional","terharu"],["suitcase","koper"],["felt like nothing","terasa sebentar sekali"]],q:[["Where was the sister coming from?","Australia."],["What did the sign say?","Welcome home, sis!"]]},
{t:"The Lucky Shirt",lv:1,x:"My uncle believes in his lucky shirt. It's a blue football shirt from 2010. It has a small hole on the side.\n\nWhenever his team plays an important match, he wears it. He says the team never loses when he wears it.\n\nOne day, my aunt washed the shirt and it was still wet before the final match. My uncle was very worried. He tried to dry it with a hair dryer for thirty minutes.\n\nHe wore the shirt a little wet. His team won 2-1.\n\n“See?” he said. “The shirt works!”\n\nI didn't tell him that his team also won three matches when he wasn't wearing it.",v:[["believes in","percaya pada"],["a hole","lubang"],["whenever","setiap kali"],["worried","khawatir"],["hair dryer","pengering rambut"]],q:[["What color is the shirt?","Blue."],["How did he dry the shirt?","With a hair dryer."]]},
{t:"Ramadan Evenings",lv:1,x:"My favorite time of the year is Ramadan. I love the evenings most.\n\nAround five o'clock, the streets get busy. People buy snacks for breaking the fast: sweet drinks, fried food, and cakes. The smell of fried bananas is everywhere.\n\nAt home, my mom prepares the table. We sit together and wait. Everyone is hungry and a little quiet.\n\nThen we hear the call to prayer from the mosque. We drink something sweet first and eat dates.\n\nAfter dinner, my father and I walk to the mosque together. On the way back, the night air is cool, and the street is full of neighbors saying hello.\n\nIt feels like the whole neighborhood is one big family.",v:[["breaking the fast","berbuka puasa"],["prepares the table","menyiapkan meja"],["dates","kurma"],["call to prayer","azan"],["the whole neighborhood","seluruh lingkungan"]],q:[["What do people buy around five o'clock?","Snacks for breaking the fast."],["What do they eat first?","Something sweet and dates."]]},
{t:"The Interview That Went Wrong",lv:2,x:"Fajar had been preparing for this interview for weeks. It was for a marketing position at a company he'd admired since college. He'd researched their campaigns, memorized his answers, and even practiced in front of the mirror.\n\nThe interview started well. The manager seemed friendly, and Fajar was relaxed. Then she asked, “Can you tell me about a time you failed?”\n\nHis mind went completely blank. He'd prepared for every question except that one. He started talking about a group project in college, then changed the story halfway through, then forgot what his point was.\n\n“Sorry,” he finally said. “I'm usually better at this.”\n\nThe manager smiled. “Actually, that's a pretty good example of failing,” she said. “How would you handle it next time?”\n\nFajar laughed, took a breath, and gave an honest answer. He talked about how he panics when he isn't prepared and how he's learning to slow down.\n\nA week later, he got an email. He didn't get the job. But the manager wrote, “We were impressed by your honesty. There's another position opening soon. Would you be interested?”\n\nThree months later, he was working there.",v:[["had been preparing","sudah mempersiapkan (sejak lama)"],["admired","kagumi"],["went completely blank","blank / kosong total"],["halfway through","di tengah jalan"],["handle it","menanganinya"],["impressed by","terkesan dengan"]],q:[["Which question surprised Fajar?","Tell me about a time you failed."],["What impressed the manager?","His honesty."]]},
{t:"A Note on the Car",lv:2,x:"When Hana came back to the parking lot, she found a long scratch on the side of her car. Her heart sank. The car was only three months old.\n\nThen she noticed a piece of paper under the windshield wiper. She expected an advertisement, but it was a handwritten note.\n\n“I'm really sorry. I hit your car while I was parking. It was completely my fault. Please call me and I'll pay for the repair. — Arif” There was a phone number at the bottom.\n\nHana stood there for a moment. Part of her was still annoyed about the scratch. But mostly, she was surprised. She couldn't remember the last time a stranger had done something like this.\n\nShe called the number. Arif answered on the first ring and apologized again. He met her at the repair shop the next day and paid the whole bill without complaining.\n\nAs they were leaving, Hana said, “Most people would have just driven away.”\n\nArif shrugged. “I thought about it for about five seconds,” he admitted. “Then I imagined how I'd feel if it were my car.”",v:[["parking lot","tempat parkir"],["her heart sank","hatinya mencelos"],["windshield wiper","wiper kaca depan"],["it was my fault","itu salah saya"],["annoyed","kesal"],["on the first ring","di dering pertama"],["shrugged","mengangkat bahu"]],q:[["What did Hana expect the paper to be?","An advertisement."],["Why did Arif leave the note?","He imagined how he'd feel if it were his car."]]},
{t:"The Night Shift",lv:2,x:"Dewi works the night shift at a 24-hour convenience store. Most of her friends think it must be boring, but she says the night has its own personality.\n\nAround ten o'clock, it's students buying instant noodles and energy drinks before an exam. At midnight, delivery drivers come in for coffee and a quick chat. They know her name and always ask how her mother is doing.\n\nBetween two and four, the store is almost silent. That's when the strangest customers appear. Once, a man in a full wedding suit came in alone, bought a single ice cream, and ate it outside on the steps. Another time, a woman paid for her groceries entirely in coins, counting them one by one while apologizing.\n\nAt five, the early workers arrive: construction workers, market sellers, a nurse heading to the hospital. The sky starts to turn gray, then pink.\n\nWhen her shift ends at six, Dewi buys herself a hot tea and watches the city wake up. “Everyone else is starting their day,” she says. “And I'm ending mine. It's like living in a different time zone in the same city.”",v:[["night shift","shift malam"],["convenience store","minimarket"],["its own personality","karakternya sendiri"],["almost silent","hampir sunyi"],["one by one","satu per satu"],["heading to","menuju"],["time zone","zona waktu"]],q:[["Who comes in at midnight?","Delivery drivers."],["What does Dewi do when her shift ends?","She buys a hot tea and watches the city wake up."]]},
{t:"Learning to Say No",lv:2,x:"Sari was the person everyone at the office went to for help. Need someone to cover your shift? Ask Sari. Need help with a presentation at the last minute? Sari won't mind.\n\nThe problem was that Sari did mind. She just never said so.\n\nShe often stayed until nine in the evening finishing other people's work. She cancelled plans with friends. She was always tired, and she started feeling angry at her coworkers, even though they had no idea anything was wrong.\n\nOne day, a coworker asked her to take over a report due the next morning. Sari opened her mouth to say yes, as usual. Instead, she heard herself say, “I'm sorry, I can't tonight. I've got my own deadline.”\n\nThere was a short silence. She waited for him to get upset.\n\n“Oh, no worries,” he said. “I'll ask someone else.” And he walked away.\n\nThat was it. Nothing terrible happened.\n\nSari sat at her desk feeling strangely light. That evening, she left at five-thirty for the first time in months and met her friends for dinner. She realized that people had been asking her for help because she always said yes, not because she was the only one who could do it.",v:[["cover your shift","menggantikan shift-mu"],["at the last minute","mendadak"],["she did mind","dia sebenarnya keberatan"],["take over","mengambil alih"],["due","tenggat / harus selesai"],["No worries","santai saja / tidak apa-apa"],["strangely light","anehnya terasa ringan"]],q:[["Why was Sari angry at her coworkers?","She kept doing their work and never said no."],["What happened when she said no?","Nothing terrible; the coworker asked someone else."]]},
{t:"The Secret Ingredient",lv:2,x:"For twenty years, Bu Tini's chicken soup was famous in her neighborhood. People came from other villages just to try it. Restaurants offered to buy her recipe, but she always refused.\n\nHer granddaughter, Laras, grew up eating that soup. When Laras moved to the city for university, she tried to make it herself. She used the same chicken, the same spices, the same vegetables. But it never tasted the same.\n\nDuring her holiday, she watched her grandmother cook very carefully. She wrote down every step. Bu Tini didn't do anything special. No hidden spice, no unusual technique.\n\n“There must be something you're not telling me,” Laras said finally.\n\nBu Tini laughed. “The secret is that I cook it slowly. Four hours. Most people are too impatient.”\n\nLaras was a little disappointed. She'd expected something more mysterious.\n\nBack in the city, she tried again. She started the soup early on a Sunday morning and let it simmer while she studied. Four hours later, her small apartment smelled exactly like her grandmother's kitchen.\n\nShe took one spoonful and called her grandmother right away. “It worked,” she said. Bu Tini just replied, “Of course it did.”",v:[["refused","menolak"],["spices","bumbu"],["impatient","tidak sabar"],["disappointed","kecewa"],["mysterious","misterius"],["simmer","dimasak dengan api kecil"],["spoonful","sesendok"]],q:[["What was the secret?","Cooking it slowly for four hours."],["How did Laras feel at first about the secret?","A little disappointed."]]},
{t:"The Group Chat",lv:2,x:"There were twelve people in the family group chat, and most of the time it was quiet. Uncle Herman sent good morning pictures with flowers on them. Aunt Ida shared health tips that may or may not have been true. Nobody really replied.\n\nThen one evening, cousin Bayu posted a photo of a plane ticket. “Guess who's coming home for Eid?”\n\nWithin five minutes, the chat exploded. Grandma, who had never sent a message before, sent ten heart emojis. Uncle Herman asked what time the flight landed. Aunt Ida said she would cook his favorite rendang. Someone started planning a family dinner. Someone else suggested a trip to the beach. Two cousins started arguing about which restaurant was better.\n\nBy midnight, there were over three hundred messages.\n\nBayu hadn't been home in four years. He worked on a ship and was always somewhere far away. He read every message in his small cabin in the middle of the ocean, smiling at his phone.\n\nThe last message of the night came from Grandma. It took her ten minutes to type it. It said only: “Finally.”",v:[["group chat","grup obrolan"],["may or may not have been true","belum tentu benar"],["exploded","meledak / ramai sekali"],["landed","mendarat"],["arguing","berdebat"],["cabin","kabin"],["Finally","akhirnya"]],q:[["What did Bayu post?","A photo of a plane ticket."],["How long had Bayu been away?","Four years."]]},
{t:"The Bookshop Cat",lv:2,x:"There's a small second-hand bookshop on a quiet street near my office. The owner is an old man who barely talks, and the shop is always a mess. Books are piled on the floor, on chairs, even on the stairs.\n\nThe real star of the shop is a fat orange cat named Ketut. He sleeps on whatever book is in the sunniest spot, and if you want that book, you have to wait.\n\nI started going there during lunch breaks. At first I went for the books, but honestly, I kept coming back for Ketut. He would sit next to me while I read, and sometimes he'd put his paw on the page, as if he wanted me to stop.\n\nOne day, I asked the owner how long Ketut had lived there.\n\n“He came in during a storm eight years ago,” he said. “He never left.”\n\nIt was the longest sentence I'd ever heard him say.\n\nLast month, I noticed Ketut was sleeping on a book about Japanese gardens. I waited patiently for him to move. It took two hours. I bought the book anyway, and now every time I open it, I find little orange hairs between the pages.",v:[["second-hand","bekas"],["barely talks","hampir tidak pernah bicara"],["piled","ditumpuk"],["the real star","bintang sebenarnya"],["paw","kaki/cakar kucing"],["as if","seolah-olah"],["anyway","tetap saja"]],q:[["How did Ketut come to the shop?","He came in during a storm eight years ago."],["What does the writer find in the book?","Orange cat hairs."]]},
{t:"Wrong Platform",lv:2,x:"I was supposed to meet my friend Rama in Yogyakarta for his wedding. I took the morning train from Jakarta, put on my headphones, and fell asleep almost immediately.\n\nWhen I woke up, the train was stopped at a station. I looked out the window and read the sign. It wasn't a station I recognized. I checked my ticket, then checked the map on my phone. My stomach dropped.\n\nI was on the wrong train. I'd been going in the right direction for a while, but somewhere along the way the line had split, and I was now heading toward Surabaya.\n\nI got off at the next stop, a tiny station in the middle of rice fields. The next train back wasn't for three hours. The wedding started in four.\n\nI called Rama, expecting him to be furious. Instead, he laughed so hard he couldn't speak. “Only you,” he finally said.\n\nA kind man at the station helped me find a car to rent. I arrived at the wedding just as the ceremony was ending, still wearing my travel clothes, with my suit in a bag.\n\nRama introduced me to everyone as “my friend who went to Surabaya by accident.” People still call me that.",v:[["was supposed to","seharusnya"],["recognized","kenali"],["my stomach dropped","perutku mulas (panik)"],["somewhere along the way","di suatu titik perjalanan"],["split","bercabang"],["furious","sangat marah"],["by accident","tidak sengaja"]],q:[["Why did he take the wrong train?","He fell asleep and didn't check; the line split."],["What does Rama call him now?","My friend who went to Surabaya by accident."]]},
{t:"The Running Club",lv:2,x:"After my divorce, my sister signed me up for a beginner's running club without asking me. “You need to get out of the house,” she said. I was annoyed, but she'd already paid, so I went.\n\nThe first meeting was on a Saturday at six in the morning. There were about fifteen people: a retired teacher, two university students, a young dad who brought his baby in a stroller, and a woman in her seventies who was faster than all of us.\n\nThe coach told us we'd start by running for one minute and walking for two. I thought it would be easy. After the third round, I could barely breathe.\n\nNobody cared that I was slow. The woman in her seventies, whose name was Ibu Lastri, ran beside me and told me stories about her late husband, who had hated running.\n\nWeeks passed. One minute became five, then ten. I started looking forward to Saturdays. We'd get breakfast together after every run, and I'd laugh more in that hour than in the rest of the week.\n\nSix months later, I ran my first 5K. I finished second to last. Ibu Lastri was waiting for me at the finish line, cheering louder than anyone. I didn't realize I'd been crying until she hugged me.",v:[["divorce","perceraian"],["signed me up","mendaftarkan saya"],["retired","pensiunan"],["stroller","kereta bayi"],["could barely breathe","hampir tidak bisa bernapas"],["her late husband","almarhum suaminya"],["looking forward to","menantikan"],["finish line","garis finis"]],q:[["Who signed the writer up?","His/her sister."],["Who was waiting at the finish line?","Ibu Lastri."]]},
{t:"The Neighbor's Music",lv:2,x:"When I moved into my new apartment, everything seemed perfect, until the first night. At exactly eleven o'clock, my neighbor started playing the saxophone.\n\nIt wasn't bad music. Actually, it was quite beautiful. But it was eleven o'clock, and I had to wake up at five.\n\nThe second night, the same thing happened. And the third. I wrote an angry note and stood in front of his door for a full minute. Then I lost my nerve and went back to my apartment.\n\nOn the fourth night, I couldn't sleep, so I just lay there and listened. He was playing a slow, sad song I'd never heard before. Somewhere in the middle, he made a mistake, stopped, and started again from the beginning. He did that four times until he got it right.\n\nThe next morning, I met him in the elevator. He was an old man, maybe seventy, with a gentle face. I told him I lived next door.\n\n“Oh no,” he said. “Is the music too loud? My wife used to say I play too late. She passed away last year. I play her favorite songs at the time she used to go to bed.”\n\nI threw away my angry note that morning. I bought earplugs instead. Some nights, I don't use them.",v:[["seemed perfect","tampak sempurna"],["I lost my nerve","nyaliku ciut"],["lay there","berbaring saja"],["got it right","berhasil benar"],["gentle","lembut"],["passed away","meninggal dunia"],["earplugs","penyumbat telinga"]],q:[["Why does the neighbor play at eleven?","It's when his late wife used to go to bed."],["What did the writer do with the note?","Threw it away and bought earplugs."]]},
{t:"The Interview with Grandma",lv:2,x:"For a school project, my daughter Kiara had to interview someone older than sixty. She chose her great-grandmother, who is ninety-one.\n\nI expected it to take twenty minutes. It took three hours.\n\nKiara asked simple questions from a worksheet. “What was your house like when you were young?” “What did you eat for breakfast?” “What games did you play?”\n\nBut every answer turned into a story. Great-grandma described walking two hours to school with no shoes. She talked about the first time she saw a car and thought it was a monster. She remembered exactly how much rice cost in 1950, and she laughed about falling in love with a man who was terrible at dancing.\n\n“Was that Great-grandpa?” Kiara asked.\n\n“No,” she said, with a mischievous smile. “Your great-grandpa came later. He was even worse at dancing.”\n\nKiara stopped looking at her worksheet after the first ten minutes. She just listened, completely amazed.\n\nThat night, she said to me, “Mom, I didn't know Great-grandma was a real person before she was old.”\n\nI didn't know how to answer. I wasn't sure I'd known that either.",v:[["worksheet","lembar kerja"],["turned into","berubah menjadi"],["described","menggambarkan"],["falling in love","jatuh cinta"],["mischievous smile","senyum jahil"],["completely amazed","benar-benar takjub"]],q:[["How old is the great-grandmother?","Ninety-one."],["How long did the interview take?","Three hours."]]},
{t:"Locked Out",lv:2,x:"It was midnight. I was standing in front of my apartment door in my pajamas, holding a bag of trash. Behind me, I heard the door click shut. My keys were on the kitchen table. My phone was on the sofa.\n\nI stood there for a while, hoping that if I stared at the door long enough, it would open by itself. It didn't.\n\nThe building was silent. I didn't know any of my neighbors well. I'd only lived there for two months, and I usually just nodded at people in the elevator.\n\nI finally knocked on the door across the hall. After a long wait, a young man opened it, looking sleepy and confused. I explained the situation, feeling very embarrassed.\n\nInstead of being annoyed, he started laughing. “The same thing happened to me last month,” he said. “Come in.”\n\nHe made me tea while I used his phone to call a locksmith. The locksmith said he'd come in an hour. So we talked. His name was Yoga, he was a nurse, and he'd just finished a twelve-hour shift.\n\nBy the time the locksmith arrived, it was almost two a.m., and we'd discovered that we came from the same small town.\n\nNow we have dinner together every Thursday. And I keep a spare key at his place.",v:[["click shut","tertutup (bunyi klik)"],["stared at","menatap"],["across the hall","seberang lorong"],["embarrassed","malu"],["locksmith","tukang kunci"],["a spare key","kunci cadangan"]],q:[["Where were the keys?","On the kitchen table."],["What did they discover they had in common?","They came from the same small town."]]},
{t:"The Promotion",lv:2,x:"Kevin had worked at the bank for six years when his manager announced she was leaving. Everyone assumed Kevin would get her position. He'd been there the longest, he knew every system, and he trained most of the new staff.\n\nBut the job went to Tia, who had joined the company only two years earlier.\n\nKevin was hurt. For a week, he barely spoke to anyone. He thought about quitting. He even updated his CV.\n\nThen he asked the regional director for a meeting. He wasn't angry. He just wanted to understand.\n\nThe director was honest with him. “You're the best at what you do,” she said. “But when there's a problem, you fix it yourself. Tia teaches other people to fix it. A manager needs to make the team better, not just do the work better.”\n\nKevin didn't sleep well that night. He wanted to argue, but he knew she was right. He always took over when things went wrong because it was faster.\n\nOver the next year, he changed his approach. When a junior colleague asked for help, he asked questions instead of giving answers. It was slower and sometimes frustrating.\n\nWhen another management position opened the following year, Kevin got it. On his first day, Tia sent him a message: “Welcome to the club. It's harder than it looks.”",v:[["announced","mengumumkan"],["assumed","mengira"],["hurt","sakit hati"],["quitting","berhenti kerja"],["regional director","direktur wilayah"],["approach","pendekatan"],["frustrating","bikin frustrasi"]],q:[["Why did Tia get the job?","She teaches other people to fix problems."],["What did Kevin change?","He asked questions instead of giving answers."]]},
{t:"The Wedding Speech",lv:2,x:"My brother asked me to give a speech at his wedding. I said yes immediately, then spent the next two months regretting it.\n\nI'm not good at speaking in front of people. My hands shake, my voice gets high, and I forget words I've known my whole life.\n\nI wrote the speech eleven times. The first version was too serious. The second version had too many jokes that only our family would understand. One version made my mother cry when I practiced it, which seemed like a good sign until she said, “Too long.”\n\nOn the day of the wedding, I had my final version on three cards. When I stood up, there were two hundred people looking at me. My hands were shaking so badly that I dropped the cards, and they scattered under the table.\n\nThere was a terrible silence. I looked at my brother. He was smiling at me like he did when we were kids.\n\nSo I left the cards on the floor and just talked. I told the story of how he used to protect me from the bigger kids at school, and how I knew his wife was perfect for him because she was the first person who could beat him at chess.\n\nIt was shorter than any of my versions. People said it was the best speech of the night. I still don't know what was on those cards.",v:[["regretting","menyesali"],["shake","gemetar"],["a good sign","pertanda baik"],["scattered","berserakan"],["protect me","melindungi saya"],["beat him at chess","mengalahkannya main catur"]],q:[["What happened to the cards?","They fell and scattered under the table."],["How did the writer know the wife was perfect?","She could beat him at chess."]]},
{t:"Online Shopping Mistake",lv:2,x:"I was half asleep when I ordered a rug online. The photo showed a soft gray rug, perfect for my living room. The price was surprisingly cheap. I clicked “buy” without reading the details and went to bed.\n\nA week later, a tiny package arrived. Too tiny. I opened it and found a gray rug about the size of a sheet of paper.\n\nI went back to the website and read the description properly. There it was, in small letters: “Dollhouse rug, 30 x 20 cm.”\n\nI posted a photo of it on social media as a joke, with my cat sitting on it next to my feet for scale. I wrote, “Interior design update: finally got a rug for the living room.”\n\nBy the next morning, the post had thousands of likes. People shared their own online shopping disasters: a man who ordered a sofa and received a picture of a sofa, a woman who bought a “large” dress that would fit a five-year-old.\n\nThe rug company even contacted me and offered a discount on a real rug.\n\nI accepted, of course. But this time, I read every single word of the description, twice. The tiny rug now lives in my cat's bed. She seems to like it.",v:[["half asleep","setengah ngantuk"],["rug","karpet"],["details","rincian"],["properly","dengan benar"],["for scale","sebagai pembanding ukuran"],["disasters","bencana / kejadian kacau"],["every single word","setiap kata"]],q:[["What was the rug really for?","A dollhouse."],["Where is the tiny rug now?","In the cat's bed."]]},
{t:"A Different Kind of Lesson",lv:2,x:"Mr. Hendra had taught English for twenty years. He was strict, organized, and proud of his students' high test scores.\n\nOne semester, a new student named Rafi joined his class. Rafi never did his homework. He looked out the window during lessons and barely spoke. Mr. Hendra gave him low grades and wrote notes to his parents. Nothing changed.\n\nOne afternoon, Mr. Hendra stayed late and saw Rafi sitting alone outside the school, waiting. Two hours later, Rafi was still there.\n\nMr. Hendra sat down next to him. After a long silence, Rafi explained that his mother worked until eight at a factory, and he waited at school because their house had no electricity since his father left. He did homework when he could, but often he was too tired or too hungry.\n\nMr. Hendra didn't say much. The next day, he started a small study room after school with snacks and a quiet place to work. He told the class it was open to anyone.\n\nFive students came on the first day. Rafi was one of them.\n\nBy the end of the year, Rafi's grades were average, not excellent. But Mr. Hendra later said that he'd learned more that year than in his previous twenty. “I spent years teaching students,” he said. “I forgot to look at them.”",v:[["strict","tegas / disiplin"],["test scores","nilai ujian"],["barely spoke","hampir tak bicara"],["stayed late","pulang terlambat"],["electricity","listrik"],["average","rata-rata"],["previous","sebelumnya"]],q:[["Why did Rafi wait at school?","His house had no electricity and his mother worked late."],["What did Mr. Hendra start?","A study room after school."]]},
{t:"The Taxi Driver's Advice",lv:2,x:"I had just quit my job and was on my way to the airport to visit my parents. I hadn't told them yet. In the taxi, I kept staring out the window, rehearsing what I'd say.\n\nThe driver, an older man with gray hair, looked at me in the mirror. “Bad day?” he asked.\n\nI don't usually talk to strangers about my life, but something about him made it easy. I told him everything: how I'd been unhappy for years, how I wanted to start a small bakery, how scared I was that my parents would think I'd wasted my degree.\n\nHe listened without interrupting. Then he said, “I was an engineer for fifteen years. Good salary. I hated every day of it.”\n\n“So why are you driving a taxi?” I asked.\n\n“Because I like people. I like the city. Every day is different.” He smiled. “My father didn't talk to me for a month. Then he came to ride in my taxi. He sat in the back and didn't say anything. At the end, he paid me double.”\n\nWhen we arrived at the airport, he refused to take a tip. “Bring me a cake when your bakery opens,” he said.\n\nTwo years later, I did. He still comes in every Friday.",v:[["just quit","baru saja berhenti kerja"],["rehearsing","berlatih (apa yang akan diucapkan)"],["wasted my degree","menyia-nyiakan gelarku"],["without interrupting","tanpa menyela"],["paid me double","membayar dua kali lipat"],["refused to take a tip","menolak menerima tip"]],q:[["What did the driver do before driving a taxi?","He was an engineer."],["What did he ask for instead of a tip?","A cake when the bakery opens."]]}
);
