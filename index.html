[0,"Must be hard, being so far apart.","Pasti berat ya, berjauhan begitu."],
[1,"It is, but we video call every Sunday. My mom insists.","Iya, tapi kami video call tiap Minggu. Ibuku mewajibkan."]],
n:[["the baby of the family","anak bungsu"],["spoiled","dimanja"],["nonstop","terus-menerus"],["growing up","waktu kecil / masa tumbuh"],["insists","bersikeras / mewajibkan"]]},
{t:"At the Bank",lv:2,s:"Membuka rekening bank",p:["Banker","Client"],l:[
[0,"Hi, how can I help you today?","Hai, ada yang bisa saya bantu?"],
[1,"I'd like to open a savings account.","Saya mau membuka rekening tabungan."],
[0,"Great. Do you have any ID with you?","Baik. Bawa kartu identitas?"],
[1,"Yes, my passport and my work visa.","Iya, paspor dan visa kerja saya."],
[0,"Perfect. Is this your first account with us?","Sip. Ini rekening pertama Anda di sini?"],
[1,"Yes. What's the minimum deposit?","Iya. Setoran minimalnya berapa?"],
[0,"Fifty dollars to open it. There's no monthly fee as long as you keep at least five hundred in it.","Lima puluh dolar untuk membuka. Tidak ada biaya bulanan selama saldo minimal lima ratus."],
[1,"And what's the interest rate?","Bunganya berapa?"],
[0,"It's currently two percent a year.","Saat ini dua persen per tahun."],
[1,"Okay. Can I get a debit card with it?","Oke. Bisa sekalian dapat kartu debit?"],
[0,"Yes, it'll be mailed to you within a week.","Bisa, akan dikirim ke alamat Anda dalam seminggu."]],
n:[["savings account","rekening tabungan"],["minimum deposit","setoran minimal"],["monthly fee","biaya bulanan"],["as long as","selama"],["interest rate","suku bunga"],["mailed to you","dikirim lewat pos"]]},
{t:"Cooking Together",lv:2,s:"Masak bareng di dapur",p:["Mateo","Emily"],l:[
[0,"Okay, what do you need me to do?","Oke, aku harus bantu apa?"],
[1,"Can you chop the onions? I'll start on the sauce.","Bisa potong bawang? Aku mulai bikin sausnya."],
[0,"Sure. How small?","Boleh. Sekecil apa?"],
[1,"Pretty fine. Like, really small pieces.","Cukup halus. Potongan kecil banget."],
[0,"Got it. ... Ugh, my eyes are watering already.","Oke. ... Duh, mataku sudah berair."],
[1,"Ha! Try chilling the onions in the fridge first next time. It helps.","Haha! Lain kali coba dinginkan bawangnya di kulkas dulu. Membantu."],
[0,"Good tip. Should I add these to the pan now?","Tips bagus. Masukkan ke wajan sekarang?"],
[1,"Yeah, throw them in. Keep stirring so they don't burn.","Iya, masukkan saja. Terus aduk biar nggak gosong."],
[0,"It smells amazing already.","Wanginya sudah enak banget."],
[1,"Wait until we add the garlic.","Tunggu sampai kita masukkan bawang putihnya."],
[0,"Can I taste it?","Boleh aku cicip?"],
[1,"Not yet! Patience.","Belum! Sabar."]],
n:[["chop","memotong / mencincang"],["fine","halus (potongan)"],["my eyes are watering","mataku berair"],["throw them in","masukkan saja"],["Keep stirring","terus aduk"]]},
{t:"Saying Goodbye at a Party",lv:2,s:"Pamit pulang dari pesta",p:["Guest","Host"],l:[
[0,"Hey, I think I'm gonna head out.","Hei, kayaknya aku mau pulang duluan."],
[1,"Already? It's only ten!","Sudah? Baru jam sepuluh!"],
[0,"I know, but I've got an early flight tomorrow.","Iya, tapi besok aku ada penerbangan pagi."],
[1,"Oh right, your trip! Where are you going again?","Oh iya, perjalananmu! Ke mana tadi?"],
[0,"Tokyo. For work, unfortunately.","Tokyo. Sayangnya untuk kerja."],
[1,"Still, that's exciting. Eat a lot of sushi for me.","Tetap seru. Makan sushi banyak-banyak ya buat aku."],
[0,"Will do. Thanks so much for having me. The food was incredible.","Pasti. Makasih banyak sudah mengundang. Makanannya luar biasa."],
[1,"Aw, thanks for coming! Get home safe.","Aw, makasih sudah datang! Hati-hati di jalan."],
[0,"I will. Let's catch up when I'm back.","Pasti. Kita ngobrol lagi pas aku pulang."],
[1,"Definitely. Text me when you land!","Pasti. Kabari aku kalau sudah mendarat!"]],
n:[["head out","pergi / pulang"],["Where are you going again?","ke mana tadi? (lupa)"],["Thanks for having me","terima kasih sudah mengundang"],["Get home safe","hati-hati di jalan"],["catch up","ngobrol lagi / bertukar kabar"]]},
{t:"Asking for a Favor",lv:2,s:"Minta tolong tetangga menjaga kucing",p:["Rosa","Ben"],l:[
[0,"Hey Ben, can I ask you a huge favor?","Hai Ben, boleh minta tolong sesuatu yang besar?"],
[1,"Sure, what's up?","Boleh, kenapa?"],
[0,"I'm going away for the weekend. Could you feed my cat?","Aku pergi akhir pekan ini. Bisa kasih makan kucingku?"],
[1,"Oh, Biscuit? Of course. How often?","Oh, Biscuit? Tentu. Seberapa sering?"],
[0,"Just once a day, in the evening. And maybe change his water.","Cukup sekali sehari, sore hari. Dan mungkin ganti airnya."],
[1,"Easy. Where do you keep the food?","Gampang. Makanannya disimpan di mana?"],
[0,"Under the sink. I'll leave the key under the mat.","Di bawah wastafel. Kuncinya aku taruh di bawah keset."],
[1,"Got it. Does he bite?","Oke. Dia suka gigit?"],
[0,"Only if you try to pick him up. He's a bit moody.","Cuma kalau kamu coba gendong. Dia agak moody."],
[1,"Noted. Hands off the cat.","Dicatat. Jangan sentuh kucingnya."],
[0,"You're the best. I'll bring you something back.","Kamu yang terbaik. Nanti aku bawain oleh-oleh."]],
n:[["ask you a huge favor","minta tolong yang besar"],["under the mat","di bawah keset"],["moody","suasana hatinya gampang berubah"],["Noted","dicatat / paham"],["bring you something back","bawakan oleh-oleh"]]},
{t:"Feeling Homesick",lv:2,s:"Teman yang rindu kampung halaman",p:["Kim","Aria"],l:[
[0,"You've been kind of quiet today. You okay?","Kamu agak pendiam hari ini. Kamu oke?"],
[1,"Yeah, I'm just a bit homesick, I guess.","Iya, cuma agak kangen rumah, kayaknya."],
[0,"Aw. How long has it been since you went back?","Aw. Sudah berapa lama sejak terakhir pulang?"],
[1,"Almost a year. My grandma's birthday was yesterday and I missed it.","Hampir setahun. Ulang tahun nenekku kemarin dan aku nggak bisa datang."],
[0,"That's tough. Did you get to call her?","Berat ya. Sempat telepon dia?"],
[1,"Yeah, but it's not the same, you know?","Iya, tapi rasanya beda, tahu kan?"],
[0,"Totally. What do you miss most?","Banget. Apa yang paling kamu kangenin?"],
[1,"Honestly? My mom's cooking. Nothing here tastes like home.","Jujur? Masakan ibuku. Nggak ada yang rasanya kayak di rumah."],
[0,"Okay, how about this. Send me the recipe for your favorite dish, and we'll make it together this weekend.","Oke, gimana kalau gini. Kirim resep masakan favoritmu, kita masak bareng akhir pekan ini."],
[1,"Really? That would actually mean a lot.","Beneran? Itu sangat berarti buatku."],
[0,"Of course. It won't be as good as your mom's, but we'll try.","Tentu. Nggak akan seenak masakan ibumu, tapi kita coba."]],
n:[["homesick","kangen kampung halaman"],["That's tough","itu berat"],["It's not the same","rasanya beda"],["That would mean a lot","itu sangat berarti"]]}
);

TALKS.push(
{t:"Asking for a Raise",lv:2,s:"Karyawan minta kenaikan gaji ke atasan",p:["Employee","Boss"],l:[
[0,"Thanks for making time to meet. I know you're busy.","Terima kasih sudah menyempatkan waktu. Saya tahu Anda sibuk."],
[1,"Of course. What did you want to talk about?","Tentu. Mau membicarakan apa?"],
[0,"I wanted to discuss my compensation. I've been here two years, and I've taken on a lot more responsibility.","Saya ingin membahas kompensasi saya. Sudah dua tahun di sini, dan tanggung jawab saya bertambah banyak."],
[1,"That's true. You've been leading the client accounts since March.","Benar. Kamu memegang akun klien sejak Maret."],
[0,"Right. And I've brought in three new clients this year.","Betul. Dan saya membawa tiga klien baru tahun ini."],
[1,"You have. What number did you have in mind?","Betul. Angka berapa yang kamu pikirkan?"],
[0,"Based on market rates for my role, I was thinking a fifteen percent increase.","Berdasarkan standar pasar untuk posisi saya, saya memikirkan kenaikan lima belas persen."],
[1,"Fifteen is a lot. I'm not sure the budget can stretch that far this quarter.","Lima belas itu banyak. Saya tidak yakin anggaran kuartal ini cukup."],
[0,"I understand. Would it be possible to do part now and the rest after my review in June?","Saya mengerti. Apakah memungkinkan sebagian sekarang dan sisanya setelah evaluasi Juni?"],
[1,"That could work. Let me talk to HR and get back to you by next week.","Itu bisa. Saya bicarakan dengan HR dan kabari minggu depan."],
[0,"That sounds fair. Thank you.","Itu adil. Terima kasih."]],
n:[["making time","menyempatkan waktu"],["compensation","kompensasi / gaji dan tunjangan"],["taken on","mengambil (tanggung jawab)"],["What number did you have in mind?","berapa angka yang kamu harapkan?"],["stretch that far","cukup sampai sejauh itu"],["That could work","itu bisa"]]},
{t:"Planning a Trip",lv:2,s:"Teman merencanakan liburan",p:["Leo","Nadia"],l:[
[0,"Okay, so are we doing Bali or Lombok?","Oke, jadi kita ke Bali atau Lombok?"],
[1,"I'm leaning toward Lombok. Bali's gonna be packed in July.","Aku condong ke Lombok. Bali bakal penuh banget di bulan Juli."],
[0,"Good point. But is there enough to do in Lombok?","Benar juga. Tapi di Lombok cukup banyak kegiatan nggak?"],
[1,"Are you kidding? Beaches, waterfalls, the Gili islands...","Bercanda ya? Pantai, air terjun, pulau-pulau Gili..."],
[0,"Okay, you've sold me. How long should we go for?","Oke, aku terbujuk. Berapa lama perginya?"],
[1,"Five days? Any more and I'll have to use all my leave.","Lima hari? Lebih dari itu cutiku habis."],
[0,"Five's good. Should we book flights now? Prices keep going up.","Lima pas. Pesan tiket sekarang? Harganya terus naik."],
[1,"Yeah, let's lock them in tonight.","Iya, ayo amankan malam ini."],
[0,"And hotels?","Hotelnya?"],
[1,"I found a cute guesthouse near the beach. Super cheap.","Aku nemu penginapan lucu dekat pantai. Murah banget."],
[0,"Send me the link. This is actually happening!","Kirim link-nya. Ini beneran jadi!"]],
n:[["I'm leaning toward...","aku condong ke..."],["packed","penuh sesak"],["You've sold me","kamu berhasil meyakinkanku"],["leave","cuti"],["lock them in","mengamankan (pesanan/harga)"],["This is actually happening","ini beneran terjadi!"]]},
{t:"Breaking Bad News",lv:2,s:"Memberi kabar buruk ke teman kerja",p:["Manager","Team member"],l:[
[0,"Hey, do you have a minute? Let's talk in my office.","Hei, ada waktu sebentar? Kita ngobrol di ruanganku."],
[1,"Sure. Is everything okay?","Boleh. Semuanya baik-baik saja?"],
[0,"I wanted to let you know before it's announced. The project's been put on hold.","Aku mau kasih tahu sebelum diumumkan. Proyeknya ditunda."],
[1,"What? We've been working on it for six months.","Apa? Kita sudah kerjakan enam bulan."],
[0,"I know. I'm really sorry. It's a budget decision from the top.","Aku tahu. Aku sangat menyesal. Itu keputusan anggaran dari atas."],
[1,"So what happens to the team?","Lalu timnya bagaimana?"],
[0,"Nobody's losing their job. You'll be moved to the mobile app project.","Tidak ada yang kehilangan pekerjaan. Kamu akan dipindah ke proyek aplikasi mobile."],
[1,"Okay. That's a relief, at least.","Oke. Setidaknya itu melegakan."],
[0,"And the work you did isn't wasted. They might bring it back next year.","Dan kerjamu tidak sia-sia. Mungkin dilanjutkan tahun depan."],
[1,"I hope so. I'm just... really disappointed.","Semoga. Aku cuma... sangat kecewa."],
[0,"That's completely understandable. Take some time to process it.","Itu sangat wajar. Luangkan waktu untuk mencernanya."]],
n:[["Do you have a minute?","ada waktu sebentar?"],["put on hold","ditunda"],["from the top","dari pimpinan atas"],["That's a relief","itu melegakan"],["process it","mencerna / menerima"]]},
{t:"Recommending a Restaurant",lv:2,s:"Teman minta rekomendasi tempat makan",p:["Sophie","Marcus"],l:[
[0,"I need a place for my parents' anniversary dinner. Any ideas?","Aku butuh tempat untuk makan malam anniversary orang tuaku. Ada ide?"],
[1,"What kind of vibe are you going for?","Suasana yang kamu cari kayak gimana?"],
[0,"Somewhere nice, but not too fancy. My dad hates stuffy places.","Yang bagus, tapi nggak terlalu mewah. Ayahku benci tempat yang kaku."],
[1,"Have you tried that Italian place on Fifth Street? Nonna's?","Pernah coba restoran Italia di Fifth Street? Nonna's?"],
[0,"No, is it good?","Belum, enak?"],
[1,"It's amazing. Cozy, really friendly staff, and the pasta is to die for.","Luar biasa. Nyaman, stafnya ramah banget, dan pastanya enak parah."],
[0,"How pricey are we talking?","Semahal apa?"],
[1,"Mid-range. Around forty a person with wine.","Menengah. Sekitar empat puluh per orang dengan wine."],
[0,"That works. Do I need to book ahead?","Oke. Perlu pesan dulu?"],
[1,"Definitely on weekends. It fills up fast.","Pasti kalau akhir pekan. Cepat penuh."],
[0,"Perfect. Thanks, I owe you one.","Sip. Makasih, aku utang satu."]],
n:[["vibe","suasana / nuansa"],["stuffy","kaku / formal berlebihan"],["to die for","enak banget (luar biasa)"],["pricey","mahal"],["book ahead","pesan dulu"],["I owe you one","aku berutang padamu"]]},
{t:"Disagreeing Politely",lv:2,s:"Rapat tim berbeda pendapat",p:["Nathan","Fiona"],l:[
[0,"I think we should launch the campaign next week.","Menurutku kita luncurkan kampanyenya minggu depan."],
[1,"I see where you're coming from, but I'm not sure we're ready.","Aku paham maksudmu, tapi aku nggak yakin kita sudah siap."],
[0,"What's holding us back?","Apa yang menghambat?"],
[1,"The landing page still has bugs, and we haven't tested the ads.","Landing page-nya masih ada bug, dan iklannya belum dites."],
[0,"Fair enough. But if we wait too long, we'll miss the holiday season.","Masuk akal. Tapi kalau terlalu lama, kita bisa lewat musim liburan."],
[1,"That's a good point. What if we did a soft launch first?","Itu poin bagus. Gimana kalau soft launch dulu?"],
[0,"Like with a small budget?","Maksudnya dengan anggaran kecil?"],
[1,"Exactly. Test with ten percent of the budget, fix the issues, then go big.","Tepat. Tes dengan sepuluh persen anggaran, perbaiki masalahnya, lalu jalankan penuh."],
[0,"I could live with that.","Itu bisa aku terima."],
[1,"Great. Let's run it by the team this afternoon.","Bagus. Kita sampaikan ke tim sore ini."]],
n:[["I see where you're coming from","aku paham sudut pandangmu — cara halus sebelum tidak setuju"],["What's holding us back?","apa yang menghambat kita?"],["Fair enough","masuk akal"],["go big","jalankan secara besar-besaran"],["I could live with that","itu bisa aku terima"],["run it by","menyampaikan untuk minta pendapat"]]},
{t:"Getting Lost While Driving",lv:2,s:"Pasangan nyasar saat menyetir",p:["Jack","Lily"],l:[
[0,"Are you sure this is the right way?","Kamu yakin ini jalannya?"],
[1,"The GPS says it is.","Kata GPS iya."],
[0,"The GPS also told us to drive into a lake last time.","GPS juga suruh kita masuk danau terakhir kali."],
[1,"That was one time!","Itu cuma sekali!"],
[0,"We've passed that same gas station twice now.","Kita sudah lewat pom bensin yang sama dua kali."],
[1,"Okay, fine. Maybe we should ask someone.","Oke, ya sudah. Mungkin kita tanya orang."],
[0,"There's a guy over there. Pull over.","Ada bapak di sana. Menepi."],
[1,"Excuse me! Do you know how to get to Pine Lake Resort?","Permisi! Tahu jalan ke Pine Lake Resort?"],
[0,"He says we missed the turn about two miles back.","Katanya kita kelewatan belokannya sekitar tiga kilometer lalu."],
[1,"Great. Okay, turning around.","Bagus. Oke, putar balik."],
[0,"Next time, I'm driving.","Lain kali aku yang nyetir."]],
n:[["Pull over","menepi"],["missed the turn","kelewatan belokan"],["turning around","putar balik"],["That was one time!","itu cuma sekali! (membela diri)"]]},
{t:"Recovering From a Cold",lv:2,s:"Teman menanyakan kabar setelah sakit",p:["Will","Tina"],l:[
[0,"Hey, you're back! How are you feeling?","Hei, kamu balik! Gimana rasanya?"],
[1,"Much better, thanks. Still a bit stuffy, but I'll live.","Jauh lebih baik, makasih. Masih agak mampet, tapi aman."],
[0,"You were out for, what, four days?","Kamu nggak masuk, berapa, empat hari?"],
[1,"Five. It knocked me out completely.","Lima. Benar-benar bikin aku tumbang."],
[0,"That's rough. Was it the flu?","Berat ya. Flu?"],
[1,"Doctor said it was just a bad cold, but it didn't feel like 'just' anything.","Kata dokter cuma pilek parah, tapi rasanya nggak 'cuma' sama sekali."],
[0,"Ha, I know what you mean. Did you catch up on any shows at least?","Haha, aku paham. Setidaknya sempat nonton serial?"],
[1,"I slept through most of them.","Aku ketiduran di sebagian besar."],
[0,"Well, take it easy today. Don't overdo it.","Ya sudah, santai saja hari ini. Jangan memaksakan diri."],
[1,"Trust me, I'm not planning to.","Percayalah, aku memang nggak berencana begitu."]],
n:[["stuffy","hidung mampet"],["I'll live","aku akan baik-baik saja (bercanda)"],["knocked me out","bikin aku tumbang"],["catch up on shows","mengejar tontonan yang tertinggal"],["Don't overdo it","jangan memaksakan diri"]]},
{t:"Parent-Teacher Meeting",lv:2,s:"Orang tua bertemu guru anak",p:["Teacher","Parent"],l:[
[0,"Thanks for coming in, Mrs. Rahman. Please, have a seat.","Terima kasih sudah datang, Bu Rahman. Silakan duduk."],
[1,"Thank you. How's Adam doing?","Terima kasih. Bagaimana Adam?"],
[0,"Overall, he's doing really well. He's one of the strongest readers in the class.","Secara keseluruhan, dia sangat baik. Dia salah satu pembaca terbaik di kelas."],
[1,"Oh, that's great to hear.","Oh, senang mendengarnya."],
[0,"Math is a bit more of a struggle. He gets frustrated and sometimes gives up quickly.","Matematika sedikit lebih sulit baginya. Dia mudah frustrasi dan kadang cepat menyerah."],
[1,"Yeah, we see that at home too. Any suggestions?","Iya, kami juga lihat di rumah. Ada saran?"],
[0,"Practicing with real-life things helps. Counting money at the store, measuring ingredients when you cook.","Latihan dengan hal sehari-hari membantu. Menghitung uang di toko, menakar bahan saat masak."],
[1,"That's a great idea. He loves helping in the kitchen.","Ide bagus. Dia suka bantu di dapur."],
[0,"Perfect. And just lots of encouragement. He's a bright kid.","Sempurna. Dan banyak dorongan semangat. Dia anak yang cerdas."],
[1,"Thank you. I really appreciate you looking out for him.","Terima kasih. Saya sangat menghargai perhatian Anda."]],
n:[["have a seat","silakan duduk"],["a struggle","kesulitan"],["gives up","menyerah"],["encouragement","dorongan semangat"],["looking out for him","memperhatikannya"]]},
{t:"Losing a Game",lv:2,s:"Teman main game online",p:["Jake","Omar"],l:[
[0,"Dude, what just happened?","Bro, barusan kenapa?"],
[1,"I have no idea. One second we were winning, then everyone was dead.","Nggak tahu. Tadi kita menang, sedetik kemudian semua mati."],
[0,"That other team came out of nowhere.","Tim lawan muncul tiba-tiba."],
[1,"I told you we should've stayed together.","Kan aku bilang harusnya kita tetap bareng."],
[0,"Yeah, yeah, rub it in.","Iya, iya, terus aja ungkit."],
[1,"Ha! It's fine. One more round?","Haha! Santai. Satu ronde lagi?"],
[0,"It's almost midnight. I've got work tomorrow.","Udah hampir tengah malam. Besok aku kerja."],
[1,"Come on, just one. We can't end on a loss.","Ayolah, satu saja. Masa berakhir dengan kalah."],
[0,"Fine. But for real, just one.","Ya sudah. Tapi beneran, satu saja."],
[1,"That's what you said three rounds ago.","Itu yang kamu bilang tiga ronde lalu."]],
n:[["Dude","bro (sapaan akrab)"],["came out of nowhere","muncul entah dari mana"],["should've","= should have, seharusnya"],["rub it in","mengungkit-ungkit (kesalahan)"],["for real","beneran"]]},
{t:"Complimenting Someone",lv:2,s:"Memuji presentasi rekan kerja",p:["Ella","Raj"],l:[
[0,"Raj! That presentation was fantastic.","Raj! Presentasimu tadi fantastis."],
[1,"Really? I was so nervous. I thought my voice was shaking.","Beneran? Aku gugup banget. Kukira suaraku gemetar."],
[0,"Not at all. You seemed totally calm.","Sama sekali nggak. Kamu kelihatan tenang banget."],
[1,"That's a relief. I practiced it like twenty times.","Lega dengarnya. Aku latihan sekitar dua puluh kali."],
[0,"It showed. The data part was super clear.","Kelihatan kok. Bagian datanya jelas banget."],
[1,"Thanks. I was worried it was too much.","Makasih. Aku khawatir terlalu banyak."],
[0,"No, it was just right. Even the director was nodding.","Nggak, pas banget. Bahkan direkturnya mengangguk-angguk."],
[1,"Oh wow, I didn't even notice.","Wah, aku nggak sadar."],
[0,"You should be proud. Seriously.","Kamu harus bangga. Serius."],
[1,"Thanks, Ella. That means a lot coming from you.","Makasih, Ella. Itu sangat berarti datang darimu."]],
n:[["It showed","kelihatan hasilnya"],["just right","pas"],["That means a lot coming from you","itu berarti banget karena kamu yang bilang"]]},
{t:"Selling Something Online",lv:2,s:"Penjual dan pembeli sepeda bekas",p:["Seller","Buyer"],l:[
[0,"Hi, you're here about the bike?","Hai, kamu yang mau lihat sepedanya?"],
[1,"Yeah, I messaged you this morning. Is it still available?","Iya, aku kirim pesan tadi pagi. Masih ada?"],
[0,"Yep. Here it is. I've only had it a year.","Masih. Ini dia. Baru setahun aku pakai."],
[1,"It looks good. Any problems with it?","Kelihatannya bagus. Ada masalah?"],
[0,"The back brake is a little loose, but that's an easy fix.","Rem belakang agak longgar, tapi gampang diperbaiki."],
[1,"Can I take it for a quick spin?","Boleh aku coba sebentar?"],
[0,"Sure, go ahead.","Boleh, silakan."],
[1,"Rides really smoothly. You were asking two hundred?","Jalannya mulus banget. Kamu minta dua ratus?"],
[0,"That's right.","Benar."],
[1,"Would you take one-seventy, because of the brake?","Mau seratus tujuh puluh, karena remnya?"],
[0,"Meet me in the middle? One-eighty-five?","Ambil tengahnya? Seratus delapan puluh lima?"],
[1,"Deal.","Sepakat."]],
n:[["Is it still available?","masih ada?"],["an easy fix","gampang diperbaiki"],["take it for a spin","mencoba (kendaraan)"],["Would you take...?","mau terima harga...?"],["Meet me in the middle","ambil jalan tengah (harga)"]]},
{t:"Talking About Stress",lv:2,s:"Teman membahas stres dan cara mengatasinya",p:["Ana","Ben"],l:[
[0,"How have you been sleeping lately?","Akhir-akhir ini tidurmu gimana?"],
[1,"Not great, honestly. My brain won't shut off at night.","Nggak bagus, jujur. Otakku nggak mau berhenti mikir di malam hari."],
[0,"Work stuff?","Soal kerjaan?"],
[1,"Work, money, family... everything at once.","Kerjaan, uang, keluarga... semuanya sekaligus."],
[0,"I've been there. Have you tried writing stuff down before bed?","Aku pernah begitu. Pernah coba tulis isi pikiranmu sebelum tidur?"],
[1,"Like a journal?","Kayak jurnal?"],
[0,"Kind of. Just a list of what's bothering you. It gets it out of your head.","Semacam itu. Cuma daftar apa yang mengganggumu. Biar keluar dari kepala."],
[1,"Hmm. I could give it a shot.","Hmm. Bisa aku coba."],
[0,"And maybe put your phone away an hour before bed.","Dan mungkin jauhkan HP sejam sebelum tidur."],
[1,"Okay, that one's gonna be harder.","Oke, yang itu bakal lebih susah."],
[0,"Ha, I know. Baby steps.","Haha, aku tahu. Pelan-pelan saja."]],
n:[["My brain won't shut off","pikiranku tidak bisa berhenti"],["I've been there","aku pernah mengalaminya"],["What's bothering you","apa yang mengganggumu"],["give it a shot","mencobanya"],["Baby steps","sedikit demi sedikit"]]},
{t:"Apologizing",lv:2,s:"Minta maaf ke teman karena lupa janji",p:["Ryan","Mia"],l:[
[0,"Mia, I'm so sorry about yesterday.","Mia, aku minta maaf banget soal kemarin."],
[1,"You mean when you didn't show up?","Maksudmu waktu kamu nggak datang?"],
[0,"Yeah. I completely forgot. There's no excuse.","Iya. Aku benar-benar lupa. Nggak ada alasan."],
[1,"I waited forty-five minutes, Ryan.","Aku nunggu empat puluh lima menit, Ryan."],
[0,"I know. I feel awful. You must've been so annoyed.","Aku tahu. Aku merasa sangat bersalah. Kamu pasti kesal banget."],
[1,"I was. But mostly I was worried something happened to you.","Iya. Tapi aku lebih khawatir terjadi sesuatu padamu."],
[0,"That makes it even worse. Can I make it up to you?","Itu bikin aku makin bersalah. Boleh aku tebus?"],
[1,"Depends. What did you have in mind?","Tergantung. Kamu kepikiran apa?"],
[0,"Dinner, my treat. Anywhere you want. And I'll put it in my calendar with three reminders.","Makan malam, aku traktir. Di mana pun kamu mau. Dan aku masukkan ke kalender dengan tiga pengingat."],
[1,"Ha. Okay, apology accepted. But I'm choosing somewhere expensive.","Haha. Oke, permintaan maaf diterima. Tapi aku pilih tempat yang mahal."]],
n:[["show up","datang / muncul"],["There's no excuse","tidak ada pembelaan"],["I feel awful","aku merasa sangat bersalah"],["make it up to you","menebus kesalahan padamu"],["apology accepted","permintaan maaf diterima"]]},
{t:"Choosing a Gift",lv:2,s:"Memilih kado untuk ibu",p:["Sister","Brother"],l:[
[0,"Mom's birthday is on Sunday. Have you gotten her anything?","Ulang tahun Mama hari Minggu. Kamu sudah beli sesuatu?"],
[1,"Not yet. I have no clue what to get her.","Belum. Aku nggak ada ide mau beli apa."],
[0,"Same. She always says she doesn't want anything.","Sama. Dia selalu bilang nggak mau apa-apa."],
[1,"Which means she definitely wants something.","Artinya dia pasti mau sesuatu."],
[0,"Exactly. What about a scarf?","Tepat. Gimana kalau syal?"],
[1,"We got her a scarf last year.","Tahun lalu kita sudah kasih syal."],
[0,"Oh, right. What about something we do together, like a cooking class?","Oh iya. Gimana kalau sesuatu yang dilakukan bareng, kayak kelas masak?"],
[1,"Ooh, I like that. She's always wanted to learn to bake bread.","Ooh, aku suka. Dia sudah lama pengin belajar bikin roti."],
[0,"Let's go halves on it?","Kita patungan?"],
[1,"Deal. You find the class, I'll handle the card.","Sepakat. Kamu cari kelasnya, aku urus kartunya."]],
n:[["I have no clue","aku sama sekali tidak tahu"],["go halves","patungan bagi dua"],["handle","mengurus"]]},
{t:"Neighbors Chatting Over the Fence",lv:2,s:"Tetangga ngobrol di halaman",p:["Mr. Brown","Ayu"],l:[
[0,"Your garden's looking great this year.","Kebunmu kelihatan bagus tahun ini."],
[1,"Thanks! The tomatoes finally decided to grow.","Makasih! Tomatnya akhirnya mau tumbuh."],
[0,"What's your secret? Mine always get eaten by bugs.","Apa rahasianya? Punyaku selalu dimakan serangga."],
[1,"I plant basil next to them. Apparently the bugs hate the smell.","Aku tanam kemangi di sebelahnya. Katanya serangga benci baunya."],
[0,"Huh, I've never heard of that.","Hah, aku belum pernah dengar itu."],
[1,"My grandmother swore by it.","Nenekku sangat percaya cara itu."],
[0,"I'll have to try it. Hey, did you hear they're building a café on the corner?","Harus aku coba. Eh, kamu dengar mereka mau bangun kafe di pojok?"],
[1,"No way! Where the old bakery was?","Masa! Di bekas toko roti dulu?"],
[0,"That's the one. Should be open by spring.","Betul itu. Harusnya buka musim semi."],
[1,"Finally, somewhere to walk to for coffee.","Akhirnya, ada tempat buat ngopi yang bisa dijangkau jalan kaki."]],
n:[["finally decided to grow","akhirnya mau tumbuh (personifikasi lucu)"],["swore by it","sangat percaya keampuhannya"],["That's the one","itu dia / betul yang itu"]]},
{t:"Discussing a Book",lv:3,s:"Klub buku membahas novel",p:["Hannah","David"],l:[
[0,"So, did you manage to finish it?","Jadi, kamu berhasil menyelesaikannya?"],
[1,"Barely. I stayed up until two last night to get through the last hundred pages.","Nyaris. Aku begadang sampai jam dua untuk menyelesaikan seratus halaman terakhir."],
[0,"And? Was it worth losing sleep over?","Dan? Sepadan dengan kurang tidur?"],
[1,"Mostly, yeah. Though I have mixed feelings about the ending.","Sebagian besar, iya. Meski aku punya perasaan campur aduk soal akhirnya."],
[0,"Same here. It felt a bit rushed, didn't it?","Sama. Terasa agak terburu-buru, kan?"],
[1,"Exactly. They spent four hundred pages building up the conflict and then resolved it in ten.","Tepat. Mereka habiskan empat ratus halaman membangun konflik lalu menyelesaikannya dalam sepuluh."],
[0,"I did love the relationship between the sisters, though.","Tapi aku suka sekali hubungan antara kakak-adik itu."],
[1,"Oh, that was the heart of the book for me. The scene in the hospital wrecked me.","Oh, itu inti bukunya buatku. Adegan di rumah sakit bikin aku hancur."],
[0,"I actually cried on the train. People were staring.","Aku sampai nangis di kereta. Orang-orang melihat."],
[1,"Ha! Would you recommend it to someone?","Haha! Kamu mau rekomendasikan ke orang lain?"],
[0,"With a warning about the ending, yes.","Dengan peringatan soal akhirnya, iya."]],
n:[["get through","menyelesaikan (sesuatu yang berat)"],["worth losing sleep over","sepadan dengan kurang tidur"],["mixed feelings","perasaan campur aduk"],["rushed","terburu-buru"],["wrecked me","bikin aku hancur (emosional)"]]},
{t:"Negotiating a Deadline",lv:3,s:"Freelancer minta perpanjangan waktu ke klien",p:["Freelancer","Client"],l:[
[0,"Hi Claire, thanks for jumping on a call. I wanted to give you a heads-up about the timeline.","Hai Claire, makasih sudah mau telepon. Saya mau kasih kabar lebih awal soal jadwal."],
[1,"Uh oh. That doesn't sound promising.","Waduh. Kedengarannya kurang baik."],
[0,"It's not a disaster, but the feedback round took longer than we planned, so Friday's looking tight.","Bukan bencana, tapi putaran revisi lebih lama dari rencana, jadi Jumat agak mepet."],
[1,"How tight are we talking?","Semepet apa?"],
[0,"Realistically, I'd need until Wednesday to do it properly.","Realistisnya, saya butuh sampai Rabu agar hasilnya maksimal."],
[1,"Wednesday's a problem. We're presenting to the board on Tuesday morning.","Rabu jadi masalah. Kami presentasi ke dewan direksi Selasa pagi."],
[0,"Okay, that's helpful to know. What if I delivered the core pages by Monday, and the rest by Wednesday?","Oke, itu informasi penting. Bagaimana kalau halaman inti saya serahkan Senin, sisanya Rabu?"],
[1,"Which would the core pages be?","Halaman inti itu yang mana?"],
[0,"The homepage, product page, and checkout. Basically everything the board would see.","Beranda, halaman produk, dan checkout. Intinya semua yang akan dilihat dewan."],
[1,"That could work. Can you send me that plan in writing?","Itu bisa. Bisa kirim rencana itu secara tertulis?"],
[0,"Absolutely. I'll email it within the hour.","Tentu. Saya email dalam satu jam."]],
n:[["jumping on a call","meluangkan waktu untuk telepon"],["a heads-up","pemberitahuan lebih awal"],["looking tight","tampak mepet"],["Realistically","realistisnya"],["in writing","secara tertulis"],["within the hour","dalam waktu satu jam"]]},
{t:"Dealing with a Difficult Customer",lv:3,s:"Staf hotel menghadapi tamu yang marah",p:["Guest","Manager"],l:[
[0,"This is unacceptable. I booked a sea view, and my window faces a parking lot.","Ini tidak bisa diterima. Saya pesan kamar pemandangan laut, tapi jendela saya menghadap parkiran."],
[1,"I'm really sorry, sir. That's definitely not the experience we want you to have.","Saya sungguh minta maaf, Pak. Itu jelas bukan pengalaman yang kami harapkan untuk Anda."],
[0,"I paid extra for that view. I have the confirmation right here.","Saya bayar lebih untuk pemandangan itu. Konfirmasinya ada di sini."],
[1,"May I take a look? ... You're absolutely right. That's our mistake.","Boleh saya lihat? ... Anda benar sekali. Itu kesalahan kami."],
[0,"So what are you going to do about it?","Jadi apa yang akan Anda lakukan?"],
[1,"We're fully booked tonight, unfortunately, but I can move you to a sea-view suite tomorrow morning.","Sayangnya malam ini penuh, tapi saya bisa pindahkan Anda ke suite pemandangan laut besok pagi."],
[0,"And tonight?","Lalu malam ini?"],
[1,"Tonight's stay will be on us, and I'd like to offer you dinner at our restaurant as well.","Menginap malam ini gratis dari kami, dan saya juga ingin menawarkan makan malam di restoran kami."],
[0,"Hm. Well... that's more reasonable.","Hm. Yah... itu lebih masuk akal."],
[1,"I'll personally make sure your luggage is moved first thing tomorrow. Again, I apologize.","Saya pribadi akan pastikan koper Anda dipindahkan paling awal besok. Sekali lagi, saya minta maaf."],
[0,"I appreciate you handling it.","Terima kasih sudah menanganinya."]],
n:[["unacceptable","tidak bisa diterima"],["That's our mistake","itu kesalahan kami (mengakui tanpa berbelit)"],["on us","gratis dari kami / kami yang tanggung"],["first thing tomorrow","paling awal besok"],["reasonable","masuk akal"]]},
{t:"Talking About Social Media",lv:3,s:"Teman membahas kecanduan media sosial",p:["Max","Layla"],l:[
[0,"I deleted Instagram last week.","Aku hapus Instagram minggu lalu."],
[1,"Wait, for real? You were on it constantly.","Tunggu, serius? Kamu main itu terus-terusan."],
[0,"That's exactly why. I checked my screen time and it was five hours a day.","Justru itu. Aku cek screen time-ku dan totalnya lima jam sehari."],
[1,"Oof. That's brutal.","Aduh. Parah."],
[0,"Right? And it wasn't even making me happy. I'd just scroll and feel worse about my life.","Kan? Dan bahkan nggak bikin aku bahagia. Aku cuma scroll dan merasa hidupku makin buruk."],
[1,"I totally get that. Everyone's on vacation or getting engaged.","Aku paham banget. Semua orang lagi liburan atau tunangan."],
[0,"Exactly. So how's it been without it? Honestly, the first three days I kept reaching for my phone.","Tepat. Jadi gimana tanpa itu? Jujur, tiga hari pertama aku terus meraih HP."],
[1,"Like a reflex.","Kayak refleks."],
[0,"Totally. But now I'm reading more, and I actually call people instead of just liking their posts.","Banget. Tapi sekarang aku lebih banyak baca, dan aku benar-benar menelepon orang, bukan cuma nge-like postingan mereka."],
[1,"Okay, that's kind of inspiring. I don't think I could go cold turkey, though.","Oke, itu agak menginspirasi. Tapi kayaknya aku nggak bisa berhenti total mendadak."],
[0,"You don't have to. Maybe start with setting a time limit.","Nggak harus. Mungkin mulai dengan batas waktu."]],
n:[["constantly","terus-menerus"],["brutal","parah / kejam"],["I totally get that","aku paham banget"],["go cold turkey","berhenti total secara mendadak"],["inspiring","menginspirasi"]]},
{t:"Moving Abroad",lv:3,s:"Teman cerita mau pindah ke luar negeri",p:["Sara","Tom"],l:[
[0,"So, I have some news. I got the job in Melbourne.","Jadi, aku punya kabar. Aku dapat kerjaan di Melbourne."],
[1,"What? That's amazing! Congratulations!","Apa? Luar biasa! Selamat!"],
[0,"Thanks. I'm excited, but honestly, I'm also kind of freaking out.","Makasih. Aku senang, tapi jujur, aku juga agak panik."],
[1,"That's totally normal. It's a huge move.","Itu wajar banget. Ini perpindahan besar."],
[0,"I keep thinking about everything I'm leaving behind. My family, you guys, the food.","Aku terus memikirkan semua yang aku tinggalkan. Keluargaku, kalian, makanannya."],
[1,"The food part I understand. Nobody makes nasi padang like here.","Bagian makanan aku paham. Nggak ada nasi padang seenak di sini."],
[0,"Ha! Seriously though, what if I don't make any friends?","Haha! Tapi serius, gimana kalau aku nggak punya teman?"],
[1,"You? You made friends with our Uber driver last week.","Kamu? Minggu lalu kamu sampai berteman sama sopir Uber kita."],
[0,"That's fair. When did I become so anxious?","Benar juga. Sejak kapan aku jadi secemas ini?"],
[1,"Since you made a life-changing decision, probably. You'll be fine. And we'll visit.","Mungkin sejak kamu ambil keputusan yang mengubah hidup. Kamu bakal baik-baik saja. Dan kami akan berkunjung."],
[0,"You'd better.","Awas kalau nggak."]],
n:[["freaking out","panik"],["a huge move","perpindahan besar"],["leaving behind","meninggalkan"],["anxious","cemas"],["life-changing","mengubah hidup"],["You'd better","awas kalau tidak (bercanda)"]]},
{t:"Customer Feedback Call",lv:3,s:"Tim marketing menelepon pelanggan untuk survei",p:["Researcher","Customer"],l:[
[0,"Hi, is this a good time? This will only take about five minutes.","Halo, apakah sekarang waktu yang tepat? Hanya sekitar lima menit."],
[1,"Sure, I've got a few minutes.","Boleh, saya ada waktu sebentar."],
[0,"Great. You've been using our app for about three months. How would you describe your experience so far?","Bagus. Anda sudah pakai aplikasi kami sekitar tiga bulan. Bagaimana pengalaman Anda sejauh ini?"],
[1,"Overall, pretty positive. It's saved me a lot of time.","Secara umum, cukup positif. Sangat menghemat waktu saya."],
[0,"Glad to hear it. Is there anything that frustrates you?","Senang mendengarnya. Ada yang membuat Anda frustrasi?"],
[1,"Honestly, the notifications. There are way too many of them.","Jujur, notifikasinya. Terlalu banyak."],
[0,"That's really useful feedback. Do you have them turned off now?","Itu masukan yang sangat berguna. Sekarang Anda matikan?"],
[1,"Most of them, yeah. But then I miss the important ones.","Sebagian besar, iya. Tapi jadi saya kelewatan yang penting."],
[0,"So ideally, you'd want more control over which ones you get?","Jadi idealnya, Anda ingin bisa memilih notifikasi mana yang masuk?"],
[1,"Exactly. That would make a big difference.","Tepat. Itu akan sangat berpengaruh."],
[0,"Got it. That's everything I needed. Thanks so much for your time.","Baik. Itu semua yang saya perlukan. Terima kasih banyak atas waktunya."]],
n:[["Is this a good time?","apakah sekarang waktu yang tepat? (sopan saat menelepon)"],["way too many","terlalu banyak sekali"],["ideally","idealnya"],["That would make a big difference","itu akan sangat berpengaruh"]]},
{t:"Giving Constructive Feedback",lv:3,s:"Atasan memberi masukan ke karyawan",p:["Lead","Designer"],l:[
[0,"Thanks for sending over the designs. Can we go through them together?","Makasih sudah kirim desainnya. Bisa kita bahas bersama?"],
[1,"Sure. Be honest. What do you think?","Boleh. Jujur saja. Menurutmu gimana?"],
[0,"The visual style is really strong. The colors feel fresh, and the typography is clean.","Gaya visualnya sangat kuat. Warnanya segar, dan tipografinya rapi."],
[1,"Thanks. I sense a 'but' coming.","Makasih. Aku merasa ada 'tapi' setelah ini."],
[0,"Ha, a small one. I'm a little worried about the checkout page. There are a lot of steps.","Haha, kecil saja. Aku agak khawatir dengan halaman checkout. Langkahnya banyak."],
[1,"Five, I think.","Lima, kayaknya."],
[0,"Right. Every extra step is a chance for people to give up. Could we get it down to three?","Benar. Setiap langkah tambahan adalah peluang orang menyerah. Bisa kita kurangi jadi tiga?"],
[1,"Maybe if we combined the address and payment screens.","Mungkin kalau layar alamat dan pembayaran digabung."],
[0,"That's exactly what I was thinking. Want to try a version and we'll test both?","Itu persis yang aku pikirkan. Mau coba buat versinya lalu kita tes keduanya?"],
[1,"Sounds good. I'll have something by Thursday.","Oke. Kamis sudah ada."],
[0,"Great work overall. I mean it.","Kerja bagus secara keseluruhan. Aku serius."]],
n:[["go through","membahas satu per satu"],["I sense a 'but' coming","aku merasa ada 'tapi' (kritik akan datang)"],["get it down to","menguranginya jadi"],["I mean it","aku serius"]]}
);

TALKS.push(
{t:"Venting About a Coworker",lv:3,s:"Curhat soal rekan kerja yang menyebalkan",p:["Jen","Chris"],l:[
[0,"Can I vent for a second?","Boleh aku curhat sebentar?"],
[1,"Go for it.","Silakan."],
[0,"Kevin took credit for my idea in the meeting today. Again.","Kevin mengklaim ideku di rapat hari ini. Lagi."],
[1,"Are you serious? The same Kevin who 'forgot' to cc you last month?","Serius? Kevin yang 'lupa' cc kamu bulan lalu?"],
[0,"That's the one. He just presented it like he came up with it on the spot.","Itu dia. Dia presentasikan seolah-olah dia yang kepikiran saat itu juga."],
[1,"That's so not okay. Did anyone notice?","Itu sangat nggak pantas. Ada yang sadar?"],
[0,"I don't think so. And I froze. I didn't say anything.","Kayaknya nggak. Dan aku diam. Aku nggak bilang apa-apa."],
[1,"Don't beat yourself up. It's hard to react in the moment.","Jangan menyalahkan diri. Susah bereaksi di saat itu juga."],
[0,"What would you do?","Kalau kamu, apa yang akan kamu lakukan?"],
[1,"Honestly? Start putting your ideas in writing before meetings. Email them to the team. Then there's a paper trail.","Jujur? Mulai tulis idemu sebelum rapat. Email ke tim. Jadi ada jejak tertulis."],
[0,"That's smart. Petty, but smart.","Itu pintar. Agak licik, tapi pintar."],
[1,"Sometimes petty is necessary.","Kadang licik itu perlu."]],
n:[["vent","curhat / meluapkan kekesalan"],["took credit for","mengklaim jasa"],["came up with it","memikirkan ide itu"],["on the spot","saat itu juga"],["Don't beat yourself up","jangan menyalahkan diri sendiri"],["paper trail","jejak tertulis / bukti dokumen"],["petty","picik / remeh"]]},
{t:"Wedding Planning Stress",lv:3,s:"Calon pengantin curhat soal persiapan nikah",p:["Nadia","Rani"],l:[
[0,"If one more person tells me what color the napkins should be, I'm going to lose it.","Kalau ada satu orang lagi yang ngatur warna serbet, aku bakal meledak."],
[1,"Ha! Who is it this time?","Haha! Siapa kali ini?"],
[0,"My aunt. She thinks gold is 'cheap-looking'.","Tanteku. Menurutnya emas itu 'kelihatan murahan'."],
[1,"But you love gold.","Tapi kamu suka emas."],
[0,"Exactly! It's my wedding, but somehow everyone else gets a vote.","Tepat! Ini pernikahanku, tapi entah bagaimana semua orang ikut menentukan."],
[1,"Have you talked to Dimas about it?","Sudah ngomong sama Dimas?"],
[0,"He's sweet, but he's useless with this stuff. He just says 'whatever you want, babe'.","Dia baik, tapi nggak berguna untuk urusan ginian. Dia cuma bilang 'terserah kamu, sayang'."],
[1,"Okay, here's what I think. Pick your three non-negotiables. Everything else, let people have their way.","Oke, menurutku begini. Pilih tiga hal yang nggak bisa ditawar. Sisanya, biarkan orang lain mengatur."],
[0,"Hmm. The dress, the music, and the gold.","Hmm. Gaunnya, musiknya, dan warna emas."],
[1,"Perfect. And when your aunt brings it up, just smile and say 'it's already decided'.","Sempurna. Dan kalau tantemu mengungkit, senyum saja dan bilang 'sudah diputuskan'."],
[0,"You're a genius. Can you be my wedding planner?","Kamu jenius. Bisa jadi wedding planner-ku?"],
[1,"Absolutely not. But I'll be your maid of honor.","Sama sekali tidak. Tapi aku mau jadi pendamping pengantinmu."]],
n:[["I'm going to lose it","aku bakal hilang kesabaran"],["gets a vote","ikut menentukan"],["non-negotiables","hal yang tidak bisa ditawar"],["have their way","menuruti kemauan mereka"],["maid of honor","pendamping utama pengantin wanita"]]},
{t:"Catching Up After Years",lv:3,s:"Bertemu teman lama setelah bertahun-tahun",p:["Arif","Dan"],l:[
[0,"Dan? Is that really you?","Dan? Beneran kamu?"],
[1,"Arif! No way! How long has it been? Ten years?","Arif! Masa sih! Sudah berapa lama? Sepuluh tahun?"],
[0,"At least. Since graduation. You look exactly the same!","Setidaknya. Sejak wisuda. Kamu kelihatan persis sama!"],
[1,"Ha, you're being nice. I've got way more gray hair now.","Haha, kamu cuma berbaik hati. Ubanku jauh lebih banyak sekarang."],
[0,"So what have you been up to all this time?","Jadi, selama ini kamu sibuk apa?"],
[1,"Oh man, where do I start? I moved to Surabaya, got married, two kids...","Aduh, mulai dari mana ya? Aku pindah ke Surabaya, nikah, dua anak..."],
[0,"Two kids! I can't picture you as a dad.","Dua anak! Aku nggak bisa bayangin kamu jadi ayah."],
[1,"Neither could I, honestly. What about you?","Aku juga nggak bisa, jujur. Kalau kamu?"],
[0,"Still single, still in Jakarta. I started my own design studio a couple of years ago.","Masih lajang, masih di Jakarta. Aku buka studio desain sendiri beberapa tahun lalu."],
[1,"That's awesome! You always talked about doing that.","Keren! Kamu dulu selalu bilang mau begitu."],
[0,"Took me long enough. Listen, we have to grab dinner and properly catch up.","Butuh waktu lama juga. Dengar, kita harus makan malam dan ngobrol panjang."],
[1,"Definitely. Let's swap numbers before we lose each other again.","Pasti. Tukeran nomor yuk sebelum kehilangan kontak lagi."]],
n:[["How long has it been?","sudah berapa lama (tidak bertemu)?"],["What have you been up to?","kamu sibuk apa saja?"],["Where do I start?","mulai dari mana ya?"],["I can't picture you as...","aku tidak bisa membayangkan kamu jadi..."],["Took me long enough","butuh waktu lama juga"],["swap numbers","bertukar nomor"]]},
{t:"Discussing Money Habits",lv:3,s:"Teman ngobrol soal menabung",p:["Bella","Hugo"],l:[
[0,"Okay, real talk. How do you actually save money? You're always so on top of it.","Oke, ngomong serius. Gimana sih caramu menabung? Kamu selalu rapi soal itu."],
[1,"Honestly, it's mostly automatic. The day I get paid, a chunk goes straight into savings.","Jujur, kebanyakan otomatis. Pas gajian, sebagian langsung masuk tabungan."],
[0,"Like, before you even see it?","Maksudnya, sebelum kamu sempat lihat?"],
[1,"Exactly. If I don't see it, I don't spend it.","Tepat. Kalau nggak kelihatan, nggak kepakai."],
[0,"Smart. My problem is the little stuff. Coffee, delivery, random online shopping at midnight.","Pintar. Masalahku hal-hal kecil. Kopi, pesan antar, belanja online asal-asalan tengah malam."],
[1,"The midnight shopping is dangerous.","Belanja tengah malam itu bahaya."],
[0,"I bought a fondue set last month. I've never made fondue in my life.","Bulan lalu aku beli set fondue. Seumur hidup aku nggak pernah bikin fondue."],
[1,"Ha! Try the twenty-four-hour rule. If you want something, wait a day before buying it.","Haha! Coba aturan dua puluh empat jam. Kalau mau sesuatu, tunggu sehari sebelum beli."],
[0,"And usually you don't want it anymore?","Dan biasanya jadi nggak mau lagi?"],
[1,"Nine times out of ten.","Sembilan dari sepuluh kali."],
[0,"Okay, I'm trying that. Starting... tomorrow.","Oke, aku coba. Mulai... besok."]],
n:[["Real talk","ngomong serius"],["on top of it","teratur / menguasai keadaan"],["a chunk","sebagian (cukup besar)"],["Nine times out of ten","hampir selalu"]]},
{t:"Car Accident Aftermath",lv:3,s:"Dua pengemudi setelah tabrakan kecil",p:["Driver A","Driver B"],l:[
[0,"Are you okay? Is anyone hurt?","Anda tidak apa-apa? Ada yang terluka?"],
[1,"I'm fine, I think. Just shaken up. You?","Saya baik, sepertinya. Cuma kaget. Anda?"],
[0,"I'm okay. I'm so sorry, I didn't see you change lanes.","Saya oke. Maaf sekali, saya tidak melihat Anda pindah jalur."],
[1,"Well, I did signal. But let's not argue about it here.","Yah, saya sudah kasih sein. Tapi jangan berdebat di sini."],
[0,"Fair. Should we move the cars to the side? We're blocking traffic.","Benar. Kita pindahkan mobil ke pinggir? Kita menghalangi jalan."],
[1,"Yeah, good idea.","Iya, ide bagus."],
[0,"Okay, let's exchange insurance details. Do you want to take photos of the damage?","Oke, kita tukar data asuransi. Mau foto kerusakannya?"],
[1,"Yes. And I'll get your license plate too.","Iya. Dan saya foto plat nomor Anda juga."],
[0,"Of course. It's mostly just the bumper, it looks like.","Tentu. Sepertinya kebanyakan cuma bumpernya."],
[1,"Mine's got a dent in the door, too.","Punya saya pintunya penyok juga."],
[0,"Okay. Let's just let the insurance companies sort it out.","Oke. Biarkan perusahaan asuransi yang menyelesaikan."],
[1,"Agreed. Here's my number.","Setuju. Ini nomor saya."]],
n:[["shaken up","kaget / terguncang"],["change lanes","pindah jalur"],["signal","menyalakan lampu sein"],["blocking traffic","menghalangi lalu lintas"],["dent","penyok"],["sort it out","menyelesaikannya"]]},
{t:"Talking About Dreams and Goals",lv:3,s:"Obrolan malam soal cita-cita",p:["Mira","Jon"],l:[
[0,"Can I ask you something kind of deep?","Boleh aku tanya sesuatu yang agak dalam?"],
[1,"Uh oh. Sure.","Waduh. Boleh."],
[0,"If money wasn't an issue, what would you be doing with your life?","Kalau uang bukan masalah, kamu akan melakukan apa dalam hidupmu?"],
[1,"Hmm. Probably something with animals. Running a sanctuary or something.","Hmm. Mungkin sesuatu dengan hewan. Mengelola tempat perlindungan atau semacamnya."],
[0,"Really? I never would've guessed that.","Beneran? Aku nggak akan menyangka."],
[1,"I wanted to be a vet when I was a kid. Then I got scared of chemistry and gave up.","Waktu kecil aku pengin jadi dokter hewan. Terus aku takut kimia dan menyerah."],
[0,"That's so sad. Do you ever think about it?","Sedih banget. Kamu pernah kepikiran?"],
[1,"All the time, honestly. What about you?","Sering, jujur. Kalau kamu?"],
[0,"I'd write. Novels, probably. I've had a story in my head for like five years.","Aku akan menulis. Novel, mungkin. Ada cerita di kepalaku sekitar lima tahun."],
[1,"So why don't you write it?","Terus kenapa nggak kamu tulis?"],
[0,"I don't know. I guess I'm scared it won't be good.","Nggak tahu. Kayaknya aku takut hasilnya jelek."],
[1,"It doesn't have to be good. It just has to exist. Then you can fix it.","Nggak harus bagus. Yang penting ada dulu. Nanti baru diperbaiki."]],
n:[["kind of deep","agak mendalam"],["If money wasn't an issue","kalau uang bukan masalah"],["I never would've guessed","aku tidak akan menyangka"],["vet","dokter hewan"],["It just has to exist","yang penting jadi dulu"]]},
{t:"Calling a Landlord",lv:3,s:"Penyewa melapor kerusakan ke pemilik",p:["Tenant","Landlord"],l:[
[0,"Hi Mr. Harris, it's Amy from apartment 3. Sorry to bother you on a Sunday.","Halo Pak Harris, ini Amy dari apartemen 3. Maaf mengganggu hari Minggu."],
[1,"No problem, Amy. What's going on?","Tidak apa, Amy. Ada apa?"],
[0,"There's a leak under the kitchen sink. It's been dripping since last night.","Ada kebocoran di bawah wastafel dapur. Menetes sejak tadi malam."],
[1,"Is it a lot of water?","Airnya banyak?"],
[0,"It's filled a bucket twice already. And the cabinet's getting soaked.","Sudah memenuhi ember dua kali. Dan lemarinya mulai basah kuyup."],
[1,"Okay, that's not good. Have you turned off the water valve under the sink?","Oke, itu tidak bagus. Sudah tutup keran air di bawah wastafel?"],
[0,"I didn't know there was one.","Saya tidak tahu ada kerannya."],
[1,"There should be a little handle on the pipe. Turn it clockwise until it stops.","Harusnya ada pegangan kecil di pipa. Putar searah jarum jam sampai berhenti."],
[0,"Okay... got it. The dripping's stopped.","Oke... sudah. Tetesannya berhenti."],
[1,"Great. I'll have a plumber come by first thing tomorrow morning.","Bagus. Saya suruh tukang ledeng datang besok pagi-pagi."],
[0,"Thank you so much. I'll be home all morning.","Terima kasih banyak. Saya di rumah sepanjang pagi."]],
n:[["leak","kebocoran"],["dripping","menetes"],["valve","katup / keran"],["clockwise","searah jarum jam"],["come by","mampir / datang"],["first thing tomorrow","besok paling awal"]]},
{t:"Encouraging a Friend",lv:3,s:"Menyemangati teman yang gagal tes",p:["Lucas","Amira"],l:[
[0,"So... I didn't pass.","Jadi... aku nggak lulus."],
[1,"Oh no. I'm so sorry. How close were you?","Aduh. Aku turut sedih. Seberapa dekat nilaimu?"],
[0,"Three points. Three stupid points.","Tiga poin. Tiga poin sialan."],
[1,"Ugh, that's the worst. That's almost harder than failing by a lot.","Duh, itu paling nyesek. Itu malah lebih berat daripada gagal jauh."],
[0,"Right? I keep thinking about the questions I second-guessed.","Kan? Aku terus kepikiran soal-soal yang aku ragukan."],
[1,"Don't do that to yourself. You were ridiculously close.","Jangan siksa dirimu begitu. Kamu sudah dekat banget."],
[0,"I just feel like I wasted six months.","Aku cuma merasa buang-buang enam bulan."],
[1,"No way. You learned all that material. It's still in your head. Next time, you're basically just reviewing.","Sama sekali nggak. Kamu sudah belajar semua materi itu. Masih ada di kepalamu. Lain kali kamu tinggal mengulang."],
[0,"I guess that's true.","Benar juga sih."],
[1,"When's the next test date?","Tes berikutnya kapan?"],
[0,"In two months.","Dua bulan lagi."],
[1,"Perfect. Take a week off, then we'll make a plan. I'll quiz you every weekend.","Pas. Istirahat seminggu, lalu kita bikin rencana. Aku kuis kamu tiap akhir pekan."]],
n:[["How close were you?","seberapa dekat (dengan batas lulus)?"],["second-guessed","meragukan (jawaban sendiri)"],["ridiculously close","sangat dekat sekali"],["basically","pada dasarnya"],["quiz you","menguji kamu"]]},
{t:"Debate Over Dinner",lv:3,s:"Keluarga berdebat santai soal kerja dari rumah",p:["Dad","Daughter"],l:[
[0,"I just don't think you can build a real career working from your bedroom.","Ayah cuma nggak yakin kamu bisa membangun karier sungguhan dari kamar tidur."],
[1,"Dad, half my team is in different countries. The office wouldn't even help.","Yah, setengah timku di negara berbeda. Kantor juga nggak akan membantu."],
[0,"But how do people get to know you? How do you get promoted?","Tapi bagaimana orang mengenalmu? Bagaimana kamu naik jabatan?"],
[1,"By doing good work. And being visible in meetings, sending updates, that kind of thing.","Dengan kerja yang bagus. Dan aktif di rapat, kirim update, hal-hal semacam itu."],
[0,"In my day, you had to shake hands, have lunch with your boss.","Di zaman Ayah, kamu harus jabat tangan, makan siang dengan atasan."],
[1,"And I'm sure that worked for you. But the world's changed.","Dan aku yakin itu berhasil untuk Ayah. Tapi dunia sudah berubah."],
[0,"Not that much, I think. People are still people.","Nggak sebanyak itu, menurut Ayah. Manusia tetap manusia."],
[1,"Okay, that's actually a fair point. Relationships still matter.","Oke, itu sebenarnya poin yang adil. Hubungan tetap penting."],
[0,"See? I'm not completely out of touch.","Tuh kan? Ayah nggak sepenuhnya ketinggalan zaman."],
[1,"Only partially.","Cuma sebagian."],
[0,"I'll take it.","Ayah terima."]],
n:[["In my day","di zaman saya dulu"],["visible","terlihat / menonjol"],["That's a fair point","itu poin yang adil"],["out of touch","ketinggalan zaman"],["I'll take it","aku terima (pujian kecil)"]]},
{t:"Jet Lag",lv:3,s:"Teman baru pulang dari luar negeri",p:["Tara","Eli"],l:[
[0,"You look like a zombie.","Kamu kelihatan kayak zombi."],
[1,"Thanks. I feel like one. I got back from New York last night.","Makasih. Aku memang merasa begitu. Aku pulang dari New York tadi malam."],
[0,"Ah, jet lag. How bad is it?","Ah, jet lag. Separah apa?"],
[1,"I woke up at three a.m. wide awake, and now I could fall asleep standing up.","Aku bangun jam tiga pagi melek banget, dan sekarang bisa tidur sambil berdiri."],
[0,"The classic. What's the time difference, like twelve hours?","Klasik. Selisih waktunya berapa, dua belas jam?"],
[1,"Eleven. My body has no idea what day it is.","Sebelas. Tubuhku nggak tahu ini hari apa."],
[0,"Try not to nap. Just push through until tonight.","Usahakan jangan tidur siang. Tahan sampai malam."],
[1,"Easier said than done.","Gampang diomongin, susah dilakuin."],
[0,"Get some sunlight, too. It helps reset your body clock.","Kena sinar matahari juga. Membantu mengatur ulang jam biologismu."],
[1,"Okay, doctor. Anything else?","Oke, dokter. Ada lagi?"],
[0,"Yeah. Coffee. Lots of it.","Iya. Kopi. Yang banyak."]],
n:[["jet lag","lelah karena beda zona waktu"],["wide awake","melek sepenuhnya"],["fall asleep standing up","tertidur sambil berdiri"],["push through","bertahan"],["Easier said than done","gampang diomongin, susah dilakukan"],["body clock","jam biologis"]]},
{t:"Saying No to Extra Work",lv:3,s:"Menolak tambahan pekerjaan dengan profesional",p:["Manager","Analyst"],l:[
[0,"Hey, I know it's last minute, but could you take on the Henderson report this week?","Hei, aku tahu ini mendadak, tapi bisakah kamu ambil laporan Henderson minggu ini?"],
[1,"I'd love to help, but I want to be realistic about my workload.","Aku ingin membantu, tapi aku mau realistis soal beban kerjaku."],
[0,"Of course. What's on your plate?","Tentu. Apa saja yang sedang kamu kerjakan?"],
[1,"I've got the quarterly analysis due Thursday and the client presentation on Friday.","Ada analisis kuartalan tenggat Kamis dan presentasi klien Jumat."],
[0,"Right, I forgot about the presentation.","Iya, aku lupa soal presentasinya."],
[1,"If I take on Henderson, something's going to slip. Which would you want me to prioritize?","Kalau aku ambil Henderson, ada yang akan molor. Mana yang kamu mau aku prioritaskan?"],
[0,"Hmm. The client presentation can't move.","Hmm. Presentasi klien tidak bisa digeser."],
[1,"Then could the quarterly analysis wait until Monday? If so, I can do Henderson.","Kalau begitu, apakah analisis kuartalan bisa tunggu sampai Senin? Kalau bisa, aku ambil Henderson."],
[0,"Let me check with finance. If not, I'll ask Marco.","Aku cek ke bagian keuangan dulu. Kalau nggak bisa, aku minta Marco."],
[1,"Sounds good. Thanks for understanding.","Oke. Terima kasih atas pengertiannya."],
[0,"Thanks for being upfront about it.","Makasih sudah terus terang."]],
n:[["last minute","mendadak"],["workload","beban kerja"],["What's on your plate?","apa saja kerjaanmu sekarang?"],["something's going to slip","ada yang akan terlambat"],["prioritize","memprioritaskan"],["upfront","terus terang"]]},
{t:"At a Networking Event",lv:3,s:"Kenalan di acara networking",p:["Priya","Marco"],l:[
[0,"Hi! Mind if I join you? I don't know a single person here.","Hai! Boleh gabung? Aku nggak kenal satu orang pun di sini."],
[1,"Ha, please do. Same here. I'm Marco.","Haha, silakan. Sama. Aku Marco."],
[0,"Priya. So what brings you here tonight?","Priya. Jadi, apa yang membawamu ke sini malam ini?"],
[1,"My boss basically forced me to come. I'm in logistics. You?","Bosku bisa dibilang memaksaku datang. Aku di logistik. Kamu?"],
[0,"I run a small skincare brand. We're trying to find a better shipping partner, actually.","Aku punya brand skincare kecil. Sebenarnya kami lagi cari mitra pengiriman yang lebih baik."],
[1,"Oh, interesting. What's the issue with your current one?","Oh, menarik. Ada masalah apa dengan yang sekarang?"],
[0,"Delays, mostly. And packages getting damaged. Not great when you're selling glass bottles.","Kebanyakan keterlambatan. Dan paket rusak. Nggak bagus kalau jualan botol kaca."],
[1,"Yeah, that's a nightmare. We actually specialize in fragile goods.","Iya, itu mimpi buruk. Kami justru spesialis barang mudah pecah."],
[0,"Wait, really? Okay, maybe your boss did us both a favor.","Tunggu, serius? Oke, mungkin bosmu malah membantu kita berdua."],
[1,"Ha, don't tell him that. Here's my card. Let's set up a call next week.","Haha, jangan bilang dia. Ini kartuku. Kita atur telepon minggu depan."],
[0,"Perfect. I'll shoot you an email tomorrow.","Sip. Besok aku kirim email."]],
n:[["Mind if I join you?","boleh aku bergabung?"],["What brings you here?","apa yang membawamu ke sini?"],["fragile goods","barang mudah pecah"],["did us both a favor","membantu kita berdua"],["shoot you an email","mengirimimu email (santai)"]]},
{t:"Breakup Talk",lv:3,s:"Teman menghibur yang baru putus",p:["Nina","Ollie"],l:[
[0,"Hey. I brought ice cream. And tissues.","Hai. Aku bawa es krim. Dan tisu."],
[1,"You heard, huh?","Kamu sudah dengar ya?"],
[0,"Your sister texted me. Are you okay?","Kakakmu kirim pesan. Kamu oke?"],
[1,"Not really. I mean, I knew it wasn't working. But I didn't think it would end like this.","Nggak juga. Maksudku, aku tahu hubungannya nggak berjalan. Tapi aku nggak menyangka berakhir begini."],
[0,"Do you want to talk about it, or do you want to watch something stupid and not talk at all?","Mau cerita, atau mau nonton sesuatu yang konyol tanpa ngomong sama sekali?"],
[1,"Maybe both? In that order.","Mungkin dua-duanya? Urut begitu."],
[0,"Deal. Go ahead, I'm listening.","Sepakat. Silakan, aku dengarkan."],
[1,"She said we wanted different things. Which... is true. She wants to move abroad. I want to stay here.","Dia bilang kami ingin hal yang berbeda. Yang... memang benar. Dia mau pindah ke luar negeri. Aku mau tetap di sini."],
[0,"That's really hard. Nobody did anything wrong, but it still hurts.","Itu berat sekali. Nggak ada yang salah, tapi tetap sakit."],
[1,"Yeah. That's exactly it.","Iya. Persis begitu."],
[0,"You don't have to be okay right now, you know.","Kamu nggak harus baik-baik saja sekarang, tahu."],
[1,"Thanks. Seriously. Okay, put on something stupid.","Makasih. Serius. Oke, putar sesuatu yang konyol."]],
n:[["You heard, huh?","kamu sudah dengar ya?"],["it wasn't working","hubungannya tidak berhasil"],["In that order","dengan urutan itu"],["wanted different things","menginginkan hal yang berbeda"],["That's exactly it","persis begitu"]]},
{t:"Tech Support for Grandma",lv:3,s:"Cucu membantu nenek pakai HP lewat telepon",p:["Grandma","Grandson"],l:[
[0,"Sweetheart, the phone isn't working again.","Sayang, HP-nya nggak jalan lagi."],
[1,"Okay, Grandma. What's it doing?","Oke, Nek. Kenapa HP-nya?"],
[0,"The pictures from your cousin's wedding disappeared.","Foto-foto dari pernikahan sepupumu hilang."],
[1,"Okay. Do you see a little icon that looks like a flower? Tap that.","Oke. Nenek lihat ikon kecil yang mirip bunga? Ketuk itu."],
[0,"A flower... there's a rainbow one.","Bunga... ada yang warna pelangi."],
[1,"Yep, that's it. Tap it.","Iya, itu dia. Ketuk."],
[0,"Oh! There they are! Oh, look at little Rafi in his suit.","Oh! Itu dia! Lihat Rafi kecil pakai jas."],
[1,"See? They were just in a different spot.","Tuh kan? Cuma ada di tempat lain."],
[0,"How do I send this one to your aunt?","Gimana cara kirim yang ini ke tantemu?"],
[1,"See the little square with an arrow at the bottom? Tap it, then pick WhatsApp.","Lihat kotak kecil dengan panah di bawah? Ketuk, lalu pilih WhatsApp."],
[0,"Square... arrow... I did it! I'm a genius.","Kotak... panah... berhasil! Nenek jenius."],
[1,"You're a pro now, Grandma.","Nenek sudah jago sekarang."]],
n:[["icon","ikon"],["Tap that","ketuk itu"],["That's it","itu dia"],["in a different spot","di tempat lain"],["You're a pro","kamu sudah jago"]]},
{t:"Choosing a University Major",lv:3,s:"Siswa ragu memilih jurusan, ngobrol dengan kakak",p:["Fika","Brother"],l:[
[0,"I have to choose my major by Friday, and I still have no idea.","Aku harus pilih jurusan paling lambat Jumat, dan aku masih nggak tahu."],
[1,"What are you stuck between?","Kamu bingung di antara apa?"],
[0,"Psychology or business. Mom wants business.","Psikologi atau bisnis. Mama mau bisnis."],
[1,"Okay, but what do you want?","Oke, tapi kamu maunya apa?"],
[0,"Psychology, I think. But everyone says there are no jobs.","Psikologi, kayaknya. Tapi semua orang bilang nggak ada lapangan kerjanya."],
[1,"That's not really true. HR, marketing, research, counseling... psychology shows up everywhere.","Itu nggak sepenuhnya benar. HR, marketing, riset, konseling... psikologi ada di mana-mana."],
[0,"Really? HR uses psychology?","Beneran? HR pakai psikologi?"],
[1,"All the time. Recruitment, training, understanding why people quit.","Selalu. Rekrutmen, pelatihan, memahami kenapa orang resign."],
[0,"Huh. I didn't know that.","Hah. Aku nggak tahu itu."],
[1,"Here's the thing. You'll study harder for something you actually care about.","Begini. Kamu akan belajar lebih giat untuk sesuatu yang benar-benar kamu pedulikan."],
[0,"Can you help me explain that to Mom?","Bisa bantu aku jelasin itu ke Mama?"],
[1,"I've got your back. We'll talk to her together.","Aku dukung kamu. Kita ngomong ke dia bareng."]],
n:[["major","jurusan"],["stuck between","bingung di antara"],["shows up everywhere","muncul di mana-mana"],["Here's the thing","begini masalahnya / intinya"],["I've got your back","aku mendukungmu"]]},
{t:"Gym Buddy Motivation",lv:3,s:"Teman gym saling menyemangati",p:["Rico","Sam"],l:[
[0,"I almost didn't come today.","Hari ini aku hampir nggak datang."],
[1,"Same, man. I was this close to staying in bed.","Sama bro. Aku hampir banget tetap di kasur."],
[0,"What changed your mind?","Apa yang bikin kamu berubah pikiran?"],
[1,"Knowing you'd text me 'where are you' at six-fifteen.","Tahu kamu bakal kirim pesan 'di mana kamu' jam enam lima belas."],
[0,"Ha! That's the whole point of a gym buddy.","Haha! Itu intinya punya teman gym."],
[1,"So what are we hitting today? Legs?","Jadi kita latih apa hari ini? Kaki?"],
[0,"Ugh. Yes. Leg day.","Duh. Iya. Hari kaki."],
[1,"Nobody likes leg day.","Nggak ada yang suka hari kaki."],
[0,"That's exactly why we can't skip it.","Justru karena itu kita nggak boleh skip."],
[1,"Okay, let's knock it out. Squats first?","Oke, ayo selesaikan. Squat dulu?"],
[0,"Squats first. And no complaining until we're done.","Squat dulu. Dan nggak boleh mengeluh sampai selesai."],
[1,"No promises.","Nggak janji."]],
n:[["this close","hampir sekali"],["What changed your mind?","apa yang bikin kamu berubah pikiran?"],["the whole point","inti / tujuan utama"],["What are we hitting?","bagian tubuh mana yang dilatih?"],["knock it out","menyelesaikan dengan cepat"],["No promises","nggak janji"]]},
{t:"Neighborhood Problem",lv:3,s:"Warga membahas masalah sampah di lingkungan",p:["Mr. Lee","Sari"],l:[
[0,"Have you noticed the trash piling up behind the market?","Kamu sudah lihat sampah menumpuk di belakang pasar?"],
[1,"How could I not? You can smell it from my window.","Gimana nggak? Baunya tercium dari jendelaku."],
[0,"The collection truck hasn't come in two weeks.","Truk sampah nggak datang dua minggu."],
[1,"Has anyone complained to the district office?","Ada yang sudah komplain ke kantor kelurahan?"],
[0,"I called twice. They keep saying they'll look into it.","Aku sudah telepon dua kali. Mereka terus bilang akan ditindaklanjuti."],
[1,"Which means nothing. What if we got everyone to sign a letter?","Yang artinya nihil. Gimana kalau kita minta semua warga tanda tangan surat?"],
[0,"That might get their attention. Strength in numbers.","Itu mungkin menarik perhatian mereka. Kekuatan ada di jumlah."],
[1,"I can write it tonight if you help me collect signatures.","Aku bisa tulis malam ini kalau kamu bantu kumpulkan tanda tangan."],
[0,"Deal. I'll take the east side of the street.","Sepakat. Aku ambil sisi timur jalan."],
[1,"And I'll post it in the neighborhood group chat too.","Dan aku posting juga di grup chat warga."],
[0,"Good thinking. Let's get this sorted.","Ide bagus. Ayo kita selesaikan."]],
n:[["piling up","menumpuk"],["How could I not?","gimana mungkin tidak?"],["look into it","menindaklanjuti / memeriksa"],["Strength in numbers","bersatu kita kuat"],["Let's get this sorted","ayo kita selesaikan"]]},
{t:"Changing Careers",lv:3,s:"Diskusi pindah karier ke bidang teknologi",p:["Hana","Mentor"],l:[
[0,"I've been thinking about switching into UX design. Am I crazy?","Aku kepikiran pindah ke UX design. Apa aku gila?"],
[1,"Not at all. What's pulling you toward it?","Sama sekali nggak. Apa yang menarikmu ke sana?"],
[0,"I've been in customer service for six years. I spend all day hearing what frustrates people about our app.","Aku di customer service enam tahun. Seharian aku dengar apa yang bikin orang frustrasi dengan aplikasi kami."],
[1,"That's actually a huge advantage. Most designers would kill for that kind of insight.","Itu justru keunggulan besar. Kebanyakan desainer sangat menginginkan wawasan semacam itu."],
[0,"Really? I thought I'd be starting from zero.","Beneran? Kukira aku mulai dari nol."],
[1,"Not even close. You understand users. Now you just need the tools and a portfolio.","Jauh dari itu. Kamu paham pengguna. Sekarang kamu cuma butuh tools dan portofolio."],
[0,"Where would I even start?","Mulainya dari mana?"],
[1,"Take a short course, then redesign something you already know well. Like the app you support.","Ikut kursus singkat, lalu desain ulang sesuatu yang sudah kamu kenal. Seperti aplikasi yang kamu tangani."],
[0,"Oh, that's clever. I know exactly what's broken in it.","Oh, itu pintar. Aku tahu persis apa yang rusak di sana."],
[1,"Exactly. And that tells a great story in an interview.","Tepat. Dan itu jadi cerita bagus saat wawancara."],
[0,"Okay. I'm feeling a lot less crazy now.","Oke. Aku merasa jauh lebih nggak gila sekarang."]],
n:[["switching into","beralih ke"],["What's pulling you toward it?","apa yang membuatmu tertarik?"],["would kill for","sangat menginginkan"],["Not even close","jauh dari itu"],["tells a great story","menjadi cerita yang bagus"]]},
{t:"Ordering at a Busy Bar",lv:3,s:"Memesan minuman di bar ramai",p:["Bartender","Customer"],l:[
[0,"Hey, what can I get you?","Hai, mau pesan apa?"],
[1,"Can I get two of whatever's on tap? And a lemonade.","Boleh pesan dua yang ada di keran? Dan satu limun."],
[0,"We've got a lager and an IPA on tap.","Kami punya lager dan IPA di keran."],
[1,"Two lagers, then. Actually, sorry, can you make one of them a small?","Dua lager kalau begitu. Eh, maaf, salah satunya bisa yang kecil?"],
[0,"No problem. Want to start a tab?","Bisa. Mau buka tagihan berjalan?"],
[1,"Sure, here's my card.","Boleh, ini kartu saya."],
[0,"Name on the tab?","Atas nama?"],
[1,"Ben. And could I get a menu? We might order some food.","Ben. Dan boleh minta menu? Mungkin kami pesan makanan."],
[0,"Kitchen closes in twenty minutes, just so you know.","Dapur tutup dua puluh menit lagi, sebagai info."],
[1,"Oh, good to know. What's quick?","Oh, makasih infonya. Apa yang cepat?"],
[0,"The wings and the fries come out fast.","Sayap ayam dan kentang goreng keluarnya cepat."],
[1,"Perfect, one of each.","Sip, masing-masing satu."]],
n:[["on tap","dari keran (bir draft)"],["start a tab","membuka tagihan berjalan"],["just so you know","sebagai info saja"],["one of each","masing-masing satu"]]},
{t:"Discussing the News",lv:3,s:"Rekan kerja membahas berita tentang AI",p:["Tom","Rina"],l:[
[0,"Did you see that article about AI replacing jobs?","Kamu lihat artikel soal AI menggantikan pekerjaan?"],
[1,"Which one? There's a new one every day.","Yang mana? Tiap hari ada yang baru."],
[0,"Fair. This one said thirty percent of office tasks could be automated in ten years.","Benar. Yang ini bilang tiga puluh persen tugas kantor bisa diotomatisasi dalam sepuluh tahun."],
[1,"Tasks, though. Not jobs. That's a big difference.","Tapi tugas, ya. Bukan pekerjaan. Itu perbedaan besar."],
[0,"How so?","Maksudnya?"],
[1,"Well, if a tool handles the boring parts of my job, I can focus on the stuff that actually needs a human.","Yah, kalau alat mengerjakan bagian membosankan dari pekerjaanku, aku bisa fokus pada hal yang benar-benar butuh manusia."],
[0,"That's the optimistic take. Some companies will just hire fewer people.","Itu pandangan yang optimis. Beberapa perusahaan cuma akan merekrut lebih sedikit orang."],
[1,"True, that's a real risk. Which is why I think learning to use these tools matters.","Benar, itu risiko nyata. Makanya menurutku belajar memakai alat-alat ini penting."],
[0,"So, adapt or get left behind.","Jadi, beradaptasi atau tertinggal."],
[1,"Pretty much. It's not a comfortable thought, but there it is.","Kurang lebih. Bukan pikiran yang nyaman, tapi begitulah."]],
n:[["How so?","maksudnya bagaimana?"],["the optimistic take","pandangan yang optimis"],["get left behind","tertinggal"],["Pretty much","kurang lebih begitu"],["there it is","begitulah kenyataannya"]]},
{t:"Hosting a Dinner",lv:3,s:"Tuan rumah menyambut tamu makan malam",p:["Host","Guest"],l:[
[0,"Come in, come in! Let me take your coat.","Masuk, masuk! Sini aku ambilkan mantelmu."],
[1,"Thanks! Something smells incredible.","Makasih! Ada yang wanginya luar biasa."],
[0,"That's the lamb. It's been in the oven for four hours.","Itu daging dombanya. Sudah empat jam di oven."],
[1,"Wow, you went all out. I brought dessert, by the way.","Wah, kamu all out banget. Omong-omong, aku bawa makanan penutup."],
[0,"You didn't have to do that! What is it?","Kamu nggak perlu repot! Apa itu?"],
[1,"Just a chocolate tart. Don't get too excited, it's store-bought.","Cuma tart cokelat. Jangan terlalu semangat, belinya di toko."],
[0,"Store-bought is perfect. Make yourself at home. Can I get you a drink?","Beli di toko itu sempurna. Anggap rumah sendiri. Mau minum apa?"],
[1,"Whatever you're having.","Apa pun yang kamu minum."],
[0,"I've got a nice ginger soda. Everyone else should be here in ten.","Aku ada soda jahe enak. Yang lain harusnya datang sepuluh menit lagi."],
[1,"Need any help in the kitchen?","Perlu bantuan di dapur?"],
[0,"Absolutely not. You're a guest. Sit down and relax.","Sama sekali tidak. Kamu tamu. Duduk dan santai."]],
n:[["went all out","mengerahkan segalanya / niat banget"],["You didn't have to","kamu tidak perlu repot"],["store-bought","beli di toko"],["Make yourself at home","anggap rumah sendiri"],["Whatever you're having","apa pun yang kamu minum"]]},
{t:"Return From Maternity Leave",lv:3,s:"Rekan kerja menyambut kembali setelah cuti melahirkan",p:["Lena","Kate"],l:[
[0,"Kate! You're back! How are you? How's the baby?","Kate! Kamu balik! Apa kabar? Bayinya gimana?"],
[1,"Hi! She's amazing. Exhausting, but amazing.","Hai! Dia luar biasa. Melelahkan, tapi luar biasa."],
[0,"I bet. Are you getting any sleep?","Pasti. Kamu bisa tidur?"],
[1,"What's sleep? I think I've forgotten.","Apa itu tidur? Kayaknya aku sudah lupa."],
[0,"Ha! How does it feel being back at work?","Haha! Gimana rasanya kembali kerja?"],
[1,"Weird, honestly. Part of me is excited to use my brain again, and part of me just wants to be home with her.","Aneh, jujur. Sebagian diriku senang pakai otak lagi, dan sebagian cuma ingin di rumah bersamanya."],
[0,"That makes total sense. Go easy on yourself this first week.","Itu sangat masuk akal. Santai saja minggu pertama ini."],
[1,"Thanks. What did I miss? Anything big?","Makasih. Aku ketinggalan apa? Ada yang besar?"],
[0,"We switched to a new project management tool. Everyone hates it.","Kita ganti aplikasi manajemen proyek baru. Semua orang benci."],
[1,"Of course. Some things never change.","Ya jelas. Beberapa hal nggak pernah berubah."],
[0,"Want to grab lunch later? I'll catch you up.","Mau makan siang nanti? Aku ceritain semuanya."]],
n:[["I bet","pasti / sudah kuduga"],["Go easy on yourself","jangan terlalu keras pada dirimu"],["What did I miss?","aku ketinggalan apa?"],["Some things never change","ada hal yang tidak pernah berubah"],["catch you up","menceritakan yang kamu lewatkan"]]},
{t:"Ordering Groceries Online Gone Wrong",lv:3,s:"Pasangan membahas belanja online yang salah",p:["Mark","Ellie"],l:[
[0,"Babe, why are there twelve cucumbers in the fridge?","Sayang, kenapa ada dua belas timun di kulkas?"],
[1,"Oh no. I think I clicked 'twelve' instead of 'two'.","Aduh. Kayaknya aku klik 'dua belas' bukannya 'dua'."],
[0,"And forty eggs?","Dan empat puluh telur?"],
[1,"Okay, that one was on purpose. They were on sale.","Oke, yang itu sengaja. Lagi diskon."],
[0,"There are two of us. What are we gonna do with forty eggs?","Kita cuma berdua. Mau diapakan empat puluh telur?"],
[1,"Breakfast for dinner all week?","Menu sarapan untuk makan malam seminggu?"],
[0,"I can't tell if you're joking.","Aku nggak bisa bedain kamu bercanda atau nggak."],
[1,"Half joking. We could make a big batch of cake and take it to your parents' on Sunday.","Setengah bercanda. Kita bisa bikin kue banyak dan bawa ke rumah orang tuamu hari Minggu."],
[0,"Okay, that's actually not a bad idea. And the cucumbers?","Oke, itu sebenarnya ide yang lumayan. Timunnya?"],
[1,"Pickles. I've always wanted to try making them.","Acar. Aku sudah lama pengin coba bikin."],
[0,"You're somehow turning a mistake into a hobby.","Kamu entah bagaimana mengubah kesalahan jadi hobi."],
[1,"It's a gift.","Itu bakat."]],
n:[["on purpose","sengaja"],["on sale","sedang diskon"],["I can't tell if...","aku tidak bisa membedakan apakah..."],["a big batch","dalam jumlah banyak (sekali buat)"],["It's a gift","itu bakat (bercanda)"]]},
{t:"Late-Night Deep Talk",lv:3,s:"Obrolan tengah malam soal penyesalan",p:["Ayla","Ken"],l:[
[0,"Do you ever think about the paths you didn't take?","Kamu pernah memikirkan jalan yang tidak kamu ambil?"],
[1,"All the time. Especially at two in the morning, apparently.","Sering. Apalagi jam dua pagi, rupanya."],
[0,"Ha. Like what?","Haha. Contohnya?"],
[1,"I almost moved to Japan after college. I had a job offer teaching English.","Aku hampir pindah ke Jepang setelah kuliah. Ada tawaran kerja jadi guru bahasa Inggris."],
[0,"What stopped you?","Apa yang menghentikanmu?"],
[1,"Fear, mostly. And my dad got sick around the same time.","Kebanyakan takut. Dan ayahku sakit di waktu yang sama."],
[0,"That's not fear, though. That's being a good son.","Tapi itu bukan takut. Itu jadi anak yang baik."],
[1,"Maybe it was a bit of both.","Mungkin sedikit dua-duanya."],
[0,"Do you regret it?","Kamu menyesal?"],
[1,"Not exactly. I just wonder sometimes. Who would I be?","Nggak juga. Cuma kadang aku bertanya-tanya. Aku akan jadi siapa?"],
[0,"Probably the same person, just with better chopstick skills.","Mungkin orang yang sama, cuma lebih jago pakai sumpit."],
[1,"Ha! Thanks. I needed that.","Haha! Makasih. Aku butuh itu."]],
n:[["the paths you didn't take","pilihan hidup yang tidak diambil"],["What stopped you?","apa yang menghalangimu?"],["a bit of both","sedikit dari keduanya"],["I just wonder sometimes","aku cuma kadang bertanya-tanya"],["I needed that","aku butuh itu (tawa/hiburan)"]]},
{t:"Last Day at Work",lv:3,s:"Perpisahan di hari terakhir kerja",p:["Boss","Employee"],l:[
[0,"So this is it, huh? Your last day.","Jadi ini dia ya? Hari terakhirmu."],
[1,"It still hasn't really sunk in.","Masih belum benar-benar terasa."],
[0,"You know you're leaving a big hole here, right?","Kamu tahu kamu meninggalkan lubang besar di sini, kan?"],
[1,"That means a lot. Honestly, I learned so much from you.","Itu sangat berarti. Jujur, aku belajar banyak darimu."],
[0,"You did most of the work yourself. I just stayed out of your way.","Kamu yang kerja keras sendiri. Aku cuma tidak menghalangi."],
[1,"That's a skill too, you know. Not every manager can do that.","Itu juga keahlian, lho. Nggak semua manajer bisa begitu."],
[0,"Ha, I'll take that as a compliment. Keep in touch, okay? And if the new place doesn't treat you right, the door's always open.","Haha, aku anggap itu pujian. Tetap kontak ya? Dan kalau tempat baru tidak memperlakukanmu dengan baik, pintu selalu terbuka."],
[1,"I really appreciate that.","Aku sangat menghargai itu."],
[0,"The team's taking you out for drinks at six. Don't try to sneak away.","Tim mau ajak kamu minum jam enam. Jangan coba kabur diam-diam."],
[1,"I wouldn't dream of it.","Aku nggak akan berani."]],
n:[["It hasn't sunk in","belum benar-benar terasa / belum percaya"],["stayed out of your way","tidak menghalangimu"],["Keep in touch","tetap berhubungan"],["the door's always open","pintu selalu terbuka (boleh kembali)"],["sneak away","kabur diam-diam"],["I wouldn't dream of it","tidak terpikir sedikit pun"]]},
{t:"At the Mechanic",lv:3,s:"Membawa mobil ke bengkel",p:["Mechanic","Owner"],l:[
[0,"So what seems to be the problem?","Jadi, masalahnya apa?"],
[1,"There's this grinding noise whenever I brake. It started about a week ago.","Ada bunyi gesekan setiap saya ngerem. Mulai sekitar seminggu lalu."],
[0,"Does the car pull to one side when you stop?","Mobilnya menarik ke satu sisi waktu berhenti?"],
[1,"A little bit to the left, now that you mention it.","Sedikit ke kiri, setelah kamu sebut itu."],
[0,"Sounds like your brake pads are worn down. Let me take a look.","Sepertinya kampas remnya aus. Saya periksa dulu."],
[0,"Yeah, they're pretty much gone. You've been driving on metal.","Iya, hampir habis. Kamu sudah nyetir dengan logam bergesekan."],
[1,"Is that bad?","Itu buruk?"],
[0,"It's not great. It can damage the rotors if you wait too long.","Kurang bagus. Bisa merusak piringan rem kalau terlalu lama."],
[1,"How much are we looking at?","Biayanya kira-kira berapa?"],
[0,"For new pads on the front, around a hundred and fifty. If the rotors need replacing, more like four hundred.","Untuk kampas depan baru, sekitar seratus lima puluh. Kalau piringannya perlu diganti, sekitar empat ratus."],
[1,"Let's hope it's just the pads. When can you have it done?","Semoga cuma kampasnya. Kapan bisa selesai?"],
