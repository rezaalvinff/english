[0,"If you leave it with me, by tomorrow afternoon.","Kalau ditinggal di sini, besok sore."]],
n:[["What seems to be the problem?","masalahnya apa? (khas montir/dokter)"],["now that you mention it","setelah kamu menyebutnya"],["worn down","aus"],["How much are we looking at?","kira-kira berapa biayanya?"],["have it done","menyelesaikannya"]]},
{t:"Long-Distance Friendship",lv:3,s:"Sahabat beda negara video call",p:["Dini","Clara"],l:[
[0,"I can't believe it's been a year since you moved.","Aku nggak percaya sudah setahun sejak kamu pindah."],
[1,"I know. Some days it feels like forever, some days it feels like last week.","Iya. Kadang terasa lama sekali, kadang terasa seperti minggu lalu."],
[0,"Do you like it there now?","Sekarang kamu suka di sana?"],
[1,"I do. It took a while, though. The first winter nearly broke me.","Suka. Tapi butuh waktu. Musim dingin pertama hampir bikin aku menyerah."],
[0,"I remember. You sent me a voice note crying about the sun setting at four.","Aku ingat. Kamu kirim pesan suara sambil nangis karena matahari terbenam jam empat."],
[1,"Don't remind me. How about you? How's everything back home?","Jangan ingatkan. Kamu gimana? Bagaimana kabar di sana?"],
[0,"Same old. Work, family, traffic. I miss having you around, though.","Gitu-gitu aja. Kerja, keluarga, macet. Tapi aku kangen kamu ada di sini."],

<script>
(function(){
"use strict";
const LVN={1:"Pemula",2:"Menengah",3:"Mahir"};
const sortLv=a=>a.map((x,i)=>[x,i]).sort((p,q)=>p[0].lv-q[0].lv||p[1]-q[1]).map(p=>p[0]);
const S=sortLv(STORIES), T=sortLv(TALKS);
S.forEach((s,i)=>{s.id="s"+(i+1);s.n=i+1});
T.forEach((t,i)=>{t.nt=t.n||[];t.id="t"+(i+1);t.n=i+1});
const WEEKS=Math.ceil(Math.max(S.length,T.length)/2);

const store={get(k,d){try{const v=localStorage.getItem("es_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("es_"+k,JSON.stringify(v))}catch(e){}}};
let done=new Set(store.get("done",[]));
let settings=Object.assign({rate:0.9,va:"",vb:""},store.get("settings",{}));
const saveDone=()=>store.set("done",[...done]);
const saveSettings=()=>store.set("settings",settings);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
 read:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>',
 listen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>',
 me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
 stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
 tick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
 prev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
 next:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>'
};

/* ---------- speech ---------- */
const synth=window.speechSynthesis;
const hasTTS=!!synth&&typeof window.SpeechSynthesisUtterance!=="undefined";
let voices=[];let appReady=false;
function loadVoices(){ if(!hasTTS)return; voices=synth.getVoices().filter(v=>/^en/i.test(v.lang)); if(appReady&&state.tab==="me"&&!state.detail)render(); }
if(hasTTS){ loadVoices(); try{synth.addEventListener("voiceschanged",loadVoices)}catch(e){synth.onvoiceschanged=loadVoices} }
function pickVoice(k){
  let v=voices.find(x=>x.name===settings[k]);
  if(v)return v;
  const us=voices.filter(x=>/en[-_]US/i.test(x.lang)); const pool=us.length?us:voices;
  return k==="vb"?(pool[1]||pool[0]):pool[0];
}
let qToken=0;
function stopSpeech(){qToken++; if(hasTTS)synth.cancel(); document.querySelectorAll(".reading,.playing").forEach(e=>e.classList.remove("reading","playing")); setPlayBtn(false);}
function speakQueue(items,onItem,onEnd){
  if(!hasTTS){flashNoTTS();return}
  stopSpeech(); const tk=qToken; let i=0;
  const same=pickVoice("va")===pickVoice("vb");
  const next=()=>{
    if(tk!==qToken)return;
    if(i>=items.length){onEnd&&onEnd();return}
    const it=items[i]; onItem&&onItem(i);
    const u=new SpeechSynthesisUtterance(it.text);
    const v=pickVoice(it.voice||"va"); if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
    u.rate=it.rate||settings.rate; u.pitch=(same&&it.voice==="vb")?0.78:1;
    let fired=false; const go=()=>{if(fired)return;fired=true;i++;setTimeout(next,it.gap==null?280:it.gap)};
    u.onend=go; u.onerror=()=>{if(tk===qToken)go()};
    synth.speak(u);
  };
  next();
}
function say(text,voice){ speakQueue([{text,voice:voice||"va"}],null,()=>setPlayBtn(false)); }
let playing=false;
function setPlayBtn(on){playing=on;const b=document.getElementById("playbtn"); if(b)b.innerHTML=on?I.stop+" Stop":I.play+(b.dataset.label?" "+b.dataset.label:" Putar");}
function flashNoTTS(){const n=document.getElementById("ttsnote"); if(n){n.hidden=false;n.scrollIntoView({block:"center"})}}

/* ---------- state ---------- */
const state={tab:"home",detail:null,filter:{read:0,listen:0},week:currentWeek(),hide:false,trans:true,confirmReset:false,scroll:{}};
function currentWeek(){for(let w=1;w<=WEEKS;w++){if(weekItems(w).some(x=>!done.has(x.id)))return w}return WEEKS}
function weekItems(w){const a=[];const s1=S[2*w-2],t1=T[2*w-2],s2=S[2*w-1],t2=T[2*w-1];[s1,t1,s2,t2].forEach(x=>x&&a.push(x));return a}
function weekOf(item){return Math.floor((item.n-1)/2)+1}

const $=id=>document.getElementById(id);
function go(patch){ stopSpeech(); if(!state.detail)state.scroll[state.tab]=window.scrollY; Object.assign(state,patch); render(); window.scrollTo(0,(!state.detail&&patch.tab===undefined&&state.scroll[state.tab])||0); }

function render(){
  renderNav();
  if(state.detail){ state.detail.type==="s"?renderStory(S[state.detail.i]):renderTalk(T[state.detail.i]); return; }
  ({home:renderHome,read:()=>renderList("read"),listen:()=>renderList("listen"),me:renderMe})[state.tab]();
}
function renderNav(){
  const tabs=[["home","Rencana"],["read","Reading"],["listen","Listening"],["me","Progres"]];
  $("nav").innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" ${state.tab===k?'aria-current="page"':""}>${I[k]}<span>${l}</span></button>`).join("");
}
function top(title,back){
  $("top").innerHTML=(back?`<button class="iconbtn" data-act="back" aria-label="Kembali">${I.back}</button>`:"")+`<h1>${title}</h1>`;
}
const ttsNotice=()=>`<div class="notice warn" id="ttsnote" ${hasTTS?"hidden":""}><b>Suara tidak tersedia di tampilan ini.</b> Buka link aplikasi ini di browser Chrome (Android) atau Safari (iPhone) supaya fitur Listening bisa bersuara.</div>`;
const lvChip=lv=>`<span class="lv lv${lv}">${LVN[lv]}</span>`;
const checkEl=on=>`<span class="check ${on?"on":""}">${on?I.tick:""}</span>`;

/* ---------- home ---------- */
function renderHome(){
  top(`<span class="brand">English <b>Setahun</b></span>`);
  const w=state.week, items=weekItems(w), total=S.length+T.length, d=done.size;
  const lv=Math.max(...items.map(x=>x.lv));
  const wkDone=items.filter(x=>done.has(x.id)).length;
  const [s1,t1,s2,t2]=items;
  const card=(x,kind)=>!x?"":`<button class="wk" data-open="${x.id}">
    <span class="k"><span class="eyebrow">${kind}</span>${checkEl(done.has(x.id))}</span>
    <b>${esc(x.t)}</b><span class="muted" style="font-size:13px">${kind==="Reading"?wordCount(x)+" kata":x.l.length+" baris · "+esc(x.p.join(" & "))}</span></button>`;
  $("main").innerHTML=`
  ${ttsNotice()}
  <section class="stack">
    <div class="row" style="justify-content:space-between">
      <button class="iconbtn" data-week="-1" aria-label="Minggu sebelumnya" ${w<=1?"disabled":""}>${I.prev}</button>
      <div style="text-align:center;flex:1">
        <div class="eyebrow">Minggu ${w} dari ${WEEKS} · ${LVN[lv]}</div>
        <h2>${wkDone===items.length?"Minggu ini selesai":"Target minggu ini"}</h2>
      </div>
      <button class="iconbtn" data-week="1" aria-label="Minggu berikutnya" ${w>=WEEKS?"disabled":""}>${I.next}</button>
    </div>
    <div class="week-items">${card(s1,"Reading")}${card(t1,"Listening")}${card(s2,"Reading")}${card(t2,"Listening")}</div>
  </section>
  <section class="card pad stack">
    <h3>Rutinitas 20 menit sehari</h3>
    <div class="days">
      <div class="day"><span>Hari 1</span><span>Baca <b>${esc(s1?s1.t:"")}</b>. Tebak arti kata dulu, baru cek daftar kosakata.</span></div>
      <div class="day"><span>Hari 2</span><span>Dengarkan <b>${esc(t1?t1.t:"")}</b> dengan teks disembunyikan. Putar 2–3 kali, lalu buka teksnya.</span></div>
      <div class="day"><span>Hari 3</span><span>Shadowing: ketuk tiap baris percakapan itu dan tirukan langsung, termasuk intonasinya.</span></div>
      <div class="day"><span>Hari 4</span><span>Baca <b>${esc(s2?s2.t:"")}</b>, lalu jawab pertanyaan pemahamannya.</span></div>
      <div class="day"><span>Hari 5</span><span>Dengarkan <b>${esc(t2?t2.t:"")}</b> tanpa teks, lalu dengan terjemahan.</span></div>
      <div class="day"><span>Hari 6</span><span>Shadowing percakapan kedua. Baca cerita pertama keras-keras.</span></div>
      <div class="day"><span>Hari 7</span><span>Ulang materi yang paling susah minggu ini. Pengulangan itu kuncinya.</span></div>
    </div>
  </section>
  <section class="card pad stack">
    <div class="row" style="justify-content:space-between"><h3>Progres setahun</h3><span class="muted" style="font-variant-numeric:tabular-nums">${d}/${total}</span></div>
    <div class="bar"><i style="width:${(d/total*100).toFixed(1)}%"></i></div>
    <span class="tip">${S.length} cerita pendek dan ${T.length} percakapan native, dari level Pemula sampai Mahir.</span>
  </section>`;
}
function wordCount(s){return s.x.split(/\s+/).length}

/* ---------- lists ---------- */
function renderList(kind){
  const isR=kind==="read", data=isR?S:T, f=state.filter[kind];
  top(isR?"Reading · Cerita Pendek":"Listening · Percakapan");
  const rows=data.filter(x=>!f||x.lv===f);
  const doneN=data.filter(x=>done.has(x.id)).length;
  $("main").innerHTML=`
  ${isR?"":ttsNotice()}
  <div class="row wrap">${[0,1,2,3].map(l=>`<button class="chip" data-filter="${kind}:${l}" aria-pressed="${f===l}">${l?LVN[l]:"Semua"}</button>`).join("")}
    <span class="muted" style="margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums">${doneN}/${data.length} selesai</span></div>
  <div class="card list">${rows.map(x=>`<button class="item" data-open="${x.id}">
    <span class="num">${String(x.n).padStart(3,"0")}</span>
    <span class="t"><b>${esc(x.t)}</b><small>${lvChip(x.lv)} &nbsp;Minggu ${weekOf(x)} · ${isR?wordCount(x)+" kata":esc(x.s)}</small></span>
    ${checkEl(done.has(x.id))}</button>`).join("")}</div>`;
}

/* ---------- story ---------- */
function renderStory(s){
  top(esc(s.t),true);
  let si=0; const sents=[];
  const paras=s.x.split(/\n\n/).map(p=>{
    const parts=p.match(/[^.!?]+[.!?]+[”’"]*\s*|[^.!?]+$/g)||[p];
    return "<p>"+parts.map(t=>{sents.push(t.trim());const html=t.split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="w">${esc(w)}</span>`:w).join("");return `<span class="sen" data-si="${si++}">${html}</span>`}).join("")+"</p>";
  }).join("");
  state.sents=sents;
  const isDone=done.has(s.id);
  $("main").innerHTML=`
  <div class="row wrap">${lvChip(s.lv)}<span class="muted" style="font-size:13px">Cerita ${s.n} dari ${S.length} · Minggu ${weekOf(s)} · ${wordCount(s)} kata · ±${Math.max(1,Math.round(wordCount(s)/120))} menit</span></div>
  ${ttsNotice()}
  <div class="player">
    <button class="btn btn-pri" id="playbtn" data-act="readall" data-label="Dengarkan cerita">${I.play} Dengarkan cerita</button>
    ${speedChips()}
  </div>
  <p class="tip" style="margin:0">Ketuk kata mana saja untuk mendengar cara mengucapkannya.</p>
  <article class="page" id="page">${paras}</article>
  <section class="card pad">
    <h3 style="margin-bottom:4px">Kosakata</h3><p class="tip" style="margin:0 0 4px">Ketuk untuk dengar pengucapan.</p>
    <div class="vocab">${s.v.map(v=>`<button data-say="${esc(v[0])}"><span class="en">${esc(v[0])}</span><span>${esc(v[1])}</span></button>`).join("")}</div>
  </section>
  <section class="card pad">
    <h3 style="margin-bottom:4px">Cek pemahaman</h3><p class="tip" style="margin:0 0 4px">Jawab dalam bahasa Inggris (boleh diucapkan), lalu ketuk untuk lihat jawaban.</p>
    ${s.q.map(q=>`<details class="q"><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join("")}
  </section>
  ${footer(s,"s",S)}`;
}
function speedChips(){return `<div class="speed" role="group" aria-label="Kecepatan">${[[0.7,"Pelan"],[0.9,"Normal"],[1.05,"Native"]].map(([r,l])=>`<button class="chip" data-rate="${r}" aria-pressed="${settings.rate===r}">${l}</button>`).join("")}</div>`}
function footer(x,type,arr){
  const isDone=done.has(x.id), nx=arr[x.n];
  return `<div class="footer-actions">
    <button class="btn ${isDone?"btn-ok":"btn-ghost"}" data-done="${x.id}">${isDone?I.tick+" Sudah selesai":"Tandai selesai"}</button>
    ${nx?`<button class="btn btn-sec" data-open="${nx.id}">Berikutnya ${I.next}</button>`:""}
  </div>`;
}

/* ---------- talk ---------- */
function renderTalk(t){
  top(esc(t.t),true);
  $("main").innerHTML=`
  <div class="row wrap">${lvChip(t.lv)}<span class="muted" style="font-size:13px">Percakapan ${t.n} dari ${T.length} · Minggu ${weekOf(t)}</span></div>
  <p style="margin:0"><b>Situasi:</b> ${esc(t.s)}</p>
  ${ttsNotice()}
  <div class="player">
    <button class="btn btn-pri" id="playbtn" data-act="talkall" data-label="Putar semua">${I.play} Putar semua</button>
    ${speedChips()}
  </div>
  <div class="toggles">
    <button class="chip" data-act="hide" aria-pressed="${state.hide}">Sembunyikan teks</button>
    <button class="chip" data-act="trans" aria-pressed="${state.trans}">Terjemahan</button>
  </div>
  <div class="lines ${state.hide?"hidetext":""}" id="lines">
    ${t.l.map((l,i)=>{const b=l[0]===1;const name=t.p[l[0]];return `<button class="line ${b?"b":""}" data-line="${i}">
      <span class="av ${b?"b":"a"}">${esc(name.replace(/^(Mr\.|Mrs\.)\s*/,"").charAt(0))}</span>
      <span style="min-width:0"><span class="who">${esc(name)}</span><span class="en" style="display:block">${esc(l[1])}</span>${state.trans?`<span class="id" style="display:block">${esc(l[2])}</span>`:""}</span></button>`}).join("")}
  </div>
  <p class="tip" style="margin:0"><b>Shadowing:</b> ketuk satu baris, dengarkan, lalu langsung tirukan dengan kecepatan dan nada yang sama. Ulangi sampai lancar.</p>
  <section class="card pad">
    <h3 style="margin-bottom:4px">Ungkapan khas native</h3><p class="tip" style="margin:0 0 4px">Ketuk untuk dengar pengucapan.</p>
    <div class="notes">${t.nt.map(n=>`<button data-say="${esc(n[0])}"><b>${esc(n[0])}</b><br><span class="muted">${esc(n[1])}</span></button>`).join("")}</div>
  </section>
  ${footer(t,"t",T)}`;
}
function playTalk(t,from,only){
  const lines=t.l.map((l,i)=>({text:l[1],voice:l[0]===1?"vb":"va",i})).slice(from,only?from+1:undefined);
  setPlayBtn(!only);
  speakQueue(lines,k=>{
    document.querySelectorAll(".line.playing").forEach(e=>e.classList.remove("playing"));
    const el=document.querySelector(`[data-line="${lines[k].i}"]`); if(el){el.classList.add("playing");el.scrollIntoView({block:"nearest",behavior:"smooth"})}
  },()=>{document.querySelectorAll(".line.playing").forEach(e=>e.classList.remove("playing"));setPlayBtn(false)});
}

/* ---------- progress & settings ---------- */
function renderMe(){
  top("Progres & Pengaturan");
  const sd=S.filter(x=>done.has(x.id)).length, td=T.filter(x=>done.has(x.id)).length;
  const opt=k=>`<option value="">Otomatis</option>`+voices.map(v=>`<option value="${esc(v.name)}" ${settings[k]===v.name?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  $("main").innerHTML=`
  <div class="stat">
    <div class="card pad"><span class="eyebrow">Reading</span><b>${sd}<span class="muted" style="font-size:15px">/${S.length}</span></b><div class="bar"><i style="width:${sd/S.length*100}%"></i></div></div>
    <div class="card pad"><span class="eyebrow">Listening</span><b>${td}<span class="muted" style="font-size:15px">/${T.length}</span></b><div class="bar"><i style="width:${td/T.length*100}%"></i></div></div>
  </div>
  ${ttsNotice()}
  <section class="card pad stack">
    <h3>Suara</h3>
    ${hasTTS&&voices.length?`
    <label class="f" for="va">Suara pembicara pertama<select id="va" data-voice="va">${opt("va")}</select></label>
    <label class="f" for="vb">Suara pembicara kedua<select id="vb" data-voice="vb">${opt("vb")}</select></label>
    <div class="row wrap"><button class="btn btn-sec" data-act="testvoice">${I.play} Tes suara</button></div>
    <p class="tip" style="margin:0">Pilih dua suara berbeda supaya percakapan terdengar seperti dua orang. Suara berlabel en-US = aksen Amerika, en-GB = Inggris, en-AU = Australia.</p>`
    :`<p class="tip" style="margin:0">Daftar suara belum muncul. Di Android, pastikan "Google Speech Services" / Text-to-speech aktif di Pengaturan HP.</p>`}
  </section>
  <section class="card pad stack">
    <h3>Pasang di layar utama HP</h3>
    <p style="margin:0" class="tip">Chrome Android: menu titik tiga → <b>Tambahkan ke layar utama</b>. Safari iPhone: tombol Bagikan → <b>Tambah ke Layar Utama</b>. Progres tersimpan di browser HP ini.</p>
  </section>
  <section class="card pad stack">
    <h3>Reset progres</h3>
    ${state.confirmReset?`<p style="margin:0">Semua tanda selesai akan dihapus. Lanjutkan?</p><div class="row wrap"><button class="btn btn-pri" data-act="resetyes">Ya, hapus</button><button class="btn btn-ghost" data-act="resetno">Batal</button></div>`
    :`<div><button class="btn btn-ghost" data-act="reset">Hapus semua progres</button></div>`}
  </section>`;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("button,.w"); if(!el)return;
  const d=el.dataset;
  if(d.tab){state.detail=null;state.confirmReset=false;go({tab:d.tab});return}
  if(d.open){const type=d.open[0],n=+d.open.slice(1);go({detail:{type,i:n-1}});return}
  if(d.week){state.week=Math.min(WEEKS,Math.max(1,state.week+ +d.week));render();return}
  if(d.filter){const [k,l]=d.filter.split(":");state.filter[k]=+l;render();return}
  if(d.done){done.has(d.done)?done.delete(d.done):done.add(d.done);saveDone();if(done.has(d.done))state.week=currentWeek();render();return}
  if(d.rate){settings.rate=+d.rate;saveSettings();document.querySelectorAll("[data-rate]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.rate===d.rate));return}
  if(d.say){say(d.say);return}
  if(el.classList.contains("w")){const w=el.textContent.replace(/[^A-Za-z'’-]/g,"");if(w){stopSpeech();el.classList.add("hit");setTimeout(()=>el.classList.remove("hit"),700);say(w)}return}
  if(d.line!==undefined&&state.detail){playTalk(T[state.detail.i],+d.line,true);return}
  switch(d.act){
    case "back": state.detail=null; stopSpeech(); render(); window.scrollTo(0,state.scroll[state.tab]||0); break;
    case "readall": {
      if(playing){stopSpeech();break}
      const sents=state.sents; setPlayBtn(true);
      speakQueue(sents.map(t=>({text:t,voice:"va",gap:120})),k=>{
        document.querySelectorAll(".sen.reading").forEach(x=>x.classList.remove("reading"));
        const s=document.querySelector(`.sen[data-si="${k}"]`); if(s){s.classList.add("reading");s.scrollIntoView({block:"center",behavior:"smooth"})}
      },()=>{document.querySelectorAll(".sen.reading").forEach(x=>x.classList.remove("reading"));setPlayBtn(false)});
      break;}
    case "talkall": {
      if(playing){stopSpeech();break}
      playTalk(T[state.detail.i],0,false); break;}
    case "hide": state.hide=!state.hide; stopSpeech(); render(); break;
    case "trans": state.trans=!state.trans; stopSpeech(); render(); break;
    case "testvoice": speakQueue([{text:"Hi! How's it going?",voice:"va"},{text:"Pretty good, thanks. You?",voice:"vb"}]); break;
    case "reset": state.confirmReset=true; render(); break;
    case "resetno": state.confirmReset=false; render(); break;
    case "resetyes": done=new Set(); saveDone(); state.confirmReset=false; state.week=1; render(); break;
  }
});
document.addEventListener("change",e=>{const k=e.target.dataset.voice; if(k){settings[k]=e.target.value;saveSettings()}});

appReady=true;
render();
})();
</script>

</body>
</html>
