{t:"The Borrowed Jacket",lv:2,x:"On a cold evening in Bandung, I waited for a bus that never seemed to come. I was wearing only a T-shirt because the afternoon had been warm. Now I was shivering.\n\nA woman at the bus stop noticed. Without saying a word, she took off her denim jacket and handed it to me.\n\n“I can't take this,” I said.\n\n“I live five minutes away,” she replied. “You look like you're going much farther.”\n\nBefore I could argue, her bus arrived and she got on. I was left holding the jacket of a stranger whose name I didn't know.\n\nIn the pocket, I found a library card. The next weekend, I went to the library and asked if they could contact her. The librarian smiled and said she came every Saturday morning.\n\nI waited there with the jacket, freshly washed and folded, and a box of cookies. When she walked in, she recognized me immediately and laughed. “You didn't have to do this,” she said.\n\n“You didn't have to give me your jacket,” I answered.\n\nWe've been friends for six years now. Every time it gets cold, she texts me: “Bring a jacket.”",v:[["never seemed to come","sepertinya tak kunjung datang"],["shivering","menggigil"],["handed it to me","menyerahkannya padaku"],["farther","lebih jauh"],["freshly washed","baru dicuci"],["recognized","mengenali"]],q:[["How did the writer find the woman again?","Through the library card in the pocket."],["What does she text when it's cold?","Bring a jacket."]]},
{t:"The Silent Retreat",lv:2,x:"My friend convinced me to join a three-day silent retreat in the mountains. No phones, no talking, no reading. Just meditation, simple meals, and walks in the forest.\n\nThe first day was torture. I kept reaching for my phone, which was locked in a box at the front desk. My mind was so loud. I made shopping lists, replayed old arguments, and planned conversations I would never have.\n\nAt dinner, sitting in silence with thirty strangers, I noticed things I usually ignore. The sound of a spoon against a bowl. A man who ate very slowly, as if each bite was important. A woman who quietly passed the salt to me before I even asked.\n\nOn the second day, something changed. During a walk, I stopped to watch an ant carrying a leaf much bigger than itself. I watched it for maybe ten minutes. I couldn't remember the last time I had looked at anything for ten minutes without checking my phone.\n\nOn the third day, when the teacher rang the bell to end the retreat, people started talking again. It sounded so loud. The woman who passed me the salt turned out to be a lawyer from Jakarta. The slow eater was a chef.\n\nI didn't become a different person. But I still eat my breakfast in silence once a week. It's become my favorite meal.",v:[["convinced me","membujuk saya"],["retreat","retret / menyepi"],["torture","siksaan"],["replayed","memutar ulang"],["ignore","abaikan"],["turned out to be","ternyata adalah"]],q:[["What was the first day like?","Torture; the writer's mind was very loud."],["What does the writer still do once a week?","Eats breakfast in silence."]]},
{t:"Two Tickets",lv:2,x:"Andre bought two tickets to a jazz concert for his first date with Mira. He'd planned everything: dinner at a quiet Italian place, then the concert, then a walk by the river.\n\nAt dinner, he was so nervous that he knocked over a glass of water onto her lap. She laughed and said it was fine, but he could see she was cold for the rest of the meal.\n\nWhen they got to the concert hall, he reached for the tickets. His pocket was empty. He checked every pocket twice. He'd left them on his desk at home.\n\nHe wanted the ground to swallow him. “I'm so sorry,” he said. “This is the worst date in history.”\n\nMira looked at him for a moment. Then she pointed to a small street musician playing saxophone outside the hall. “He's pretty good,” she said. “And he's free.”\n\nThey sat on the steps and listened to him for an hour. Mira requested songs. Andre bought them both hot chocolate from a cart. When it started to rain lightly, they shared his jacket.\n\nFive years later, at their wedding, they hired the same street musician to play. The two unused tickets are framed on their living room wall.",v:[["knocked over","menyenggol sampai tumpah"],["lap","pangkuan"],["wanted the ground to swallow him","ingin menghilang saking malunya"],["street musician","musisi jalanan"],["requested","meminta (lagu)"],["framed","dibingkai"]],q:[["What did Andre forget?","The concert tickets."],["Who played at their wedding?","The same street musician."]]},
{t:"The Uncle Who Couldn't Read",lv:2,x:"My Uncle Darto was the funniest person at every family gathering. He told stories that made everyone cry with laughter. He could fix any motorbike, cook for fifty people, and remember every relative's birthday.\n\nWhen I was sixteen, I discovered by accident that he couldn't read.\n\nI asked him to read me a text message because my hands were dirty. He held the phone for a long time and then said, “My eyes are tired today.” Later, I noticed he always asked other people to read menus or letters for him, always with a joke or an excuse.\n\nOne night, I asked him quietly. He was silent for a while, then told me the truth. He'd left school at eight to work on the farm. He'd been hiding it his whole life because he was ashamed.\n\nI offered to teach him. He laughed and said he was too old, too busy, too stupid. I didn't give up. We started with the letters of his own name.\n\nIt took nearly two years. He practiced with newspapers, street signs, the labels on food. Some weeks he wanted to quit.\n\nAt my wedding, Uncle Darto stood up to give a speech. He took out a piece of paper and read it, slowly, every word. Only he and I knew what that meant. Halfway through, I couldn't see the paper anymore through my tears.",v:[["family gathering","acara kumpul keluarga"],["cry with laughter","tertawa sampai menangis"],["by accident","tak sengaja"],["an excuse","alasan"],["ashamed","malu"],["didn't give up","tidak menyerah"]],q:[["Why did Uncle Darto never learn to read?","He left school at eight to work on the farm."],["How long did it take him to learn?","Nearly two years."]]},
{t:"The Plant Sitter",lv:2,x:"When my neighbor went abroad for three months, she asked me to take care of her plants. “It's easy,” she said. “Just water them twice a week.”\n\nShe had forty-two plants.\n\nThe first week, I followed her instructions perfectly. The second week, a small fern looked brown at the edges. I panicked and gave it more water. By the third week, it looked worse.\n\nI started researching plants online at night. I learned that ferns like humidity, that cactuses hate too much water, and that the big plant in the corner was a fiddle-leaf fig, apparently the most dramatic plant on earth.\n\nI moved plants closer to the window, then away from it. I bought a spray bottle. I started talking to them, which felt silly at first and then didn't.\n\nBy the end of the second month, I was going over every day, not twice a week. I knew which leaves were new. The fern recovered. The fiddle-leaf fig grew three new leaves.\n\nWhen my neighbor came home, she walked around her apartment in amazement. “They look better than when I left,” she said.\n\nAs a thank-you gift, she gave me a small fern of my own. Now I have eleven plants. My apartment is starting to look like a jungle, and I'm not stopping.",v:[["abroad","ke luar negeri"],["take care of","merawat"],["edges","pinggiran"],["humidity","kelembapan"],["apparently","rupanya / katanya"],["recovered","pulih"],["in amazement","dengan takjub"]],q:[["How many plants did the neighbor have?","Forty-two."],["How many plants does the writer have now?","Eleven."]]},
{t:"The Overheard Conversation",lv:2,x:"I was sitting in a café, working on my laptop, when I overheard two women at the next table. One of them was crying quietly.\n\n“I just don't know how to tell my kids,” she said. “They'll be so disappointed.”\n\nI tried not to listen, but it was impossible. It seemed she had lost her job and couldn't afford the trip to the beach she'd promised her children for months.\n\nHer friend held her hand. “Kids don't need the beach,” she said. “They need you.”\n\nI went back to my work, but I couldn't concentrate. I kept thinking about my own childhood, when my father lost his job. I remembered that he took us camping in our backyard instead of the holiday we'd planned. We roasted corn on a small fire and slept in a tent he borrowed. It was one of my favorite memories.\n\nBefore I left, I wrote on a napkin: “My dad lost his job when I was nine. We camped in our backyard. I still think it was the best holiday of my life. Your kids will be okay.”\n\nI left it on her table as I walked out, without looking back. I'll never know if it helped. But I hope she remembers that the best moments aren't always the ones that cost the most.",v:[["overheard","tak sengaja mendengar"],["couldn't afford","tidak mampu membayar"],["concentrate","berkonsentrasi"],["backyard","halaman belakang"],["roasted","memanggang"],["napkin","tisu makan"]],q:[["Why was the woman crying?","She lost her job and couldn't afford the promised trip."],["What did the writer leave on the table?","A note on a napkin."]]},
{t:"First Time Abroad",lv:2,x:"The first time I traveled abroad alone, I was twenty-five and terrified. I'd booked a cheap flight to Bangkok for a five-day trip. My mother made me promise to call her every night.\n\nI arrived at midnight, tired and confused. The airport was huge, and every sign seemed to point in a different direction. I took the wrong exit twice before I found the train.\n\nAt the hostel, my bunk bed was above a loud Australian man who snored like a motorbike. I lay awake thinking I'd made a terrible mistake.\n\nThe next morning, he apologized for the snoring and invited me to explore the city with his group. There were five of us from five different countries. We got lost in a market, ate food we couldn't name, and took a boat down the river without knowing where it was going.\n\nOne night, we sat on a rooftop and talked until three in the morning about our families, our jobs, and what we wanted from life. I realized I was speaking English for hours without thinking about grammar. It just came out.\n\nWhen I called my mother that night, she asked if I was eating well and if I was safe. I said yes. Then she asked, “Are you happy?” I was surprised to find that the answer was also yes.",v:[["terrified","sangat takut"],["booked","memesan (tiket)"],["exit","pintu keluar"],["bunk bed","ranjang susun"],["snored","mendengkur"],["rooftop","atap gedung"],["it just came out","keluar begitu saja"]],q:[["Where did the writer go?","Bangkok."],["What did the writer realize on the rooftop?","He/she was speaking English for hours without thinking about grammar."]]},
{t:"The Last Day of School",lv:2,x:"On the last day of high school, our class did something we had planned for months. We arrived early and decorated the classroom of our homeroom teacher, Bu Wati, who was retiring that year.\n\nWe covered the walls with photos from the past three years: field trips, sports days, the time she fell asleep during a long exam and we all pretended not to notice. Each student wrote a letter and put it in a big box decorated with flowers.\n\nWhen Bu Wati walked in, she stopped at the door. For a moment she said nothing. Then she slowly walked around the room, looking at every photo.\n\nShe was known for being strict. In three years, we had never seen her cry. That morning, she cried for ten minutes straight, and so did most of us.\n\nFinally she sat at her desk and said, “I have one last lesson for you.” We groaned, thinking she was joking.\n\nShe wasn't. “Don't be in a hurry to grow up,” she said. “And call your mother more than you think you need to.”\n\nThen she dismissed the class for the last time.\n\nTen years later, I still call my mother every Sunday. Every time, I think of Bu Wati.",v:[["homeroom teacher","wali kelas"],["retiring","pensiun"],["field trips","karyawisata"],["pretended not to notice","pura-pura tidak lihat"],["straight","berturut-turut / tanpa henti"],["groaned","mengerang / mengeluh"],["dismissed the class","membubarkan kelas"]],q:[["What did the students put in the box?","Letters."],["What was her last lesson?","Don't hurry to grow up, and call your mother more."]]},
{t:"The Flat Tire",lv:2,x:"I was driving to a client meeting on a toll road when I heard a loud bang. The car started shaking. I pulled over to the side, my heart racing.\n\nThe back tire was completely flat. I had a spare tire, but I had never changed one in my life. I watched a video on my phone, but the first step was “loosen the nuts,” and the nuts wouldn't move no matter how hard I pushed.\n\nCars rushed past. I was sweating in my nice shirt. The meeting started in forty minutes.\n\nThen a small truck stopped behind me. Two men got out. They didn't say much, just pointed at the tire and nodded at me. In ten minutes, they had changed it. One of them showed me how to stand on the wrench to loosen the nuts. “Use your weight, not your arms,” he said.\n\nI tried to give them money. They refused. “Just drive safe,” they said, and they were gone.\n\nI arrived at my meeting with dirty hands and grease on my shirt. I apologized and explained what had happened. The client laughed and said, “That's the most honest excuse I've heard all year.”\n\nWe signed the contract that day. I like to think those two strangers helped with that too.",v:[["toll road","jalan tol"],["pulled over","menepi"],["heart racing","jantung berdebar"],["spare tire","ban cadangan"],["loosen the nuts","mengendurkan baut roda"],["wrench","kunci roda"],["grease","oli / gemuk"]],q:[["What advice did the man give?","Use your weight, not your arms."],["What happened at the meeting?","They signed the contract."]]},
{t:"The Midnight Snack",lv:2,x:"When I was a university student, I lived in a boarding house with eight other students. We shared one kitchen and one fridge, and food often disappeared.\n\nI started labeling my food with my name. Then I wrote warnings: “DO NOT TOUCH.” Still, every few days, something was missing. A yogurt. Half a cake. Once, an entire box of fried chicken.\n\nI decided to catch the thief. One night, I hid in the dark kitchen with a flashlight. At around two in the morning, the door opened slowly. Someone walked to the fridge and opened it. I turned on the flashlight.\n\nIt was Pak Joko, the old security guard of the building, holding my chocolate pudding. He froze like a deer in headlights.\n\nI expected to be angry, but then I saw his face. He looked so embarrassed and so tired. He told me that his salary was late and he'd been working double shifts without dinner.\n\nWe ended up sitting at the kitchen table, sharing the pudding. After that night, I left a plate of food for him every evening with a note that said, “For Pak Joko.” Some of the other students started doing the same.\n\nWhen I graduated, he came to my farewell party. He brought me a chocolate pudding.",v:[["boarding house","kos-kosan"],["labeling","memberi label"],["the thief","pencurinya"],["froze","membeku / terdiam"],["like a deer in headlights","kaget dan terpaku"],["double shifts","dua shift"],["farewell party","pesta perpisahan"]],q:[["Who was taking the food?","Pak Joko, the security guard."],["What did he bring to the farewell party?","A chocolate pudding."]]},
{t:"Starting Over at Forty",lv:2,x:"When Ratna turned forty, she enrolled in a nursing program. Her children were teenagers, and she had worked in a bank for almost twenty years.\n\nHer friends thought she was crazy. “Why would you start from zero now?” they asked. Her husband supported her, but even he looked worried when she showed him the schedule.\n\nThe first semester was harder than she expected. Most of her classmates were nineteen. They used apps she had never heard of and memorized information much faster than she did. In her first anatomy exam, she got fifty-two out of a hundred. She cried in the car before driving home.\n\nBut she had something the younger students didn't: she knew how to manage her time, and she wasn't afraid to ask questions. She started a study group in her kitchen on Sundays. Soon, half her class was coming, bringing snacks and their textbooks.\n\nThe young students taught her shortcuts on her phone. She taught them how to talk to patients and stay calm under pressure.\n\nFour years later, she graduated near the top of her class. Now she works in the emergency room of a city hospital.\n\nWhen younger nurses ask her if it was worth it, she always says the same thing: “I was going to turn forty-four anyway. I just decided what I wanted to be when I got there.”",v:[["enrolled","mendaftar"],["start from zero","mulai dari nol"],["anatomy","anatomi"],["manage her time","mengatur waktunya"],["shortcuts","jalan pintas / cara cepat"],["under pressure","di bawah tekanan"],["emergency room","IGD"]],q:[["What job did Ratna have before?","She worked in a bank."],["What did she teach the younger students?","How to talk to patients and stay calm."]]},
{t:"The Stray Dog",lv:2,x:"Every morning on my way to work, a thin brown dog sat outside the same warung. He didn't bark or beg. He just watched people walk past with sad, patient eyes.\n\nOne day, I gave him half of my sandwich. The next morning, he was waiting for me. The day after that, he walked with me to the corner of the street, then turned back.\n\nThis went on for weeks. I named him Kopi, because he was the color of coffee with milk. The woman who ran the warung told me he'd been there for a year, ever since a family moved away and left him behind.\n\nI lived in a small apartment that didn't allow pets. I told myself I couldn't take him. I bought dog food and kept it in my bag.\n\nThen one rainy morning, Kopi wasn't there. Or the next day. I asked the warung owner, and she said she hadn't seen him. I couldn't sleep that week.\n\nOn Sunday, I found him at an animal clinic down the road. A car had hit his leg, and someone had brought him in. He wagged his tail when he saw me.\n\nI paid for the surgery. Then I talked to my landlord, who, after a long conversation and a promise of extra cleaning, said yes.\n\nKopi now sleeps at the foot of my bed. He still walks me to the corner every morning.",v:[["stray dog","anjing liar"],["beg","mengemis / minta-minta"],["left him behind","meninggalkannya"],["didn't allow pets","tidak boleh bawa hewan"],["wagged his tail","mengibaskan ekornya"],["landlord","pemilik kos/rumah"]],q:[["Why is the dog named Kopi?","He was the color of coffee with milk."],["Where did the writer find Kopi?","At an animal clinic."]]},
{t:"Mistaken Identity",lv:2,x:"At a large conference in Singapore, a man walked up to me with a huge smile. “Budi! It's been so long!” He hugged me and slapped my back. “How's the family? How's your mother's knee?”\n\nMy name is not Budi. But he was so happy, and the hug was so warm, that I panicked and said, “She's... much better, thanks.”\n\nThat was my first mistake.\n\nHe invited me to join him and his colleagues for lunch. I said yes. That was my second mistake.\n\nFor an hour, I pretended to be Budi. I laughed at stories about a trip to Bali that I'd never taken. I agreed that “Pak Harjo” was a difficult boss. Someone asked if I was still playing badminton, and I said, “Not as much as I'd like.”\n\nThen a man walked into the restaurant, and everyone at the table went silent. He looked exactly like me, but with a mustache.\n\n“Budi?” my new friend said slowly, looking from him to me.\n\nThe real Budi stared at me. I stared at him. And then, for some reason, we both started laughing.\n\nIt turned out we were from the same city and worked in the same industry. We exchanged business cards. Last year, he hired my company for a big project. And yes, his mother's knee is much better.",v:[["it's been so long","sudah lama sekali"],["slapped my back","menepuk punggungku"],["colleagues","rekan kerja"],["pretended","berpura-pura"],["mustache","kumis"],["exchanged business cards","bertukar kartu nama"]],q:[["Who did the man think the writer was?","Budi."],["What happened between the writer and the real Budi?","They became business contacts; Budi hired his company."]]},
{t:"Silence at Dinner",lv:2,x:"My family used to eat dinner in front of the TV, everyone on their phones. Nobody talked much. My father scrolled through the news. My brother played games. My mother watched her soap opera. I texted my friends.\n\nOne evening, my little sister, who was seven, put a basket on the table. “Phones go here during dinner,” she announced. Her teacher had talked about it at school.\n\nWe laughed, but she was serious. She stood next to the basket with her arms crossed until everyone put their phones in.\n\nThe first few minutes were awkward. We didn't know what to talk about. Then my father asked my brother about a girl he'd seen him with at the market. My brother turned red. My mother started teasing him. Soon we were all laughing.\n\nMy father told a story about his first job as a teenager, when he accidentally sold a customer's bicycle. I'd never heard it before. I realized there were probably hundreds of stories I'd never heard.\n\nThe phone basket became a rule. Some nights we argue, some nights we're quiet, but most nights we talk.\n\nMy sister is fifteen now. Last week, she tried to bring her phone to the table. My father pointed at the basket without saying a word.",v:[["scrolled through","menggulir"],["soap opera","sinetron"],["announced","mengumumkan"],["arms crossed","tangan bersilang"],["awkward","canggung"],["teasing","menggoda / meledek"],["accidentally","tidak sengaja"]],q:[["Whose idea was the basket?","The seven-year-old sister's."],["What happened last week?","The sister tried to bring her phone, and the father pointed at the basket."]]},
{t:"The Language Exchange",lv:2,x:"I wanted to improve my English speaking, so I joined a language exchange app. I matched with a man named Oliver from Manchester who was learning Indonesian.\n\nOur first video call was a disaster. My internet kept freezing. He spoke so fast that I understood maybe half of what he said. When I tried to answer, I forgot simple words like “yesterday.” He tried to say “Saya senang bertemu kamu” and accidentally said something about a goat.\n\nWe both laughed so hard that the awkwardness disappeared.\n\nWe agreed to meet every Wednesday for an hour: thirty minutes in English, thirty in Indonesian. He taught me slang, like saying “I'm knackered” when I'm tired, and that “cheers” can mean thank you. I taught him the difference between “nanti” and “nanti-nanti,” which he still finds confusing.\n\nMonths went by. My listening got better. I stopped translating everything in my head. He learned enough to order food on his trip to Yogyakarta, although the seller answered him in English.\n\nAfter two years, Oliver came to Jakarta for work. We finally met in person at a coffee shop. It was strange to see him without a screen in between.\n\nWe talked for four hours, switching between languages without noticing. By the end, I couldn't remember which language we'd started in.",v:[["matched with","dicocokkan dengan"],["kept freezing","terus macet / nge-freeze"],["disappeared","hilang"],["slang","bahasa gaul"],["knackered","capek banget (UK)"],["in person","secara langsung"],["switching","berganti-ganti"]],q:[["How did they split their hour?","Thirty minutes English, thirty minutes Indonesian."],["What does 'cheers' mean in British English?","It can mean thank you."]]},
{t:"The Overnight Hike",lv:2,x:"Five of us decided to hike Mount Prau to see the sunrise. We started climbing at one in the morning with headlamps, warm jackets, and too many snacks.\n\nThe trail was steep and muddy. After an hour, my legs were burning. My friend Galih, who had promised it was “an easy mountain,” was suspiciously quiet.\n\nAt three, it started to rain. Not heavily, but enough to make everything cold and slippery. Someone suggested going back. We sat under a tree, eating chocolate and arguing about it. In the end, we decided to continue. Turning back felt worse than being wet.\n\nWe reached the top at four-thirty, shivering and covered in mud. It was completely dark and cloudy. We couldn't see anything. Galih apologized for the fifth time.\n\nWe sat close together to stay warm and waited. At five-fifteen, the clouds started to move. Slowly, the sky turned orange, and then, all at once, the clouds opened and we could see the mountains around us, floating above a sea of white.\n\nNobody said anything for a long time. Even Galih was quiet, but this time for a different reason.\n\nOn the way down, my legs were shaking, and I fell twice. But when people ask if it was worth it, I don't even have to think.",v:[["headlamps","senter kepala"],["trail","jalur"],["steep","curam"],["suspiciously quiet","diam mencurigakan"],["slippery","licin"],["all at once","tiba-tiba sekaligus"],["worth it","sepadan"]],q:[["Why didn't they go back?","Turning back felt worse than being wet."],["What did they see at sunrise?","Mountains above a sea of clouds."]]},
{t:"The Lost Wallet",lv:2,x:"On a busy Friday, a young delivery driver named Eko found a wallet on the road. Inside were three million rupiah in cash, several credit cards, and an ID card.\n\nEko was struggling that month. His motorbike needed repairs, and his rent was due. For a moment, he thought about how much that money could help him.\n\nThen he looked at the ID card. The owner was an old man with kind eyes. The address was not far away.\n\nEko finished his deliveries and rode to the address. A woman opened the door and told him the old man was her father, who had been searching for the wallet all day. He was so worried that he hadn't eaten lunch.\n\nThe old man came to the door, slowly, using a cane. When he saw the wallet, he held Eko's hand for a long time without speaking.\n\nHe tried to give Eko half the money. Eko said no. The man insisted. Eko still said no.\n\nTwo weeks later, Eko received a call from a delivery company. They offered him a full-time position with a salary and insurance. It turned out the old man's son-in-law was the manager.\n\nEko accepted, but he says that wasn't why he returned the wallet. “I just thought about my own grandfather,” he says.",v:[["struggling","kesulitan"],["rent was due","waktunya bayar sewa"],["searching for","mencari"],["cane","tongkat"],["insisted","bersikeras"],["full-time position","posisi tetap / penuh waktu"],["son-in-law","menantu laki-laki"]],q:[["What did Eko do with the wallet?","He returned it to the owner's address."],["Why did Eko return the wallet?","He thought about his own grandfather."]]},
{t:"The Night Market",lv:2,x:"Every Saturday night, an empty parking lot near my house turns into a night market. By six o'clock, the space is filled with small stalls, string lights, and the smell of grilled meat.\n\nI go there almost every week. I have my routine. First, I buy satay from an old man who has been grilling at the same corner for thirty years. He never asks for my order anymore. He just says, “Ten, extra peanut sauce?”\n\nThen I walk past the clothes stalls, the phone accessory sellers, and a man who sells goldfish in plastic bags. There's a young couple who make martabak, and their argument about how much chocolate to add is part of the show.\n\nMy favorite stall belongs to a woman who sells used books for five thousand rupiah each. Her collection is random: cookbooks, old novels, school textbooks from the 1990s. Once, I found a book with a love letter inside, written in 1987. I still have it.\n\nThe market closes at midnight. The lights go off one by one, and the sellers pack everything into motorbikes and small trucks. By the morning, it's a parking lot again, as if nothing happened.\n\nI like that. Something wonderful that appears every week and disappears without a trace.",v:[["stalls","lapak / kios"],["string lights","lampu hias"],["routine","rutinitas"],["part of the show","bagian dari hiburan"],["random","acak"],["without a trace","tanpa jejak"]],q:[["What does the satay seller always say?","Ten, extra peanut sauce?"],["What did the writer find in a book?","A love letter from 1987."]]},
{t:"The Wrong Address",lv:2,x:"I ordered a birthday cake for my best friend and asked the bakery to deliver it to her office as a surprise. I typed the address quickly while on the train.\n\nAt three o'clock, she still hadn't said anything. At four, I called the bakery. They said the cake had been delivered at noon and someone had signed for it.\n\nI checked the address. I had typed the wrong building number. The cake had gone to the office next door.\n\nEmbarrassed, I called the building and asked if anyone had received a cake. A woman laughed on the phone. “Oh, that was your cake?” she said. “We thought it was a gift from our boss. It said ‘Happy Birthday, Sinta!’ and we have a Sinta here too. It was actually her birthday!”\n\nI couldn't believe it. There was another Sinta, in the building next door, with a birthday on the same day.\n\nThe woman offered to pay for the cake, but I said no. “Tell Sinta happy birthday from a stranger,” I said.\n\nI ordered another cake for my friend and delivered it myself that evening. When I told her the story, she said that was even better than getting the cake on time.\n\nA week later, a card arrived at my office. It was from the other Sinta: “Best birthday surprise ever. Thank you, stranger.”",v:[["deliver","mengantar"],["signed for it","menandatangani penerimaan"],["building number","nomor gedung"],["embarrassed","malu"],["on time","tepat waktu"],["a card","kartu ucapan"]],q:[["Why did the cake go to the wrong place?","The writer typed the wrong building number."],["What was surprising about the office next door?","There was also a Sinta whose birthday was that day."]]},
{t:"Rain on the Roof",lv:2,x:"My grandmother's house had a tin roof. When it rained, the sound was so loud that you had to shout to be heard. As a child, I hated it at first. It scared me, especially at night.\n\nMy grandmother taught me a game. When the rain started, we would lie on the mat in the living room and guess what the rain was saying. Light rain was “whispering secrets.” Heavy rain was “an orchestra.” When it rained so hard that the whole house shook, she said it was “the sky moving furniture.”\n\nShe made sweet ginger tea and told me stories while the rain played above us. She talked about her childhood, about the war, about how she met my grandfather at a wedding and stepped on his foot while dancing.\n\nWhen I grew up and moved to the city, I lived in an apartment on the fifth floor. When it rained, I could barely hear it. Something always felt missing.\n\nMy grandmother passed away three years ago. The family sold the house. Before it was sold, I went there alone one last time, during the rainy season.\n\nI lay on the floor of the empty living room and listened. It was an orchestra that day. I stayed until it stopped.",v:[["tin roof","atap seng"],["to be heard","agar terdengar"],["mat","tikar"],["orchestra","orkestra"],["ginger tea","teh jahe"],["something always felt missing","selalu terasa ada yang kurang"]],q:[["What did the grandmother call heavy rain?","An orchestra."],["How did the grandmother meet the grandfather?","At a wedding; she stepped on his foot while dancing."]]},
{t:"The Driving Test",lv:2,x:"I failed my driving test three times.\n\nThe first time, I was so nervous that I forgot to release the handbrake. The car made a horrible noise and the examiner wrote something on his clipboard without looking up.\n\nThe second time, I did everything perfectly until the last part, parallel parking. I hit the cone. Not gently. It flew across the parking lot.\n\nThe third time, I passed every part of the test but drove through a yellow light on the way back. The examiner said, “That was orange, and you know it.” I did know it.\n\nAfter the third failure, I almost gave up. My friends already had their licenses and offered to drive me everywhere. It was easier to just say yes.\n\nMy father didn't let me quit. Every Sunday morning, he took me to an empty market parking lot and made me practice parking for an hour. He brought plastic chairs to use as cones. He never raised his voice, even when I almost hit a wall.\n\nThe fourth time, I got the same examiner as the first time. He recognized me and sighed. But I drove carefully, parked perfectly, and stopped at every yellow light.\n\nAt the end, he handed me the paper and said, “Fourth time's the charm.” I drove home slowly, with my father in the passenger seat, smiling the whole way.",v:[["release the handbrake","melepas rem tangan"],["examiner","penguji"],["parallel parking","parkir paralel"],["cone","kerucut lalu lintas"],["raised his voice","meninggikan suara"],["sighed","menghela napas"],["Fourth time's the charm","yang keempat baru berhasil"]],q:[["What happened in the second test?","The writer hit the cone while parallel parking."],["What did the father use as cones?","Plastic chairs."]]}
);

{t:"The Translator",lv:3,x:"For eleven years, Nadia worked as an interpreter at international business meetings. Her job was to disappear. A good interpreter, her mentor once told her, is like clean glass: people should look through you, not at you.\n\nShe was very good at disappearing. She could translate a two-hour negotiation without missing a word, adjusting tone, softening insults, and making sure jokes landed in both languages. Clients rarely remembered her name.\n\nOne afternoon, during a tense meeting between a Japanese company and an Indonesian manufacturer, she noticed something. The Indonesian director kept saying “yes, we can do that” to every request. Nadia knew, from his pauses and the way he looked at his team, that he actually meant “this will be extremely difficult.” The Japanese side was taking every yes literally.\n\nTechnically, her job was to translate the words, not the meaning behind them. But she could see the deal heading toward disaster.\n\nDuring a coffee break, she quietly approached both teams separately and explained the cultural gap: that in many Indonesian workplaces, saying no directly to a guest can feel rude, while in Japan, a promise is taken very seriously.\n\nThe second half of the meeting was slower, more honest, and much more uncomfortable. But they reached a realistic agreement.\n\nA month later, the Japanese CEO sent a letter to her agency. It was the first time in eleven years that a client had asked for her by name.",v:[["interpreter","juru bahasa lisan"],["negotiation","negosiasi"],["softening insults","memperhalus hinaan"],["tense","tegang"],["literally","secara harfiah"],["cultural gap","kesenjangan budaya"],["realistic agreement","kesepakatan yang realistis"]],q:[["What did 'yes, we can do that' really mean?","That it would be extremely difficult."],["Why was the letter special?","It was the first time a client asked for her by name."]]},
{t:"The Inheritance",lv:3,x:"When their father died, the three siblings gathered in his small house in Solo to divide his belongings. Everyone expected a fight. They hadn't been in the same room together for six years, not since a bitter argument over money that nobody could quite remember the details of anymore.\n\nThere wasn't much to divide. A motorbike, a radio, some furniture, a modest savings account. The real value was in the house itself, which all three of them secretly hoped to keep.\n\nOn the second evening, the youngest, Bima, found a stack of notebooks in the bottom of a wardrobe. Their father had kept a diary for forty years. Short entries, mostly. The weather. The price of rice. What he'd eaten for dinner.\n\nBut scattered through the pages were other things. “Dina called today. She sounded tired. I should have asked more.” “Bima got the job. I didn't tell him I'm proud. Why is it so hard to say?” “The three of them are not speaking. It is my fault. I took sides when I shouldn't have.”\n\nThey read late into the night, passing the notebooks around the table. Nobody said much. At some point, the oldest, Dina, started crying, and then they all were.\n\nThey never sold the house. Now they take turns staying there during holidays, and every Eid, they all go together. The notebooks are kept on a shelf in the living room. Sometimes, one of them adds an entry.",v:[["siblings","saudara kandung"],["belongings","barang-barang milik"],["bitter argument","pertengkaran pahit"],["modest","sederhana / tidak besar"],["wardrobe","lemari pakaian"],["scattered through","tersebar di"],["took sides","memihak"],["take turns","bergantian"]],q:[["What did Bima find?","Their father's diaries."],["What did the father regret?","Taking sides in his children's argument."]]},
{t:"Burnout",lv:3,x:"For three years, Aditya was the rising star of a fast-growing tech startup. He answered emails at midnight, worked through weekends, and was praised in every meeting for his dedication. He took pride in being the person who never said no.\n\nThe first signs were small. He started forgetting names. He'd read the same paragraph four times without understanding it. Food stopped tasting like anything. He told himself it was a busy period and things would calm down next month. They never did.\n\nOne Tuesday morning, he sat in his car in the office parking lot and couldn't get out. He wasn't sick. Nothing was physically wrong. His body simply refused to walk into the building. He sat there for two hours, staring at the steering wheel.\n\nHe eventually called his sister, who drove over and took him home. The next week, he saw a doctor, who used a word he'd always thought was an exaggeration: burnout.\n\nRecovery wasn't dramatic. It was boring, slow, and frustrating. He took two months off. He slept. He walked every morning. He learned, uncomfortably, that his value as a person wasn't the same as his productivity.\n\nWhen he returned to work, he set boundaries he'd once considered lazy. He stopped answering emails after seven. He said no to projects. To his surprise, the company didn't collapse. His manager later admitted she'd been worried about him for months but hadn't known how to say it.\n\n“The scary thing,” Aditya says now, “is how normal it all felt until the moment it didn't.”",v:[["rising star","bintang yang sedang naik daun"],["dedication","dedikasi"],["took pride in","bangga akan"],["steering wheel","setir"],["exaggeration","berlebihan"],["boundaries","batasan"],["collapse","runtuh"]],q:[["What happened in the parking lot?","He couldn't get out of the car for two hours."],["What boundary did he set?","He stopped answering emails after seven."]]},
{t:"The Fisherman's Son",lv:3,x:"Pak Salim had been a fisherman for forty years, like his father and grandfather before him. Every night, he took his small wooden boat out past the reef, and every morning he sold his catch at the village market.\n\nHis son, Fikri, was the first in the family to go to university. He studied marine biology in Makassar, and his father told everyone in the village, though he didn't really understand what it meant.\n\nWhen Fikri came home after graduating, he brought bad news. The data was clear: the fish near their village were disappearing. Overfishing, warmer water, and damaged coral meant that in ten years, there might be almost nothing left.\n\nPak Salim didn't want to hear it. “The sea has always provided,” he said. “You've been reading too many books.”\n\nThey argued for weeks. Fikri felt like a traitor. His father felt like his son was telling him his whole life had been a mistake.\n\nThings changed when Fikri asked his father to take him out on the boat and show him the old fishing spots. One by one, Pak Salim pointed at places where, as a young man, he'd caught so many fish that his boat nearly sank. Now the nets came up almost empty.\n\nOn the way home, Pak Salim was quiet for a long time. Then he said, “What do we need to do?”\n\nToday, the village has a protected zone where nobody fishes, and the coral is slowly returning. Pak Salim is the one who guards it most fiercely.",v:[["reef","terumbu"],["catch","hasil tangkapan"],["marine biology","biologi kelautan"],["overfishing","penangkapan ikan berlebih"],["provided","mencukupi / memberi"],["traitor","pengkhianat"],["protected zone","zona perlindungan"],["fiercely","dengan gigih"]],q:[["What changed the father's mind?","Seeing his old fishing spots almost empty."],["What does the village have now?","A protected zone where nobody fishes."]]},
{t:"The Scholarship Letter",lv:3,x:"Intan checked her email forty times a day for three weeks. She'd applied for a full scholarship to study public health in the Netherlands. It was the only way she could afford it. Her parents sold vegetables at a traditional market and had quietly borrowed money to pay for her English test.\n\nThe email finally arrived on a Thursday afternoon while she was helping at the market stall. She saw the subject line, “Scholarship Decision,” and couldn't make herself open it. She handed the phone to her mother, who couldn't read English.\n\n“Just tell me if there are a lot of words or only a few,” Intan said. Long emails, she'd heard, meant yes. Rejections were short.\n\nHer mother looked at the screen for a long time. “Only a few,” she said.\n\nIntan's heart sank. She took the phone back, and her eyes filled with tears before she could read a single line. When she finally did, she read it three times to make sure she understood.\n\nIt was short because it simply said congratulations, with a link to the full documents.\n\nShe screamed so loudly that the fish seller next door dropped a tray of mackerel. Her mother, not understanding, started crying anyway. Within ten minutes, half the market had gathered around their stall.\n\nTwo years later, Intan wrote her master's thesis on access to healthcare for informal market workers. She dedicated it to the people of that market.",v:[["full scholarship","beasiswa penuh"],["afford","mampu membayar"],["subject line","judul email"],["rejections","penolakan"],["her heart sank","hatinya mencelos"],["mackerel","ikan kembung"],["dedicated it to","mempersembahkannya untuk"]],q:[["Why did Intan's heart sink?","Her mother said the email had only a few words."],["What was her thesis about?","Access to healthcare for informal market workers."]]},
{t:"The Night Before the Exam",lv:3,x:"It was one in the morning, and Yusuf had been staring at the same page of his pharmacology textbook for forty minutes. The final exam was at eight. If he failed, he would have to repeat the entire year, and his parents had already sold a piece of land to pay for this one.\n\nHe was paralyzed. Every time he tried to read, his mind drifted to worst-case scenarios: the look on his father's face, the conversation with his professors, the cousins who would hear about it.\n\nHis roommate, Teguh, a quiet engineering student he barely knew, came out of his room for water. He looked at Yusuf, then at the open book, then back at Yusuf.\n\n“You've been on that page since I went to bed,” Teguh said.\n\nYusuf didn't argue. Teguh sat down, pulled the book toward himself, and said, “Explain this page to me like I'm stupid. I know nothing about medicine.”\n\nIt seemed ridiculous, but Yusuf tried. As he explained, he discovered he understood much more than he thought. When Teguh asked basic questions, Yusuf found himself answering with confidence. They went through chapter after chapter. Teguh made terrible jokes about drug names. At four, they ate instant noodles.\n\nYusuf slept for two hours and walked into the exam surprisingly calm. He passed with a B.\n\nHe later asked Teguh why he'd stayed up all night helping someone he barely knew. Teguh shrugged. “You looked like I did last semester,” he said. “Nobody helped me.”",v:[["pharmacology","farmakologi"],["repeat the entire year","mengulang setahun penuh"],["paralyzed","lumpuh / tak berdaya"],["drifted","melayang"],["worst-case scenarios","skenario terburuk"],["ridiculous","konyol"],["with confidence","dengan percaya diri"]],q:[["What method did Teguh use?","He asked Yusuf to explain the page as if Teguh knew nothing."],["Why did Teguh help?","Yusuf looked like Teguh did last semester, and nobody helped him."]]},
{t:"Small Talk",lv:3,x:"When Lia moved to London for work, she was confident about her English. She had scored highly on every test, read novels in English, and watched countless British TV shows. What she wasn't prepared for was small talk.\n\nOn her first morning, a colleague asked, “You alright?” Lia, thinking he'd noticed something wrong, began explaining that she was a little tired from the flight and still adjusting to the time difference. He looked mildly alarmed. She later learned that “You alright?” simply means hello, and the correct answer is “Yeah, you?”\n\nThe weather was another mystery. People discussed it constantly, often in great detail, as though it were breaking news. “Bit grim out there, isn't it?” someone would say about a perfectly normal gray day. She didn't understand that the weather wasn't really the topic. It was a way of saying, “I see you, and I'm being friendly.”\n\nThen there was the British habit of saying the opposite of what they meant. “Not bad” meant good. “Quite good” sometimes meant disappointing. “I'll bear it in mind” usually meant no.\n\nLia started keeping a notebook of phrases and their real meanings. Her colleagues found it hilarious and began contributing entries.\n\nBy her second year, she had mastered it. When a new colleague from Brazil arrived and answered “You alright?” with a ten-minute summary of his week, Lia smiled, and quietly handed him a copy of her notebook.",v:[["small talk","basa-basi"],["countless","tak terhitung"],["adjusting to","menyesuaikan diri dengan"],["mildly alarmed","agak kaget"],["Bit grim","agak suram"],["I'll bear it in mind","akan saya pertimbangkan (sering = tidak)"],["hilarious","lucu sekali"],["contributing","menyumbang"]],q:[["What does 'You alright?' usually mean in the UK?","Hello."],["What does 'I'll bear it in mind' often mean?","No."]]},
{t:"The Apology",lv:3,x:"Twenty years ago, in middle school, Reza had been cruel to a boy named Hamid. It wasn't physical. It was worse in some ways: constant jokes about his old shoes, his accent, the way he ate lunch alone. Reza had a group of friends who laughed at everything he said, and Hamid was an easy target.\n\nReza hadn't thought about it for years. Then his own son came home from school one day, quiet and red-eyed, and eventually admitted that a group of boys had been mocking his glasses. As Reza listened, a cold feeling spread through his chest. He recognized every detail. Only this time, he was on the other side.\n\nThat night he couldn't sleep. He searched for Hamid online and, after an hour, found him. He was a dentist in Surabaya, married, with two daughters. He looked happy.\n\nReza wrote a message and deleted it six times. Every version sounded either too dramatic or too casual. Finally, he wrote simply: “You probably don't remember me, or maybe you do. I was terrible to you in middle school. I have no excuse. I'm sorry.”\n\nHamid replied two days later. “I remember,” he wrote. “For a long time I hated you. I'm not sure what I feel now. But thank you for saying it. Most people never do.”\n\nThere was no dramatic reconciliation. They never became friends. But Reza went to his son's school the following week and talked to the teacher, and then to the other boys' parents. He told them his own story. It was the hardest conversation of his life.",v:[["cruel","kejam"],["easy target","sasaran empuk"],["mocking","mengejek"],["on the other side","di posisi sebaliknya"],["no excuse","tanpa pembelaan"],["reconciliation","rekonsiliasi / berdamai"]],q:[["What made Reza remember Hamid?","His own son was being bullied."],["How did Hamid respond?","He said he remembered and thanked Reza for saying sorry."]]},
{t:"The Old Bicycle Repairman",lv:3,x:"On the corner of a busy road in Yogyakarta, under a large mango tree, Mbah Karto has repaired bicycles for over fifty years. His workshop is nothing more than a wooden table, a box of tools, a pump, and a bucket of water for finding holes in inner tubes.\n\nWhen motorbikes took over the roads in the 1990s, everyone told him to switch. Learn engines, they said. Bicycles are finished. He refused. He said he liked the silence of bicycles, and that he was too old to start loving something noisy.\n\nFor years, his customers dwindled. Some days, nobody came at all. He sat under the mango tree, drinking tea, watching the traffic.\n\nThen, around 2015, something unexpected happened. Cycling became fashionable. Young professionals in expensive helmets started appearing. Old bicycles from the 1970s became collector's items. Suddenly, there were people searching for someone who knew how to repair a vintage Dutch bicycle with original parts.\n\nThere was almost no one left who did, except Mbah Karto.\n\nNow there's often a line of riders waiting under the mango tree. A university student made a video about him that was watched millions of times. Tourists come to take photos.\n\nHe charges the same prices he always has, which are absurdly low. When people tell him to raise them, he laughs. “I didn't wait thirty years to become rich,” he says. “I waited because I like bicycles.”",v:[["workshop","bengkel"],["inner tubes","ban dalam"],["took over","menguasai"],["switch","beralih"],["dwindled","semakin berkurang"],["fashionable","sedang tren"],["collector's items","barang koleksi"],["absurdly low","rendah sekali (tidak masuk akal)"]],q:[["Why did he refuse to learn engines?","He liked the silence of bicycles."],["Why doesn't he raise his prices?","He didn't wait to become rich; he likes bicycles."]]},
{t:"The Remote Worker",lv:3,x:"When the pandemic forced everyone home, Clara discovered she loved working remotely. No commute, no noisy open office, no small talk at the coffee machine. She was more productive than ever, and her company was impressed.\n\nSo when the office reopened, she asked to stay fully remote. Her manager agreed. She moved from Jakarta to a small town in the mountains, rented a house with a view of rice terraces, and worked from a desk by the window.\n\nFor the first year, it was perfect. She hiked on weekends, learned to cook, and saved a lot of money.\n\nBut slowly, something shifted. She noticed she could go three or four days without speaking to anyone face to face. Her video calls were efficient but empty. When colleagues got promoted, it was usually the ones who were in the office, building relationships over lunch. She heard about important decisions after they'd already been made.\n\nOne evening, she realized she'd talked more to the delivery driver that week than to any other human being. That scared her.\n\nShe didn't move back to the city. Instead, she started making deliberate changes. She joined a local volunteer group teaching English to children. She traveled to Jakarta once a month to spend a few days in the office, scheduling lunches with colleagues. She learned the names of her neighbors.\n\n“Remote work gave me freedom,” she says. “But I had to learn that freedom from people isn't the same as freedom.”",v:[["commute","perjalanan pulang-pergi kerja"],["productive","produktif"],["rice terraces","sawah terasering"],["shifted","bergeser / berubah"],["face to face","tatap muka"],["efficient but empty","efisien tapi hampa"],["deliberate","disengaja / terencana"]],q:[["What scared Clara?","She talked more to the delivery driver than anyone else that week."],["What changes did she make?","Volunteering, monthly office visits, getting to know neighbors."]]},
{t:"Second Chances",lv:3,x:"Danu spent four years in prison for a robbery he committed at twenty-two. When he was released, he had a single bag of clothes, a certificate in carpentry from a prison training program, and a criminal record that closed nearly every door.\n\nHe applied for thirty-seven jobs in three months. Most companies never replied. A few interviews ended abruptly the moment the background check came up. One manager told him, quite politely, that customers “wouldn't feel comfortable.”\n\nHe started to understand why so many people he'd met inside ended up going back. When honest work seems impossible, the old life starts to look like the only option.\n\nThe thirty-eighth application was to a small furniture workshop owned by a woman named Bu Sekar. She read his CV, looked up, and asked directly: “What did you do?”\n\nHe told her everything. He didn't make excuses.\n\nShe was silent for a moment. Then she gave him a piece of wood and said, “Make me a drawer. Come back tomorrow.”\n\nHe stayed up all night. The drawer was not perfect, but it was solid and carefully made.\n\nShe hired him on a three-month trial. He was never late. He stayed after hours to learn from the older carpenters. Within two years, he was leading his own small team.\n\nYears later, he asked her why she'd taken the risk. She told him her younger brother had been in prison once too. “Nobody gave him a chance,” she said. “I didn't want to be one of those people.”",v:[["released","dibebaskan"],["carpentry","pertukangan kayu"],["criminal record","catatan kriminal"],["abruptly","tiba-tiba"],["background check","pemeriksaan latar belakang"],["excuses","alasan / pembelaan"],["trial","masa percobaan"]],q:[["How many jobs did Danu apply for before Bu Sekar's?","Thirty-seven."],["Why did Bu Sekar hire him?","Her brother had been in prison and nobody gave him a chance."]]},
{t:"The Village Doctor",lv:3,x:"Dr. Amelia had imagined a career in a big city hospital, with modern equipment and a respected title. Instead, after graduating, she was assigned to a public health center on a remote island in eastern Indonesia for her mandatory service.\n\nThe island had one road, unreliable electricity, and a boat to the mainland twice a week, weather permitting. The health center had a few beds, a basic supply of medicine, and a refrigerator that broke down every time the power went out.\n\nShe cried on her first night. She was the only doctor for almost eight thousand people.\n\nThe first months were overwhelming. She treated everything: fevers, broken bones, difficult births, snake bites. When the boat couldn't come, she had no way to send seriously ill patients to a hospital. She learned to improvise, to make difficult decisions alone, and to accept that she couldn't save everyone.\n\nBut she also learned things no textbook had taught her. She learned that the village midwife, an old woman with no formal education, knew more about childbirth than most specialists. She learned that patients trusted her more after she attended their weddings and funerals. She learned the local language well enough to understand jokes.\n\nHer mandatory service was supposed to last one year. She stayed for six. When she finally left to specialize, the entire village came to the harbor. An old fisherman, whose life she had saved during a storm, gave her a carved wooden boat. It sits on her desk in the city now, next to her diploma.",v:[["assigned","ditugaskan"],["mandatory service","masa pengabdian wajib"],["mainland","daratan utama"],["weather permitting","jika cuaca memungkinkan"],["overwhelming","sangat berat"],["improvise","berimprovisasi"],["midwife","bidan / dukun beranak"],["harbor","pelabuhan"]],q:[["How long was she supposed to stay?","One year."],["What did the fisherman give her?","A carved wooden boat."]]},
{t:"The Gap Year",lv:3,x:"When Kiki announced that she wanted to take a year off before university, her parents reacted as though she'd suggested joining a circus. In their view, a year without studying was a year wasted, and possibly the beginning of a lifetime of failure.\n\nShe'd been accepted to study accounting, the safe choice her father had recommended. But she wasn't sure it was what she wanted, and the idea of spending four years and a lot of her parents' money on something she wasn't sure about frightened her more than the gap year did.\n\nAfter weeks of arguments, they reached a compromise. She could take the year, but she had to work and pay for her own expenses.\n\nShe got a job at a hotel reception desk, then spent six months volunteering at an organization that helped small rural businesses manage their finances. That was where everything changed. She discovered she loved sitting with a woman who sold handmade soap and helping her understand where her money was going. She liked numbers when they had faces attached to them.\n\nShe started university the following year, still studying accounting, but with a completely different motivation. She knew exactly why she was there. She graduated with honors and now works on financial programs for small businesses in rural areas.\n\nHer father eventually admitted that the gap year was the best decision she ever made. Though he still insists, with some pride, that he chose the right major for her in the first place.",v:[["gap year","jeda setahun sebelum kuliah"],["reacted","bereaksi"],["compromise","kompromi"],["expenses","biaya / pengeluaran"],["rural","pedesaan"],["with honors","dengan predikat cum laude"],["major","jurusan"]],q:[["What was the compromise?","She could take the year but had to work and pay for herself."],["What did she discover she loved?","Numbers that had faces attached: helping small business owners."]]},
{t:"The Bridge",lv:3,x:"For generations, the children of Kampung Sentolo crossed the river to school on a rope bridge that swayed dangerously in the wind. During the rainy season, the river rose so high that the bridge became impossible to use, and the children simply missed school for weeks.\n\nThe village had asked the local government for a proper bridge for twenty years. Every election, candidates came and promised one. Photos were taken. Nothing happened.\n\nIn 2019, a young civil engineer named Rudi came home to visit his mother. He had grown up in the village and crossed the same rope bridge as a boy. Seeing children still balancing on it, years after he had left, made him angry in a way he couldn't explain.\n\nHe went back to the city, designed a simple, sturdy suspension bridge, and calculated the cost. It was far less than he'd expected. He posted the plans online, along with a video of children crossing the old bridge. Donations started coming in from strangers all over the country.\n\nBut money wasn't enough. They needed workers. So the villagers built it themselves. Farmers carried steel cables on their shoulders. Women cooked for the workers. Teenagers mixed concrete after school. Rudi supervised every weekend for eight months.\n\nThe bridge opened on the first day of the new school year. The children ran across it, laughing, while their parents watched from the riverbank.\n\nA month later, an official arrived from the district office, wanting to take a photo with the bridge. The villagers politely let him.",v:[["swayed","bergoyang"],["for generations","turun-temurun"],["candidates","calon"],["civil engineer","insinyur sipil"],["sturdy","kokoh"],["suspension bridge","jembatan gantung"],["supervised","mengawasi"],["riverbank","tepi sungai"]],q:[["Who built the bridge?","The villagers themselves, supervised by Rudi."],["What happened a month after it opened?","An official came to take a photo with the bridge."]]},
{t:"Lost in Translation",lv:3,x:"Benny had been living in Australia for three months, and he was proud of how well his English was going. He could handle meetings, order coffee, and even understand most jokes.\n\nThen his manager invited him to a barbecue at her house. “Bring a plate,” she said.\n\nBenny was confused. Did she not have enough plates? He felt slightly embarrassed for her but didn't want to ask. So on Saturday, he arrived with a brand new ceramic plate, still in its box, wrapped in nice paper.\n\nHis manager opened the door, looked at the box, and asked what it was. “A plate,” Benny said. “You said to bring one.”\n\nThere was a long pause. Then she burst out laughing so hard that she had to hold the door frame. In Australia, she explained, “bring a plate” means bring a plate of food to share. Everyone else had arrived with salads, desserts, and sausage rolls.\n\nBenny wanted to disappear. But to his surprise, the story became the highlight of the party. Every new guest who arrived heard it. Everyone had a story of their own: the British colleague who'd been confused by “arvo” (afternoon), the American who didn't know that “thongs” meant flip-flops.\n\nBy the end of the night, Benny had made five new friends. His manager used the plate to serve the dessert.\n\nNow, whenever there's a team event, someone always says, “Benny, bring a plate.” And he always brings a real one, with food on it, as a joke.",v:[["handle","menangani"],["brand new","baru gres"],["burst out laughing","tertawa terbahak-bahak"],["door frame","kusen pintu"],["highlight","momen terbaik"],["arvo","sore (slang Australia)"],["thongs","sandal jepit (Australia)"]],q:[["What does 'bring a plate' mean in Australia?","Bring a plate of food to share."],["What does 'arvo' mean?","Afternoon."]]}
);
